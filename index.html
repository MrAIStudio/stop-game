<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>イライラすとっぷ - 完全版</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
text-align:center;
overflow:hidden;
transition:0.1s;
}

.shake{
animation:shake 0.3s;
}

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(10px,0);}
50%{transform:translate(-10px,0);}
75%{transform:translate(10px,0);}
100%{transform:translate(0,0);}
}

.flash{
animation:flash 0.3s;
}

@keyframes flash{
0%{background:#300;}
100%{background:#111;}
}

h1{
font-size:40px;
}

.sub{
font-size:20px;
line-height:1.8;
color:#ccc;
}

button{
font-size:28px;
padding:15px 50px;
border-radius:20px;
border:none;
cursor:pointer;
}

#banBtn{
background:#ff4444;
color:white;
font-weight:bold;
box-shadow:0 0 10px #ff0000;
}

#game{
display:none;
}

.field{
width:90%;
height:320px;
margin:20px auto;
background:#222;
border:3px solid white;
position:relative;
overflow:hidden;
}

.ufo{
position:absolute;
top:130px;
font-size:50px;
left:0;
transition:0.05s;
}

.bubble{
position:absolute;
top:50px;
background:white;
color:black;
padding:8px 12px;
border-radius:15px;
font-size:16px;
white-space:nowrap;
}

.bullet{
position:absolute;
bottom:20px;
font-size:35px;
display:none;
}

.status{
font-size:20px;
}

.bar{
width:80%;
height:25px;
background:#333;
margin:10px auto;
border-radius:20px;
overflow:hidden;
}

#stress{
height:100%;
width:0%;
background:red;
transition:0.2s;
}

#message{
font-size:22px;
min-height:50px;
}

/* BAN! エフェクト */
.banFlash{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
font-size:80px;
color:#ff2222;
font-weight:bold;
text-shadow:0 0 20px #ff0000;
animation:banAnim 0.4s forwards;
pointer-events:none;
}

@keyframes banAnim{
0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
100%{opacity:0; transform:translate(-50%,-50%) scale(2);}
}

/* 爆発エフェクト */
.explode{
position:absolute;
font-size:40px;
animation:boom 0.6s forwards;
}

@keyframes boom{
0%{opacity:1; transform:scale(1);}
100%{opacity:0; transform:scale(3);}
}

/* 星エフェクト */
.star{
position:absolute;
color:yellow;
font-size:20px;
animation:starFly 0.8s forwards;
}

@keyframes starFly{
0%{opacity:1; transform:translate(0,0);}
100%{opacity:0; transform:translate(80px,-80px);}
}

</style>

</head>

<body>


<div id="title">

<h1>😡 イライラすとっぷ</h1>

<div class="sub">
🛸 煽るUFOを予測して撃て！<br>
ストレス10で即ゲームオーバー<br><br>
BAN! で未来を読め！
</div>

<button onclick="startGame()">START</button>

<h2>🏆 TOP5</h2>
<div id="ranking"></div>

</div>



<div id="game">

<div class="field">

<div id="bubble" class="bubble">こっちだよ〜😏</div>

<div id="ufo" class="ufo">🛸</div>

<div id="bullet" class="bullet">💥</div>

</div>

<div class="status">
スコア：<span id="score">0</span><br>
ストレス（10段階）
</div>

<div class="bar"><div id="stress"></div></div>

<button id="banBtn" onclick="stopGame()">BAN！</button>

</div>

<div id="message"></div>

<script>

let ufo, bubble, bullet;
let x=0, dir=1, speed=4;
let timer;
let score=0;
let stress=0;
let audio;

let firing = false; // ★ 連射防止

let ufoType = "normal";
let zigzagOffset = 0;

let comments=[
"こっちだよ〜😏","今押すと思った？🤣","残念、逆でした〜","読めるかな？笑",
"未来予測してみな？","あと0.2秒だったね","焦ってる？😏","読みが浅いね〜",
"もっと集中しなよ？","今のは惜しい！","揺さぶられてるね〜","反応遅いよ？笑",
"まだまだだね😈","予測できてる？","迷ってるの見えてるよ？","今のは罠だよ〜",
"ふふふ😏","読めないでしょ？","揺らしていくよ〜","そのタイミングじゃないよ",
"逆だって言ったよね？","もっと早く！","もっと遅く！","揺れるよ〜？",
"惑わされてるね〜","今のはフェイント！","見抜けるかな？","まだ本気じゃないよ？",
"そろそろ本気出す？😈"
];

function banSound(){
    if(!audio) audio = new AudioContext();

    // 低音爆発
    let osc1 = audio.createOscillator();
    let gain1 = audio.createGain();
    osc1.frequency.value = 80;
    gain1.gain.setValueAtTime(0.6, audio.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);

    // 高音破裂
    let osc2 = audio.createOscillator();
    let gain2 = audio.createGain();
    osc2.frequency.value = 900;
    gain2.gain.setValueAtTime(0.3, audio.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);

    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(audio.destination);
    gain2.connect(audio.destination);

    osc1.start();
    osc2.start();
    osc1.stop(audio.currentTime + 0.25);
    osc2.stop(audio.currentTime + 0.15);
}

function startGame(){
document.getElementById("title").style.display="none";
document.getElementById("game").style.display="block";
ufo=document.getElementById("ufo");
bubble=document.getElementById("bubble");
bullet=document.getElementById("bullet");
banSound();
move();
}

function chooseUFO(){
let r=Math.random();
if(r<0.05){ ufoType="rare"; }
else if(r<0.25){ ufoType="fast"; }
else if(r<0.45){ ufoType="zigzag"; }
else{ ufoType="normal"; }
}

function move(){
chooseUFO();
timer=setInterval(()=>{

if(ufoType==="fast") speed=10;
if(ufoType==="normal") speed=4+Math.random()*3;
if(ufoType==="zigzag"){
speed=5;
zigzagOffset = Math.sin(Date.now()/80)*30;
ufo.style.top = (130 + zigzagOffset)+"px";
}

x += speed * dir;

if(x > window.innerWidth*0.75){ dir=-1; }
if(x < 0){ dir=1; }

if(ufoType==="rare"){
ufo.style.filter="drop-shadow(0 0 20px gold)";
bubble.innerHTML="レアUFOだよ😎";
}else{
ufo.style.filter="none";
}

if(Math.random()<0.015) phantom();

ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";

if(Math.random()<0.02){
bubble.innerHTML=comments[Math.floor(Math.random()*comments.length)];
}

},20);
}

function phantom(){
bubble.innerHTML="今まで本気だったと思った？😈";
speed=18;
let count=0;
let fast=setInterval(()=>{
x += speed * dir;
ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";
count++;
if(count>20){
clearInterval(fast);
speed=4+Math.random()*3;
}
},20);
}

function stopGame(){

if(firing) return;
firing = true;

clearInterval(timer);
banSound();

// BAN! 演出
let fx = document.createElement("div");
fx.className = "banFlash";
fx.innerHTML = "BAN!!";
document.body.appendChild(fx);
setTimeout(()=>fx.remove(),400);

navigator.vibrate?.([80,50,80]);

bullet.style.display = "block";
bullet.style.left = "50%";
bullet.style.bottom = "20px";

slowBullet();
}

function slowBullet(){

let pos = 20;
let target = 160;
let speedB = 2;

let bulletTimer = setInterval(()=>{

pos += speedB;
bullet.style.bottom = pos + "px";

if(pos >= target){

clearInterval(bulletTimer);
bullet.style.display = "none";

judge();
}

}, 16);
}

function explodeEffect(){
let boom=document.createElement("div");
boom.className="explode";
boom.innerHTML="💥";
boom.style.left=(x)+"px";
boom.style.top="130px";
document.body.appendChild(boom);
setTimeout(()=>boom.remove(),600);

for(let i=0;i<5;i++){
let star=document.createElement("div");
star.className="star";
star.innerHTML="⭐";
star.style.left=(x)+"px";
star.style.top="130px";
document.body.appendChild(star);
setTimeout(()=>star.remove(),800);
}
}

function judge(){

let center=window.innerWidth/2;
let distance=Math.abs((x+25)-center);

if(distance < 30){

score++;
stress -= 1;
if(stress < 0) stress = 0;

explodeEffect();
navigator.vibrate?.(100);

document.body.classList.add("shake");
setTimeout(()=>document.body.classList.remove("shake"),300);

document.getElementById("message").innerHTML="🎯 HIT！";

}else{

stress += 1;

navigator.vibrate?.([50,50,100]);

document.body.classList.add("flash");
setTimeout(()=>document.body.classList.remove("flash"),300);

document.getElementById("message").innerHTML="😈 MISS！";
}

// ゲームオーバー判定
if(stress >= 10){
stress = 10;
document.getElementById("stress").style.width = "100%";
document.getElementById("message").innerHTML = "💀ストレス限界突破…GAME OVER";

navigator.vibrate?.([200,100,200]);

setTimeout(()=>{ showRetry(); },1200);

return;
}

document.getElementById("score").innerHTML=score;
document.getElementById("stress").style.width=(stress*10)+"%";

saveScore();

firing = false;

setTimeout(()=>{
document.getElementById("message").innerHTML="";
move();
},1200);
}

function showRetry(){
let btn = document.createElement("button");
btn.innerHTML = "RETRY";
btn.style.fontSize = "30px";
btn.style.padding = "15px 40px";
btn.style.marginTop = "20px";
btn.style.borderRadius = "20px";
btn.style.background = "#00ff99";
btn.style.color = "black";
btn.onclick = ()=>location.reload();
document.getElementById("message").appendChild(btn);
}

function saveScore(){
let data=JSON.parse(localStorage.getItem("rank") || "[]");
data.push(score);
data.sort((a,b)=>b-a);
data=data.slice(0,5);
localStorage.setItem("rank",JSON.stringify(data));
showRank();
}

function showRank(){
let data=JSON.parse(localStorage.getItem("rank") || "[]");
let html="";
data.forEach((v,i)=>{ html+=(i+1)+"位 "+v+"点<br>"; });
document.getElementById("ranking").innerHTML=html || "まだ記録なし";
}

showRank();

</script>

</body>
</html>
