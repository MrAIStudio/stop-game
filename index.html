<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>靴飛ばし大飛行！</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
 user-select:none;
}

body{
 margin:0;
 min-height:100vh;
 background:linear-gradient(160deg,#bfe4ff 0%,#eaf8ff 45%,#fff8eb 100%);
 color:#33465e;
 font-family:"Hiragino Maru Gothic ProN","Yu Gothic","M PLUS Rounded 1c",sans-serif;
 text-align:center;
 overflow-x:hidden;
}

.wrap{
 max-width:480px;
 margin:auto;
 padding:14px 12px 30px;
}

h1{
 font-size:27px;
 margin:7px 0 3px;
 color:#294b6d;
 text-shadow:0 2px #fff;
}

.badge{
 display:inline-block;
 background:linear-gradient(135deg,#ff9068,#ffd15b);
 color:#633b1d;
 padding:5px 15px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
}

.sub{
 font-size:13px;
 line-height:1.7;
 margin:8px 0 12px;
 color:#506b89;
}

button{
 font-family:inherit;
 border:0;
 font-weight:bold;
 border-radius:50px;
 cursor:pointer;
}

.bigBtn{
 font-size:21px;
 padding:13px 48px;
 color:#fff;
 background:linear-gradient(135deg,#ff7357,#ffb703);
 box-shadow:0 8px 18px #ff735760;
}

.shoeGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:12px 0;
}

.shoeCard{
 background:#fff;
 border:2px solid #dce8f3;
 border-radius:15px;
 padding:7px 3px;
 box-shadow:0 3px 9px #33465e12;
}

.shoeCard.active{
 border-color:#ff795c;
 background:#fff4ed;
 box-shadow:0 4px 15px #ff795c40;
}

.shoeCard .emo{
 font-size:27px;
}

.shoeCard .nm{
 font-size:11px;
 font-weight:bold;
}

.flavorBox{
 background:#fff;
 border:1px solid #dce8f3;
 border-radius:14px;
 padding:9px;
 font-size:12px;
 min-height:38px;
}

.rankBox{
 background:#fff;
 border:1px solid #dce8f3;
 border-radius:15px;
 margin-top:10px;
 padding:8px 0;
}

.rankBox h2{
 margin:4px 0 7px;
 font-size:15px;
}

.rankRow,
.statRow{
 display:flex;
 justify-content:space-between;
 padding:4px 18px;
 font-size:13px;
 border-bottom:1px solid #edf2f6;
}

.statRow{
 font-size:12px;
}

.statRow span:last-child{
 font-weight:bold;
 color:#294b6d;
}

#gameScreen{
 display:none;
}

.gameWrap{
 position:relative;
 width:100%;
 max-width:480px;
 margin:auto;
}

canvas{
 width:100%;
 display:block;
 border-radius:20px;
 background:#bfe4ff;
 box-shadow:0 6px 20px #33465e35;
 touch-action:manipulation;
}

.hud{
 position:absolute;
 top:8px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 gap:4px;
 padding:0 8px;
 pointer-events:none;
}

.hudBox{
 background:#ffffffdd;
 border-radius:12px;
 padding:4px 8px;
 font-size:10px;
 font-weight:bold;
 box-shadow:0 2px 8px #33465e20;
}

.hudBox .big{
 font-size:17px;
 color:#ff7657;
}

#eventMsg{
 position:absolute;
 top:48px;
 left:50%;
 transform:translateX(-50%) scale(.9);
 background:#39294fe8;
 color:#ffe29d;
 padding:6px 15px;
 border-radius:15px;
 font-size:13px;
 font-weight:bold;
 opacity:0;
 transition:.18s;
 white-space:nowrap;
 pointer-events:none;
}

#eventMsg.show{
 opacity:1;
 transform:translateX(-50%) scale(1);
}

#comboMsg{
 position:absolute;
 top:92px;
 left:50%;
 transform:translateX(-50%) scale(.7);
 font-size:25px;
 font-weight:900;
 color:#fff;
 text-shadow:0 3px #c65b24,0 0 12px #ffc34e;
 opacity:0;
 pointer-events:none;
}

#comboMsg.show{
 animation:comboPop .65s forwards;
}

@keyframes comboPop{
 0%{
  opacity:0;
  transform:translateX(-50%) scale(.5);
 }
 25%{
  opacity:1;
  transform:translateX(-50%) scale(1.2);
 }
 100%{
  opacity:0;
  transform:translateX(-50%) scale(1);
 }
}

#judge{
 position:absolute;
 top:145px;
 left:50%;
 transform:translate(-50%,-50%);
 font-size:30px;
 font-weight:900;
 opacity:0;
 pointer-events:none;
 text-shadow:0 3px 2px #555;
}

#judge.show{
 animation:judge .7s forwards;
}

@keyframes judge{
 0%{
  opacity:0;
  transform:translate(-50%,-50%) scale(.5) rotate(-8deg);
 }
 20%{
  opacity:1;
  transform:translate(-50%,-50%) scale(1.15) rotate(4deg);
 }
 100%{
  opacity:0;
  transform:translate(-50%,-90%) scale(1);
 }
}

.fireBtnWrap{
 margin-top:10px;
}

#fireBtn{
 font-size:21px;
 padding:13px 52px;
 color:#fff;
 background:linear-gradient(135deg,#ff7357,#ffb703);
 box-shadow:0 8px 18px #ff735760;
}

.tapHint{
 margin-top:5px;
 font-size:11px;
 color:#7189a4;
}

.timingBox{
 width:90%;
 margin:8px auto 0;
}

.timingTrack{
 height:12px;
 background:#ffffffaa;
 border-radius:20px;
 position:relative;
 overflow:hidden;
 border:1px solid #fff;
}

.timingGood{
 position:absolute;
 left:30%;
 width:40%;
 height:100%;
 border-left:2px solid #61c875;
 border-right:2px solid #61c875;
}

.timingPerfect{
 position:absolute;
 left:44%;
 width:12%;
 height:100%;
 background:#ffd052;
}

.timingCursor{
 position:absolute;
 top:-3px;
 width:5px;
 height:18px;
 background:#ff4444;
 border-radius:5px;
}

.timingLabel{
 font-size:11px;
 margin-top:3px;
 color:#fff;
 font-weight:bold;
 text-shadow:0 1px 2px #333;
}

.resultOverlay{
 display:none;
 position:absolute;
 inset:0;
 background:#0d1b2ae8;
 border-radius:20px;
 color:#fff;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 padding:15px;
}

.resultOverlay.show{
 display:flex;
}

.distTitle{
 font-size:14px;
 color:#cde3ff;
}

.distNum{
 font-size:53px;
 font-weight:900;
 color:#ffd057;
 text-shadow:0 3px #a96f15;
 margin:3px 0;
}

.distMsg{
 font-size:14px;
 margin-bottom:5px;
}

.record{
 color:#ffd057;
 font-weight:bold;
 min-height:20px;
}

.resultStats{
 font-size:12px;
 color:#d8e6f5;
 margin:4px 0 12px;
}

.resultBtnRow{
 display:flex;
 gap:9px;
}

.resultBtnRow button{
 padding:10px 18px;
 font-size:14px;
}

.retryBtn{
 background:linear-gradient(135deg,#ff7357,#ffb703);
 color:#fff;
}

.backBtn{
 background:#ffffff22;
 color:#fff;
 border:1px solid #ffffff55;
}
</style>
</head>

<body>

<div class="wrap">

<div id="titleScreen">

<div class="badge">SHOE FLYING DISTANCE GAME</div>

<h1>👟 靴飛ばし大飛行！</h1>

<div class="sub">

ポンポン跳ねて、風に乗って、どこまでも飛ばそう！
</div>

靴を選んでね
</div>

<button class="bigBtn" onclick="beginAttempt()">
スタート
</button>

<div class="rankBox">
<h2>🏆 自己ベスト TOP5</h2>

</div>

<div class="rankBox">
<h2>📊 統計</h2>
<div id="statsList"></div>
</div>

</div>


<div id="gameScreen">

<div class="gameWrap">

<canvas id="cv"></canvas>

<div class="hud">

<div class="hudBox">
きょり<br>
<span class="big" id="distHud">0 m</span>
</div>

<div class="hudBox" id="windHud">
🌤 無風
</div>

<div class="hudBox">
🔥 <span id="comboHud">0</span>
</div>

<div class="hudBox" id="shoeHud">
👟
</div>

</div>

<div id="eventMsg"></div>

<div id="comboMsg"></div>

<div id="judge"></div>

<div class="resultOverlay" id="resultOverlay">

<div class="distTitle">
最終飛距離
</div>

<div class="distNum" id="resultDist">
0m
</div>

<div class="distMsg" id="resultMsg"></div>

<div class="record" id="resultRecord"></div>

<div class="resultStats" id="resultStats"></div>

<div class="resultBtnRow">

<button class="retryBtn" onclick="retryAttempt()">
もう一度
</button>

<button class="backBtn" onclick="backToTitle()">
靴を選び直す
</button>

</div>

</div>

</div>

<div class="timingBox">

<div class="timingTrack">
<div class="timingGood"></div>
<div class="timingPerfect"></div>
<div class="timingCursor" id="timingCursor"></div>
</div>

黄色で「とぶ！」＝ PERFECT！
</div>

</div>

<div class="fireBtnWrap">

<button id="fireBtn" onclick="release()">
とぶ！
</button>

</div>

<div class="tapHint">
画面タップでも発射できます
</div>

</div>

</div>


<script>

/* =====================================================
   設定
===================================================== */

const GRAVITY=300;

/*
  風をかなり弱くした。
  「戻される」のではなく、
  基本的には速度を補助するだけ。
*/
const WIND_BASE=35;

/*
  画面上の距離。
*/
const PPM=18;

const SWING_ROPE=120;
const SWING_MAX_ANGLE=.96;
const SWING_PERIOD=1.6;

const SHOE_RADIUS=15;

/*
  低すぎる速度でも無限に跳ねない。
*/
const BOUNCE_MIN_SPEED=55;

/*
  転がり停止判定。
  前よりかなり強く止まる。
*/
const STOP_SPEED=32;

/*
  転がり摩擦を強化。
*/
const ROLL_FRICTION=2.8;

const MAX_FLIGHT_TIME=22;

const SAVE_KEY="kutsutobashi_v3";


/* =====================================================
   靴
===================================================== */

const SHOES=[

{
 id:"sneaker",
 name:"スニーカー",
 emoji:"👟",
 restitution:.62,
 friction:.42,
 drag:.045,
 launchScale:1,
 wind:1,
 flavor:"バランス型。ほどよく跳ねてほどよく止まる。"
},

{
 id:"sandal",
 name:"サンダル",
 emoji:"🩴",
 restitution:.82,
 friction:.52,
 drag:.08,
 launchScale:.95,
 wind:1.35,
 flavor:"超バウンド型。風に乗ると一気に飛ぶ。"
},

{
 id:"leather",
 name:"革靴",
 emoji:"👞",
 restitution:.42,
 friction:.28,
 drag:.025,
 launchScale:.9,
 wind:.45,
 flavor:"あまり跳ねないが、地面では安定。"
},

{
 id:"boots",
 name:"長靴",
 emoji:"👢",
 restitution:.48,
 friction:.48,
 drag:.08,
 launchScale:.86,
 wind:.5,
 holeSurvive:.65,
 flavor:"重い。でも穴に強い。"
},

{
 id:"heels",
 name:"ハイヒール",
 emoji:"👠",
 restitution:.65,
 friction:.12,
 drag:.04,
 launchScale:1,
 wind:.8,
 wild:true,
 flavor:"跳ねて滑って大暴走。何が起きるか分からない。"
},

{
 id:"uwabaki",
 name:"上履き",
 emoji:"🥿",
 restitution:.67,
 friction:.38,
 drag:.035,
 launchScale:1.18,
 wind:1.05,
 flavor:"初速最強。高く跳ねる。"
},

{
 id:"geta",
 name:"下駄",
 emoji:"👡",
 restitution:.38,
 friction:.18,
 drag:.02,
 launchScale:.84,
 wind:.35,
 flavor:"あまり跳ねない代わりに地面を滑走。"
},

{
 id:"crocs",
 name:"クロックス",
 emoji:"🥾",
 restitution:.58,
 friction:.45,
 drag:.07,
 launchScale:1,
 wind:1.5,
 flavor:"風の申し子。風に乗ったら強い。"
},

{
 id:"roller",
 name:"ローラー",
 emoji:"🛼",
 restitution:.25,
 friction:.10,
 drag:.04,
 launchScale:.94,
 wind:.65,
 flavor:"跳ねない。だが転がる。止まらない。"
}

];


/* =====================================================
   状態
===================================================== */

let canvas,ctx;

let W=480;
let H=380;

let state="title";

let course;

let cameraX=0;

let swingT=0;

let selectedShoeId="sneaker";

let shoe={
 x:0,
 y:0,
 vx:0,
 vy:0,
 rotation:0,
 rolling:false,
 overHole:false,
 bounceCount:0,
 heelBroken:false,
 heelBrokenTriggered:false
};

let particles=[];

let lastTime=0;

let currentDistanceM=0;
let finalDistanceM=0;

let windValue=0;
let windAnimT=0;

let combo=0;
let coins=0;

let flightTime=0;

let settleTimer=0;

let audio=null;

let stats={
 best:0,
 plays:0,
 top:[]
};


/* =====================================================
   共通
===================================================== */

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function currentShoe(){
 return SHOES.find(
  s=>s.id===selectedShoeId
 );
}


/* =====================================================
   セーブ
===================================================== */

function loadSave(){

 try{

  const raw=
   localStorage.getItem(SAVE_KEY);

  if(raw){

   const d=JSON.parse(raw);

   if(d.stats)
    Object.assign(
     stats,
     d.stats
    );

  }

 }catch(e){}

}

function writeSave(){

 try{

  localStorage.setItem(
   SAVE_KEY,
   JSON.stringify({stats})
  );

 }catch(e){}

}


/* =====================================================
   風
===================================================== */

function rollWind(){

 /*
   風の強さを弱める。

   -1 = 弱い向かい風
   +1 = 追い風

   強い向かい風を出しすぎない。
 */

 windValue=
  (Math.random()*.9-.25);

 windValue=
  clamp(
   windValue,
   -.35,
   .9
  );

}

function windLabel(){

 const a=Math.abs(windValue);

 if(a<.12)
  return "🌤 無風";

 if(windValue>0){

  if(a>.65)
   return "💨 追い風・強";

  return "💨 追い風";

 }

 return "🍃 向かい風・弱";

}


/* =====================================================
   コース
===================================================== */

function generateCourse(){

 const TARGET=18000;

 const ground=[
  {x:0,y:260}
 ];

 const holes=[];
 const ramps=[];
 const windZones=[];
 const coinsList=[];

 let x=0;
 let y=260;

 while(x<TARGET){

  let len=
   160+
   Math.random()*230;

  const r=Math.random();

  if(r<.28){

   y-=
    20+
    Math.random()*45;

  }else if(r<.50){

   y+=
    20+
    Math.random()*50;

  }

  y=clamp(y,100,315);

  x+=len;

  ground.push({
   x,
   y
  });


  /*
    ジャンプ台

    出現率を少し上げる。
  */

  if(Math.random()<.22){

   ramps.push({
    x:x+15,
    y:y-50,
    width:60
   });

  }


  /*
    穴

    飛んでいれば普通に越えられる。
    落ちたときだけ危険。
  */

  if(
   x>600 &&
   Math.random()<.16
  ){

   const gap=
    45+
    Math.random()*65;

   holes.push({
    start:x+25,
    end:x+25+gap,
    yStart:y,
    yEnd:y
   });

   x+=
    gap+
    25;

   ground.push({
    x,
    y
   });

  }


  /*
    風ゾーン
  */

  if(Math.random()<.15){

   windZones.push({
    start:x+20,
    end:x+180,
    power:
     Math.random()>.35
      ?1
      :-1
   });

  }


  /*
    コイン
  */

  if(Math.random()<.32){

   coinsList.push({
    x:
     x+
     40+
     Math.random()*100,

    y:
     y-
     35-
     Math.random()*100,

    got:false
   });

  }

 }


 return{
  ground,
  holes,
  ramps,
  windZones,
  coins:coinsList,
  length:x
 };

}


/* =====================================================
   地面
===================================================== */

function groundInfoAt(x){

 const g=course.ground;

 for(
  let i=0;
  i<g.length-1;
  i++
 ){

  if(
   x>=g[i].x &&
   x<=g[i+1].x
  ){

   const dx=
    g[i+1].x-
    g[i].x;

   const t=
    (x-g[i].x)/
    (dx||1);

   const y=
    g[i].y+
    (g[i+1].y-g[i].y)*t;

   const slope=
    (g[i+1].y-g[i].y)/
    (dx||1);

   return{
    y,
    slope
   };

  }

 }

 return null;

}


function holeAt(x){

 return course.holes.find(
  h=>
   x>=h.start &&
   x<=h.end
 );

}


/* =====================================================
   バウンド
===================================================== */

function bounceVelocity(
 vx,
 vy,
 slope,
 restitution
){

 const len=
  Math.sqrt(
   slope*slope+1
  );

 const nx=
  slope/len;

 const ny=
  -1/len;

 const dot=
  vx*nx+
  vy*ny;

 return{

  vx:
   (vx-2*dot*nx)*
   restitution,

  vy:
   (vy-2*dot*ny)*
   restitution

 };

}


/* =====================================================
   物理
===================================================== */

function physicsStep(dt){

 const variant=
  currentShoe();


 /* 重力 */

 shoe.vy+=
  GRAVITY*dt;


 /* 空気抵抗 */

 shoe.vx*=
  1-
  variant.drag*dt;

 shoe.vy*=
  1-
  variant.drag*.5*dt;


 /*
   風

   ここが今回の重要ポイント。

   風で速度が逆転することを防ぐ。
 */

 let windAccel=
  windValue*
  WIND_BASE*
  variant.wind;

 /*
   向かい風は弱くする
 */

 if(windValue<0){

  windAccel*=.45;

 }


 /*
   風は「現在の進行方向」を
   逆転させない。

   前に進んでいるなら、
   追い風はしっかり効く。
 */

 if(
  shoe.vx>0 ||
  windAccel>0
 ){

  shoe.vx+=
   windAccel*dt;

 }


 /* 風ゾーン */

 for(
  const z of course.windZones
 ){

  if(
   shoe.x>=z.start &&
   shoe.x<=z.end
  ){

   let zoneForce=
    z.power*
    55*
    variant.wind;

   /*
     向かい方向は弱く
   */

   if(
    zoneForce<0
   ){

    zoneForce*=.35;

   }


   /*
     速度がマイナスになるほど
     押さない
   */

   if(
    shoe.vx>0 ||
    zoneForce>0
   ){

    shoe.vx+=
     zoneForce*dt;

   }


   if(
    z.power>0 &&
    shoe.vx>220 &&
    Math.random()<.02
   ){

    flashMessage(
     "💨 風に乗ったーー！！"
    );

    spawnBurst(
     shoe.x,
     shoe.y,
     8
    );

   }

  }

 }


 /* 移動 */

 shoe.x+=
  shoe.vx*dt;

 shoe.y+=
  shoe.vy*dt;

 shoe.rotation+=
  shoe.vx*
  dt*
  .06;


 currentDistanceM=
  Math.max(
   0,
   shoe.x/PPM
  );


 updateHud();


 /* =================================================
    コイン
 ================================================= */

 for(
  const c of course.coins
 ){

  if(c.got)
   continue;


  const d=
   Math.hypot(
    shoe.x-c.x,
    shoe.y-c.y
   );


  if(d<32){

   c.got=true;

   coins++;

   combo++;

   flashCombo();

   spawnBurst(
    c.x,
    c.y,
    12
   );

   playCoinSound();

  }

 }


 /* =================================================
    ゴール
 ================================================= */

 if(
  shoe.x>=course.length
 ){

  finishRun(
   true,
   false
  );

  return;

 }


 /* =================================================
    穴
 ================================================= */

 const hole=
  holeAt(shoe.x);


 if(hole){

  if(!shoe.overHole){

   shoe.overHole=true;

   shoe.holeStartY=
    shoe.y;

  }


  /*
    空中にいる限り
    基本的にそのまま飛ぶ。
  */

  if(
   shoe.y-
   shoe.holeStartY>
   250
  ){

   handleHoleFall();

   return;

  }

 }else{

  shoe.overHole=false;

 }


 const g=
  groundInfoAt(
   shoe.x
 );


 if(!g)
  return;


 /* =================================================
    着地
 ================================================= */

 if(
  shoe.y+
  SHOE_RADIUS>=g.y &&
  shoe.vy>0
 ){

  shoe.y=
   g.y-
   SHOE_RADIUS;


  const speed=
   Math.hypot(
    shoe.vx,
    shoe.vy
   );


  /* =================================================
     ジャンプ台
  ================================================= */

  const ramp=
   course.ramps.find(
    r=>
     shoe.x>=r.x &&
     shoe.x<=r.x+r.width
   );


  if(ramp){

   /*
     ここはかなり気持ちよく。
   */

   shoe.vy=
    -Math.max(
     190,
     Math.abs(shoe.vx)*.65
    );


   shoe.rolling=false;

   combo++;

   flashCombo();

   flashMessage(
    "🚀 ジャンプ台で大ジャンプ！！"
   );

   spawnBurst(
    shoe.x,
    shoe.y,
    18
   );

   playJumpSound();

   return;

  }


  /* =================================================
     ポンポンバウンド
  ================================================= */

  if(
   speed>
   BOUNCE_MIN_SPEED
  ){

   let rest=
    variant.restitution;


   /*
     バウンドするたびに
     少しだけ弱くなる。

     ただし弱くなりすぎない。
   */

   const bounceDecay=
    Math.pow(
     .91,
     Math.min(
      shoe.bounceCount,
      5
     )
    );


   rest=
    Math.max(
     rest*bounceDecay,
     .24
    );


   /*
     ハイヒールはランダム。
   */

   if(
    variant.wild
   ){

    rest=
     clamp(
      rest+
      (Math.random()-.5)*.35,
      .25,
      .9
     );

   }


   const res=
    bounceVelocity(
     shoe.vx,
     shoe.vy,
     g.slope,
     rest
    );


   shoe.vx=
    res.vx;

   shoe.vy=
    res.vy;


   shoe.bounceCount++;

   combo++;

   flashCombo();

   spawnBurst(
    shoe.x,
    shoe.y,
    8
   );

   playBounceSound(
    speed
   );


   /*
     バウンドが続いたら
     専用メッセージ
   */

   if(
    shoe.bounceCount===3
   ){

    flashMessage(
     "🏀 ポンポン跳ねてる！！"
    );

   }else if(
    shoe.bounceCount>=5
   ){

    flashMessage(
     "🔥 まだ跳ねるの！？"
    );

   }

  }else{

   /*
     低速になったら
     転がりへ。
   */

   shoe.rolling=true;

  }

 }


 /* =================================================
    転がり
 ================================================= */

 if(shoe.rolling){

  const angle=
   Math.atan(g.slope);


  /*
    坂の下方向へ加速
  */

  shoe.vx+=
   GRAVITY*
   Math.sin(angle)*
   dt;


  /*
    今回は摩擦を強くして
    ちゃんと止まるようにする。
  */

  shoe.vx*=
   Math.exp(
    -ROLL_FRICTION*
    variant.friction*
    dt
   );


  shoe.y=
   g.y-
   SHOE_RADIUS;

  shoe.vy=0;


  /*
    停止判定を早める。

    ただし坂なら少し進む。
  */

  if(
   Math.abs(shoe.vx)<
   STOP_SPEED
  ){

   shoe.vx*=.82;

   settleTimer+=dt;

   if(
    settleTimer>.32
   ){

    finishRun(
     false,
     false
    );

    return;

   }

  }else{

   settleTimer=0;

  }

 }

}


/* =====================================================
   穴
===================================================== */

function handleHoleFall(){

 const variant=
  currentShoe();


 /*
   長靴は救済。
 */

 if(
  variant.holeSurvive &&
  Math.random()<
  variant.holeSurvive
 ){

  const h=
   holeAt(shoe.x);


  shoe.x=
   h
    ?h.end+7
    :shoe.x+50;


  shoe.vx=
   Math.max(
    shoe.vx*.65,
    45
   );


  shoe.vy=0;

  shoe.overHole=false;

  const g=
   groundInfoAt(
    shoe.x
   );


  if(g){

   shoe.y=
    g.y-
    SHOE_RADIUS;

  }


  shoe.rolling=true;

  combo++;

  flashMessage(
   "😳 ギリギリセーフ！！"
  );

  playSurviveSound();

 }else{

  combo=0;

  flashMessage(
   "🕳️ あーーーっ！！"
  );

  playHoleFallSound();

  finishRun(
   false,
   true
  );

 }

}


/* =====================================================
   発射
===================================================== */

function release(){

 if(state!=="aiming")
  return;


 const A=
  SWING_MAX_ANGLE;

 const w=
  2*Math.PI/
  SWING_PERIOD;


 const theta=
  A*
  Math.sin(
   w*swingT
  );


 const thetaSpeed=
  A*w*
  Math.cos(
   w*swingT
  );


 const timing=
  clamp(
   (
    thetaSpeed/
    (A*w)+1
   )/2,
   0,
   1
  );


 let judge;


 if(
  timing>=.44 &&
  timing<=.56
 ){

  judge="PERFECT";

 }else if(
  timing>=.30 &&
  timing<=.70
 ){

  judge="GOOD";

 }else{

  judge="MISS";

 }


 showJudge(judge);


 const variant=
  currentShoe();


 const base=
  thetaSpeed*
  SWING_ROPE*
  Math.cos(theta);


 const vertical=
  -thetaSpeed*
  SWING_ROPE*
  Math.sin(theta);


 let multiplier=
  variant.launchScale;


 if(judge==="PERFECT"){

  multiplier*=1.28;

  combo=1;

  flashMessage(
   "🔥 PERFECT発射！！"
  );

  playPerfectSound();

 }else if(
  judge==="GOOD"
 ){

  multiplier*=1.03;

  combo=1;

  flashMessage(
   "👍 GOOD！"
  );

  playLaunchSound();

 }else{

  multiplier*=.60;

  combo=0;

  flashMessage(
   "💀 MISS！"
  );

  playLaunchSound();

 }


 const g0=
  groundInfoAt(0);


 shoe.x=0;

 shoe.y=
  (g0?g0.y:260)-
  140;


 shoe.vx=
  base*
  3.6*
  multiplier;


 shoe.vy=
  vertical*
  3.6*
  multiplier;


 if(judge==="MISS"){

  shoe.vx+=
   (Math.random()-.5)*
   100;

  shoe.vy+=
   (Math.random()-.5)*
   70;

 }


 /*
   最低限の初速を確保。

   「ほぼ真下に落ちる」事故を減らす。
 */

 shoe.vx=
  Math.max(
   shoe.vx,
   80
  );


 shoe.rotation=0;

 shoe.rolling=false;

 shoe.overHole=false;

 shoe.bounceCount=0;

 shoe.heelBroken=
  variant.id==="heels" &&
  Math.random()<.10;

 shoe.heelBrokenTriggered=false;

 currentDistanceM=0;

 flightTime=0;

 settleTimer=0;

 state="flight";

}


/* =====================================================
   終了
===================================================== */

function finishRun(
 reachedEnd,
 holeFall
){

 if(state==="result")
  return;


 state="result";


 let dist=
  reachedEnd
   ?currentDistanceM*1.15
   :currentDistanceM;


 /*
   コンボは控えめ。
 */

 dist+=
  combo*3+
  coins*5;


 finalDistanceM=
  Math.round(
   dist*10
  )/10;


 const isRecord=
  finalDistanceM>
  stats.best;


 stats.plays++;


 if(isRecord)
  stats.best=
   finalDistanceM;


 stats.top.push(
  finalDistanceM
 );


 stats.top.sort(
  (a,b)=>b-a
 );


 stats.top=
  stats.top.slice(0,5);


 writeSave();


 showResult(
  reachedEnd,
  holeFall,
  isRecord
 );


 if(!holeFall)
  playFinishSound(
   reachedEnd
  );

}

   "cv"
  );


 const wrapW=
  Math.min(
   document.querySelector(
    ".gameWrap"
   ).clientWidth||480,
   480
  );


 canvas.width=wrapW;

 canvas.height=380;

 W=canvas.width;

 H=canvas.height;

  );

 };

   背景
===================================================== */

function drawSky(){

 const grad=
  ctx.createLinearGradient(
   0,0,0,H
  );


 grad.addColorStop(
  0,
  "#70c4ef"
 );

 grad.addColorStop(
  .6,
  "#d5f0ff"
 );

 grad.addColorStop(
  1,
  "#fff8ec"
 );


 ctx.fillStyle=grad;

 ctx.fillRect(
  0,0,W,H
 );


 ctx.fillStyle="#ffe27a";

 ctx.beginPath();

 ctx.arc(
  W-50,
  50,
  26,
  0,
  Math.PI*2
 );

 ctx.fill();

}


function drawClouds(camX){

 ctx.fillStyle="#ffffffcc";


 for(
  let i=0;
  i<6;
  i++
 ){

  const baseX=
   i*260-
   ((camX*.15)%260);


  const cx=
   ((baseX%(W+200))+
    W+200)
   %(W+200)-100;


  const cy=
   35+
   ((i*37)%55);


  ctx.beginPath();

  ctx.ellipse(
   cx,
   cy,
   27,
   14,
   0,
   0,
   Math.PI*2
  );

  ctx.ellipse(
   cx+20,
   cy+4,
   20,
   12,
   0,
   0,
   Math.PI*2
  );

  ctx.ellipse(
   cx-20,
   cy+5,
   18,
   11,
   0,
   0,
   Math.PI*2
  );

  ctx.fill();

 }

}


/* =====================================================
   風エフェクト
===================================================== */

function drawWind(camX){

 const a=
  Math.abs(
   windValue
  );


 if(a<.12)
  return;


 ctx.strokeStyle=
  "rgba(255,255,255,.45)";

 ctx.lineWidth=2;


 const dir=
  windValue>0
   ?1
   :-1;


 for(
  let i=0;
  i<5;
  i++
 ){

  let x=
   i*120+
   (
    windAnimT*
    220*
    dir
   )%80;


  x=
   ((x%(W+100))+
    W+100)
   %(W+100)-50;


  const y=
   55+i*25;


  ctx.beginPath();

  ctx.moveTo(
   x,
   y
  );

  ctx.lineTo(
   x+dir*30,
   y
  );

  ctx.stroke();

 }

}


/* =====================================================
   地面・ギミック
===================================================== */

function drawGround(camX){

 const g=
  course.ground;


 ctx.beginPath();

 ctx.moveTo(
  g[0].x-camX,
  g[0].y
 );


 for(
  let i=1;
  i<g.length;
  i++
 ){

  ctx.lineTo(
   g[i].x-camX,
   g[i].y
  );

 }


 ctx.lineTo(
  g[g.length-1].x-camX,
  H
 );

 ctx.lineTo(
  g[0].x-camX,
  H
 );

 ctx.closePath();


 const grad=
  ctx.createLinearGradient(
   0,
   100,
   0,
   H
  );


 grad.addColorStop(
  0,
  "#8ed25e"
 );

 grad.addColorStop(
  .12,
  "#62a63d"
 );

 grad.addColorStop(
  .12,
  "#c98a4b"
 );

 grad.addColorStop(
  1,
  "#80532e"
 );


 ctx.fillStyle=grad;

 ctx.fill();


 ctx.strokeStyle="#4e913a";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(
  g[0].x-camX,
  g[0].y
 );

 for(
  let i=1;
  i<g.length;
  i++
 ){

  ctx.lineTo(
   g[i].x-camX,
   g[i].y
  );

 }

 ctx.stroke();


 /* 穴 */

 for(
  const h of course.holes
 ){

  const x1=
   h.start-camX;

  const x2=
   h.end-camX;


  ctx.fillStyle="#21140c";

  ctx.beginPath();

  ctx.moveTo(
   x1,
   h.yStart
  );

  ctx.lineTo(
   x1,
   H
  );

  ctx.lineTo(
   x2,
   H
  );

  ctx.lineTo(
   x2,
   h.yEnd
  );

  ctx.closePath();

  ctx.fill();


  ctx.font="14px sans-serif";

  ctx.fillText(
   "🕳️",
   (x1+x2)/2,
   h.yStart+25
  );

 }


 /* ジャンプ台 */

 for(
  const r of course.ramps
 ){

  const x=
   r.x-camX;


  ctx.fillStyle="#ff875f";

  ctx.beginPath();

  ctx.moveTo(
   x,
   r.y+50
  );

  ctx.lineTo(
   x+r.width,
   r.y+50
  );

  ctx.lineTo(
   x+r.width,
   r.y
  );

  ctx.closePath();

  ctx.fill();


  ctx.font="17px sans-serif";

  ctx.fillText(
   "🚀",
   x+r.width/2,
   r.y+14
  );

 }


 /* コイン */

 for(
  const c of course.coins
 ){

  if(c.got)
   continue;


  const x=
   c.x-camX;


  if(
   x<-30 ||
   x>W+30
  )
   continue;


  ctx.font="20px sans-serif";

  ctx.fillText(
   "⭐",
   x,
   c.y
  );

 }

}


/* =====================================================
   ブランコ
===================================================== */

function drawSwing(){

 const pivotX=90;
 const pivotY=110;

 const A=
  SWING_MAX_ANGLE;

 const w=
  2*Math.PI/
  SWING_PERIOD;


 const theta=
  A*Math.sin(
   w*swingT
  );


 const thetaSpeed=
  A*w*
  Math.cos(
   w*swingT
  );


 const seatX=
  pivotX+
  Math.sin(theta)*
  SWING_ROPE;


 const seatY=
  pivotY+
  Math.cos(theta)*
  SWING_ROPE;


 ctx.strokeStyle="#876748";

 ctx.lineWidth=8;

 ctx.beginPath();

 ctx.moveTo(
  pivotX-46,
  H-2
 );

 ctx.lineTo(
  pivotX,
  pivotY-8
 );

 ctx.lineTo(
  pivotX+46,
  H-2
 );

 ctx.stroke();


 ctx.strokeStyle=
  thetaSpeed>0
   ?" #ffce54"
   :"#c9b8a0";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(
  pivotX,
  pivotY
 );

 ctx.lineTo(
  seatX,
  seatY
 );

 ctx.stroke();


 if(
  thetaSpeed>
  A*w*.7
 ){

  ctx.fillStyle=
   "#ffce5444";

  ctx.beginPath();

  ctx.arc(
   seatX,
   seatY,
   30,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 ctx.font="30px sans-serif";

 ctx.fillText(
  "🧒",
  seatX,
  seatY-6
 );


 ctx.font="18px sans-serif";

 ctx.fillText(
  currentShoe().emoji,
  seatX+10,
  seatY+16
 );


 ctx.fillStyle="#876748";

 ctx.fillRect(
  seatX-14,
  seatY+2,
  28,
  6
 );

}

function drawShoe(camX){

 ctx.save();

 ctx.translate(
  shoe.x-camX,
  shoe.y
 );

 ctx.rotate(
  shoe.rotation
 );

 ctx.font="30px sans-serif";


 const emoji=
  shoe.heelBrokenTriggered
   ?"🥿"
   :currentShoe().emoji;


 ctx.fillText(
  emoji,
  0,
  0
 );


 ctx.restore();

}


/* =====================================================
   パーティクル
===================================================== */

function spawnBurst(x,y,n){

 for(
  let i=0;
  i<n;
  i++
 ){

  const a=
   Math.random()*
   Math.PI*2;


  const sp=
   60+
   Math.random()*150;


  particles.push({

   x,
   y,

   vx:
    Math.cos(a)*sp,

   vy:
    Math.sin(a)*sp-70,

   life:.5,

   maxLife:.5,

   r:
    2+
    Math.random()*3

  });

 }

}


function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=
   particles[i];


  p.x+=
   p.vx*dt;

  p.y+=
   p.vy*dt;

  p.vy+=
   500*dt;

  p.life-=
   dt;


  if(
   p.life<=0
  ){

   particles.splice(
    i,
    1
   );

  }

 }

}


function drawParticles(camX){

 for(
  const p of particles
 ){

  ctx.globalAlpha=
   clamp(
    p.life/
    p.maxLife,
    0,
    1
   );


  ctx.fillStyle=
   "#ffe09a";


  ctx.beginPath();

  ctx.arc(
   p.x-camX,
   p.y,
   p.r,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 ctx.globalAlpha=1;

}


/* =====================================================
   描画
===================================================== */

function draw(){

 if(!ctx)
  return;


 ctx.clearRect(
  0,
  0,
  W,
  H
 );


 drawSky();


 const cam=
  state==="aiming"
   ?0
   :cameraX;


 drawClouds(cam);

 drawWind(cam);

 drawGround(cam);


 if(
  state==="aiming"
 ){

  drawSwing();

 }


 drawParticles(cam);


 if(
  state==="flight"||
  state==="result"
 ){

  drawShoe(cam);

 }

}


/* =====================================================
   音
===================================================== */

function getAudio(){

 if(!audio){

  audio=
   new(
    window.AudioContext||
    window.webkitAudioContext
   )();

 }

 if(
  audio.state==="suspended"
 ){

  audio.resume();

 }

 return audio;

}


function tone(
 start,
 end,
 duration,
 type="sine",
 volume=.2
){

 const a=
  getAudio();


 const osc=
  a.createOscillator();


 const gain=
  a.createGain();


 osc.type=
  type;


 osc.frequency.setValueAtTime(
  start,
  a.currentTime
 );


 osc.frequency.exponentialRampToValueAtTime(
  Math.max(30,end),
  a.currentTime+
  duration
 );


 gain.gain.setValueAtTime(
  volume,
  a.currentTime
 );


 gain.gain.exponentialRampToValueAtTime(
  .001,
  a.currentTime+
  duration
 );


 osc.connect(gain);

 gain.connect(
  a.destination
 );


 osc.start();

 osc.stop(
  a.currentTime+
  duration
 );

}


function playLaunchSound(){

 tone(
  300,
  900,
  .25,
  "sawtooth",
  .2
 );

}


function playPerfectSound(){

 tone(
  500,
  1400,
  .35,
  "triangle",
  .25
 );

 tone(
  900,
  1700,
  .18,
  "sine",
  .15
 );

}


function playBounceSound(speed){

 const p=
  clamp(
   speed/900,
   .2,
   1
  );


 tone(
  200+p*500,
  100,
  .12,
  "sine",
  .2
 );

}


function playJumpSound(){

 tone(
  500,
  1100,
  .15,
  "triangle",
  .2
 );

}


function playHoleFallSound(){

 tone(
  400,
  60,
  .5,
  "sawtooth",
  .25
 );

}


function playSurviveSound(){

 tone(
  700,
  1000,
  .2,
  "square",
  .15
 );

}


function playCoinSound(){

  700,
  1200,

  "square",
  .12
 );

}


function playFinishSound(good){

 tone(
  good?700:500,
  good?1400:700,
  .4,
  "triangle",
  .25
 );

}


/* =====================================================
   メインループ
===================================================== */

function update(dt){

 windAnimT+=dt;


 if(
  state==="aiming"
 ){

  swingT+=dt;


  const A=
   SWING_MAX_ANGLE;

  const w=
   2*Math.PI/
   SWING_PERIOD;


  const speed=
   A*w*
   Math.cos(
    w*swingT
   );


  const normalized=
   clamp(
    (
     speed/(A*w)+1
    )/2,
    0,
    1
   );


  document.getElementById(
   "timingCursor"
  ).style.left=
   normalized*100+
   "%";


 }else if(
  state==="flight"
 ){

  flightTime+=dt;

  physicsStep(dt);


  if(
   state==="flight"
  ){

   cameraX=
    Math.max(
     0,
     shoe.x-
     W*.34
    );

  }


  if(
   flightTime>
   MAX_FLIGHT_TIME
  ){

   finishRun(
    false,
    false
   );

  }

 }


 updateParticles(dt);

}


function frame(ts){

 if(!lastTime)
  lastTime=ts;


 const dt=
  Math.min(
   (ts-lastTime)/1000,
   .033
  );


 lastTime=ts;


 update(dt);

 draw();


 requestAnimationFrame(
  frame
 );

}


/* =====================================================
   初期化
===================================================== */

loadSave();

buildShoeGrid();

renderTitleStats();

requestAnimationFrame(
 frame
);

</script>
