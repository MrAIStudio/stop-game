<script>

/* =========================================================
   基本設定
========================================================= */

const GRAVITY = 300;

/*
   ★変更
   風をかなりマイルドにした
   以前 90 → 52
*/
const WIND_BASE = 52;

const PPM = 18;

const LAUNCH_MULT = 3.6;

const SWING_ROPE = 120;

const SWING_MAX_ANGLE = 0.96;

const SWING_PERIOD = 1.6;

const SHOE_RADIUS = 15;

const BOUNCE_MIN_SPEED = 40;

const STOP_SPEED = 14;


/*
   ★変更
   転がり減速を強くした

   以前 6.0
   ↓
   9.0

   「いつまでも転がる」を減らす
*/
const ROLL_DECAY_CONST = 9.0;

const BOUNCE_SOFTEN = 0.85;


/*
   ★変更
   停止判定を少し早める
*/
const SETTLE_TIME = 0.42;

const MAX_FLIGHT_TIME = 20;

const FRICTION_SCALE = 0.3;

const LAUNCH_HEIGHT = 140;

const SAVE_KEY = "kutsutobashi_save_v2";


/* =========================================================
   靴
========================================================= */

const SHOES = [

{
id:"sneaker",
name:"スニーカー",
emoji:"👟",
restitution:0.5,
friction:0.38,
drag:0.06,
launchScale:1.0,
wind:0.85,
flavor:"クセがなくバランス型。まずはこれで練習しよう。"
},

{
id:"sandal",
name:"ビーチサンダル",
emoji:"🩴",
restitution:0.75,
friction:0.52,
drag:0.10,
launchScale:0.95,
wind:1.15,
flavor:"よく弾む。追い風に乗ると大ジャンプ！"
},

{
id:"leather",
name:"革靴",
emoji:"👞",
restitution:0.25,
friction:0.16,
drag:0.032,
launchScale:0.9,
wind:0.45,
flavor:"あまり弾まず風にも強い。転がり性能は高め。"
},

{
id:"boots",
name:"長靴",
emoji:"👢",
restitution:0.15,
friction:0.40,
drag:0.13,
launchScale:0.85,
wind:0.5,
holeSurvive:0.5,
flavor:"重くて飛びにくいが、穴に落ちても踏ん張ることがある。"
},

{
id:"heels",
name:"ハイヒール",
emoji:"👠",
restitution:0.45,
friction:0.10,
drag:0.055,
launchScale:1.0,
wind:0.75,
wild:true,
flavor:"よく滑る。10%でヒールが折れて大暴走！"
},

{
id:"uwabaki",
name:"上履き",
emoji:"🥿",
restitution:0.55,
friction:0.32,
drag:0.05,
launchScale:1.15,
wind:0.9,
flavor:"靴飛ばしの定番。飛距離ボーナスつき！"
},

{
id:"geta",
name:"下駄",
emoji:"👡",
restitution:0.18,
friction:0.11,
drag:0.03,
launchScale:0.85,
wind:0.35,
flavor:"風に強い。弾まない代わりに地面を滑る。"
},

{
id:"crocs",
name:"クロックス",
emoji:"🥾",
restitution:0.4,
friction:0.42,
drag:0.11,
launchScale:1.0,
wind:1.25,
flavor:"追い風に乗ると一気に伸びる！"
},

{
id:"rollerskate",
name:"ローラースケート",
emoji:"🛼",
restitution:0.08,
friction:0.055,
drag:0.07,
launchScale:0.95,
wind:0.7,
flavor:"ほとんど弾まないが、坂を利用すると強い。"
}

];


/* =========================================================
   状態
========================================================= */

let canvas,ctx,W=480,H=380;

let state="title";

let course;

let cameraX=0;

let swingT=0;

let selectedShoeId="sneaker";

let shoe={
x:0,
y:0,
vx:0,
vy:0,
rotation:0,
rolling:false,
overHole:false,
holeEnterY:0,
bounceCount:0
};

let particles=[];

let lastTime=0;

let currentDistanceM=0;

let finalDistanceM=0;

let messageTimer=0;

let audio=null;

let stats={
best:0,
plays:0,
top:[]
};

let windValue=0;

let windAnimT=0;

let settleTimer=0;

let flightTime=0;


/* =========================================================
   風
========================================================= */

function rollWind(){

/*
   ★変更

   以前より弱め。

   無風寄りの風も多くして、
   毎回理不尽な向かい風にならないようにする。
*/

let r=Math.random();

if(r<0.25){

windValue=0;

}else{

windValue=(Math.random()*2-1)*(0.35+Math.random()*0.65);

}

}


function windLabel(){

let a=Math.abs(windValue);

if(a<0.12){
return "🌤 無風";
}

let strength =
a<0.40 ? "弱" :
(a<0.70 ? "中" : "強");

return windValue>0
? "➡️ 追い風("+strength+")"
: "⬅️ 向かい風("+strength+")";

}


function currentShoe(){

return SHOES.find(
s=>s.id===selectedShoeId
);

}


function clamp(v,a,b){

return Math.max(a,Math.min(b,v));

}


/* =========================================================
   セーブ
========================================================= */

function loadSave(){

try{

let raw=localStorage.getItem(SAVE_KEY);

if(raw){

let d=JSON.parse(raw);

if(d.stats){

Object.assign(stats,d.stats);

}

}

}catch(e){}

}


function writeSave(){

try{

localStorage.setItem(
SAVE_KEY,
JSON.stringify({stats})
);

}catch(e){}

}


/* =========================================================
   コース生成
========================================================= */

function generateCourse(){

const TARGET=16000;

let segments=[];

let holes=[];

let current=[{x:0,y:260}];

let curX=0;

let curY=260;


while(curX<TARGET){

let type;


if(curX<450){

type="flat";

}

else if(curY>310){

type=Math.random()<0.75
?"up"
:"flat";

}

else if(curY<110){

type=Math.random()<0.75
?"down"
:"flat";

}

else{

let rampP=0.14;

let roll=Math.random();

if(roll<rampP){

type="ramp";

}else{

let r2=Math.random();

type =
r2<0.4
?"down"
:
r2<0.7
?"flat"
:"up";

}

}


if(type==="flat"){

let len=150+Math.random()*220;

curX+=len;

current.push({
x:curX,
y:curY
});

}


else if(type==="down"){

let len=250+Math.random()*300;

curY+=15+Math.random()*45;

curX+=len;

current.push({
x:curX,
y:curY
});

}


else if(type==="up"){

let len=150+Math.random()*200;

curY-=15+Math.random()*40;

curX+=len;

current.push({
x:curX,
y:curY
});

}


else if(type==="ramp"){

let riseLen=55+Math.random()*35;

curY-=50+Math.random()*45;

curX+=riseLen;

current.push({
x:curX,
y:curY
});

let topLen=30+Math.random()*20;

curX+=topLen;

current.push({
x:curX,
y:curY
});

}


curY=clamp(curY,90,330);

}


curX+=350;

current.push({
x:curX,
y:curY
});


segments.push(current);

return {
segments,
holes,
length:curX
};

}


/* =========================================================
   地面
========================================================= */

function groundInfoAt(x){

for(const seg of course.segments){

const first=seg[0];

const last=seg[seg.length-1];


if(
x>=first.x-1 &&
x<=last.x+1
){

for(let i=0;i<seg.length-1;i++){

if(
x>=seg[i].x &&
x<=seg[i+1].x
){

let dx=
(seg[i+1].x-seg[i].x)||1;

let t=
(x-seg[i].x)/dx;

let y=
seg[i].y+
(seg[i+1].y-seg[i].y)*t;

let slope=
(seg[i+1].y-seg[i].y)/dx;

return {
y,
slope
};

}

}

return {
y:last.y,
slope:0
};

}

}

return null;

}


/* =========================================================
   バウンド
========================================================= */

function bounceVelocity(
vx,
vy,
slope,
restitution
){

let len=
Math.sqrt(slope*slope+1);

let nx=slope/len;

let ny=-1/len;

let dot=
vx*nx+vy*ny;

let rx=
vx-2*dot*nx;

let ry=
vy-2*dot*ny;

return {
vx:rx*restitution,
vy:ry*restitution
};

}


/* =========================================================
   物理
========================================================= */

function physicsStep(dt){

const variant=currentShoe();


/*
   重力
*/

shoe.vy+=GRAVITY*dt;


/*
   空気抵抗

   風で戻される感じを抑えるため
   速度を削りすぎない
*/

shoe.vx*=
(1-variant.drag*dt);

shoe.vy*=
(1-variant.drag*0.6*dt);


/*
   ★風

   以前より大幅に弱くした。

   空中ではしっかり影響。

   地面ではさらに弱くする。

   つまり
   「風に乗った！」は残す。
   「風で逆走」は減らす。
*/

let windPower =
shoe.rolling
? 0.16
: 0.65;

shoe.vx +=
windValue*
WIND_BASE*
variant.wind*
windPower*
dt;


/*
   ★追加

   極端な逆走を防ぐ。

   ある程度前進している状態では
   風だけで完全に後ろへ戻りにくくする。
*/

if(shoe.x>120 && shoe.vx< -35){

shoe.vx += 35*dt;

}


shoe.x+=shoe.vx*dt;

shoe.y+=shoe.vy*dt;

shoe.rotation+=
shoe.vx*dt*0.06;


currentDistanceM=
Math.max(
0,
shoe.x/PPM
);

updateHud();


if(shoe.x>=course.length){

finishRun(true,false);

return;

}


let g=
groundInfoAt(shoe.x);


/* ================= 穴 ================= */

if(g===null){

if(!shoe.overHole){

shoe.overHole=true;

shoe.holeEnterY=shoe.y;

shoe.rolling=false;

}

if(
shoe.vy>0 &&
(shoe.y-shoe.holeEnterY)>260
){

handleHoleFall();

return;

}

return;

}


if(shoe.overHole){

shoe.overHole=false;

}


let groundY=g.y;


/* =========================================================
   転がり
========================================================= */

if(shoe.rolling){

let gAhead=
groundInfoAt(shoe.x+12);


/*
   ジャンプ台

   ★ポンポン跳ねる楽しさを維持
*/

if(
gAhead &&
g.slope<-0.32 &&
(gAhead.slope-g.slope)>0.25
){

shoe.vy=
-Math.abs(shoe.vx)*0.55-70;

shoe.rolling=false;

spawnBurst(
shoe.x,
shoe.y,
10
);

playJumpSound();

settleTimer=0;

return;

}


/*
   坂
*/

let slopeAngle=
Math.atan(g.slope);

shoe.vx +=
GRAVITY*
Math.sin(slopeAngle)*
dt;


/*
   ★停止しやすくした

   平地ではかなり減速。

   下り坂ではちゃんと走る。
*/

let fric =
shoe.frictionOverride!=null
? shoe.frictionOverride
: variant.friction;


let flatBonus =
Math.abs(g.slope)<0.10
? 1.55
: 1.0;


let k=
fric*
ROLL_DECAY_CONST*
flatBonus*
Math.max(
0.4,
Math.cos(slopeAngle)
);


shoe.vx*=
Math.exp(-k*dt);


shoe.y=
groundY-SHOE_RADIUS;

shoe.vy=0;


/*
   転がっている演出
*/

if(
Math.random()<0.35 &&
Math.abs(shoe.vx)>40
){

spawnDust(
shoe.x,
shoe.y+SHOE_RADIUS,
1
);

}


/*
   ★停止判定
*/

if(Math.abs(shoe.vx)<STOP_SPEED){

if(settleTimer<=0){

flashMessage("止まるかな…？");

}

settleTimer+=dt;

if(
settleTimer>SETTLE_TIME ||
flightTime>MAX_FLIGHT_TIME
){

finishRun(false,false);

return;

}

}else{

settleTimer=0;

}

}


/* =========================================================
   空中
========================================================= */

else{

if(
shoe.y+SHOE_RADIUS>=groundY
){

let speed=
Math.hypot(
shoe.vx,
shoe.vy
);

shoe.y=
groundY-SHOE_RADIUS;


/*
   ハイヒール破壊
*/

if(
shoe.heelBroken &&
!shoe.heelBrokenTriggered
){

shoe.heelBrokenTriggered=true;

let boost=
1.9+Math.random()*0.4;

shoe.vx*=boost;

shoe.vy*=1.15;

shoe.frictionOverride=
variant.friction*0.15;

flashMessage(
"パキッ！ヒールが折れて大暴走…！"
);

spawnBurst(
shoe.x,
shoe.y,
18
);

playHeelBreakSound();

speed=
Math.hypot(
shoe.vx,
shoe.vy
);

}


/*
   ★バウンド

   ここはゲームの気持ちいい部分なので
   しっかり残す。
*/

if(speed>BOUNCE_MIN_SPEED){

let decayFactor=
Math.pow(
0.85,
shoe.bounceCount
);


let rest=
variant.wild
?
clamp(
variant.restitution+
(Math.random()*0.5-0.25),
0.08,
0.95
)
:
variant.restitution;


rest=
rest*
BOUNCE_SOFTEN*
decayFactor;


let res=
bounceVelocity(
shoe.vx,
shoe.vy,
g.slope,
rest
);


shoe.vx=res.vx;

shoe.vy=res.vy;

shoe.bounceCount++;


spawnBurst(
shoe.x,
shoe.y,
6
);

playBounceSound(speed);


/*
   ★バウンド中に風を感じる演出
*/

if(
windValue>0.55 &&
shoe.vx>100
){

flashMessage(
"🌬️ 風に乗った！！"
);

}

}else{

shoe.rolling=true;

shoe.vy=0;

}

}

}

}


/* =========================================================
   穴
========================================================= */

function handleHoleFall(){

const variant=currentShoe();


if(
variant.holeSurvive &&
Math.random()<variant.holeSurvive
){

let h=
course.holes.find(
hh=>
shoe.x>=hh.start-5 &&
shoe.x<=hh.end+90
);


let edgeX=
h
?
h.end+4
:
shoe.x+40;


shoe.x=edgeX;

shoe.vx*=0.3;

shoe.vy=0;

shoe.overHole=false;


let g=
groundInfoAt(shoe.x);


shoe.y=
(g?g.y:shoe.y)-SHOE_RADIUS;

shoe.rolling=true;


flashMessage(
"ギリギリ踏ん張った！"
);

playSurviveSound();

}else{

flashMessage(
"穴に落ちた…"
);

playHoleFallSound();

finishRun(false,true);

}

}


/* =========================================================
   終了
========================================================= */

function finishRun(
reachedEnd,
holeFall
){

if(state==="result") return;

state="result";


let dist=
reachedEnd
?
currentDistanceM*1.15
:
currentDistanceM;


finalDistanceM=
Math.round(dist*10)/10;


let isRecord=
finalDistanceM>stats.best;


stats.plays++;


if(isRecord){

stats.best=finalDistanceM;

}


stats.top.push(finalDistanceM);

stats.top.sort(
(a,b)=>b-a
);

stats.top=
stats.top.slice(0,5);


writeSave();


showResult(
reachedEnd,
holeFall,
isRecord
);


if(!holeFall){

playFinishSound(
reachedEnd
);

}

}


/* =========================================================
   発射
========================================================= */

function release(){

if(state!=="aiming") return;


const A=
SWING_MAX_ANGLE;

const w=
2*Math.PI/SWING_PERIOD;


const theta=
A*Math.sin(w*swingT);


const thetaSpeed=
A*w*Math.cos(w*swingT);


const variant=
currentShoe();


const vxBase=
thetaSpeed*
SWING_ROPE*
Math.cos(theta);


const vyBase=
-thetaSpeed*
SWING_ROPE*
Math.sin(theta);


const scale=
LAUNCH_MULT*
variant.launchScale;


const g0=
groundInfoAt(0);


shoe.x=0;


shoe.y=
(g0?g0.y:300)-LAUNCH_HEIGHT;


shoe.vx=
vxBase*scale;


shoe.vy=
vyBase*scale;


shoe.rotation=0;

shoe.rolling=false;

shoe.overHole=false;

shoe.bounceCount=0;


/*
   ハイヒール
*/

shoe.heelBroken=
(
variant.id==="heels" &&
Math.random()<0.10
);


shoe.heelBrokenTriggered=false;

shoe.frictionOverride=null;

currentDistanceM=0;

state="flight";


flashMessage(
shoe.vx<40
?
"うわっ、変な方向に飛んだ！？"
:
"とんだ！"
);


playLaunchSound();

}


/* =========================================================
   パーティクル
========================================================= */

function spawnDust(x,y,n){

for(let i=0;i<n;i++){

particles.push({

x,
y,

vx:
(Math.random()*60-30),

vy:
-Math.random()*40,

life:0.4,

maxLife:0.4,

color:"201,160,106",

r:
2.5+Math.random()*2.5

});

}

}


function spawnBurst(x,y,n){

for(let i=0;i<n;i++){

let a=
Math.random()*Math.PI*2;

let sp=
60+Math.random()*140;


particles.push({

x,
y,

vx:
Math.cos(a)*sp,

vy:
Math.sin(a)*sp-60,

life:0.5,

maxLife:0.5,

color:"255,220,150",

r:
2+Math.random()*3

});

}

}


function updateParticles(dt){

for(
let i=particles.length-1;
i>=0;
i--
){

let p=particles[i];

p.x+=p.vx*dt;

p.y+=p.vy*dt;

p.vy+=500*dt;

p.life-=dt;


if(p.life<=0){

particles.splice(i,1);

}

}

}


/* =========================================================
   サウンド
========================================================= */

function getAudio(){

if(!audio){

audio=
new (
window.AudioContext||
window.webkitAudioContext
)();

}

if(audio.state==="suspended"){

audio.resume();

}

return audio;

}


function tone(
freqStart,
freqEnd,
dur,
type,
vol
){

let a=getAudio();

let osc=
a.createOscillator();

let gain=
a.createGain();


osc.type=
type||"sine";


osc.frequency.setValueAtTime(
freqStart,
a.currentTime
);


osc.frequency.exponentialRampToValueAtTime(
Math.max(30,freqEnd),
a.currentTime+dur
);


gain.gain.setValueAtTime(
(vol||0.25),
a.currentTime
);


gain.gain.exponentialRampToValueAtTime(
0.001,
a.currentTime+dur
);


osc.connect(gain);

gain.connect(a.destination);


osc.start();

osc.stop(
a.currentTime+dur
);

}


function playLaunchSound(){

tone(
300,
900,
0.25,
"sawtooth",
0.2
);

}


function playBounceSound(speed){

let p=
clamp(
speed/900,
0.2,
1
);

tone(
200+p*500,
120,
0.12,
"sine",
0.2
);

}


function playJumpSound(){

tone(
500,
1100,
0.15,
"triangle",
0.2
);

}


function playHoleFallSound(){

tone(
400,
60,
0.5,
"sawtooth",
0.25
);

}


function playSurviveSound(){

tone(
700,
900,
0.2,
"square",
0.15
);

}


function playHeelBreakSound(){

tone(
900,
80,
0.35,
"sawtooth",
0.28
);

}


function playFinishSound(good){

tone(
good?700:500,
good?1400:700,
0.4,
"triangle",
0.25
);

}

/* =========================================================
   Canvas
========================================================= */

function fitCanvas(){

canvas=
document.getElementById("cv");


let wrapW=
Math.min(
document.querySelector(
".gameWrap"
).clientWidth||480,
480
);


canvas.width=wrapW;

canvas.height=380;


W=canvas.width;

H=canvas.height;


ctx=
canvas.getContext("2d");


ctx.textAlign="center";

ctx.textBaseline="middle";


canvas.onclick=()=>{

if(state==="aiming"){

release();

}

};

}


window.addEventListener(
"resize",
()=>{

if(canvas){

fitCanvas();

}

});


/* =========================================================
   背景
========================================================= */

function drawSky(){

let grad=
ctx.createLinearGradient(
0,
0,
0,
H
);


grad.addColorStop(
0,
"#7ec8f0"
);

grad.addColorStop(
0.55,
"#cdeeff"
);

grad.addColorStop(
1,
"#fff8ec"
);


ctx.fillStyle=grad;

ctx.fillRect(
0,
0,
W,
H
);


ctx.beginPath();

ctx.fillStyle="#ffe27a";

ctx.arc(
W-50,
50,
26,
0,
7
);

ctx.fill();

}


/* =========================================================
   風
========================================================= */

function drawWind(camX){

let a=
Math.abs(windValue);


if(a<0.15) return;


ctx.strokeStyle=
"rgba(255,255,255,"+
clamp(
0.25+a*0.35,
0,
0.6
)+")";


ctx.lineWidth=2;


let dir=
windValue>0
?
1
:
-1;


let n=
3+Math.round(a*3);


for(
let i=0;
i<n;
i++
){

let baseY=
60+i*24+
((i*17)%20);


let scroll=
(
windAnimT*
260*
dir
)%60;


let sx=
dir>0
?
-40+
((i*130+scroll)%(W+80))-40
:
W+40-
((i*130-scroll)%(W+80))-40;


ctx.beginPath();

ctx.moveTo(
sx,
baseY
);

ctx.lineTo(
sx+dir*26,
baseY
);

ctx.stroke();

}

}


/* =========================================================
   雲
========================================================= */

function drawClouds(camX){

ctx.fillStyle="#ffffffcc";


for(let i=0;i<5;i++){

let baseX=
(i*260)-
((camX*0.15)%260);


let cx=
(
(baseX%(W+200))
+
W+200
)
%(W+200)-100;


let cy=
40+((i*37)%50);


ctx.beginPath();

ctx.ellipse(
cx,
cy,
26,
14,
0,
0,
7
);


ctx.ellipse(
cx+20,
cy+4,
20,
12,
0,
0,
7
);


ctx.ellipse(
cx-20,
cy+5,
18,
11,
0,
0,
7
);


ctx.fill();

}

}


/* =========================================================
   地面
========================================================= */

function drawGround(camX){

for(const seg of course.segments){

let first=seg[0];

let last=
seg[seg.length-1];


if(
last.x-camX<-60 ||
first.x-camX>W+60
){

continue;

}


ctx.beginPath();


ctx.moveTo(
seg[0].x-camX,
seg[0].y
);


for(
let i=1;
i<seg.length;
i++
){

ctx.lineTo(
seg[i].x-camX,
seg[i].y
);

}


ctx.lineTo(
last.x-camX,
H
);


ctx.lineTo(
first.x-camX,
H
);


ctx.closePath();


let grad=
ctx.createLinearGradient(
0,
first.y,
0,
H
);


grad.addColorStop(
0,
"#8fd35f"
);

grad.addColorStop(
0.12,
"#5fa73c"
);

grad.addColorStop(
0.12,
"#c98a4b"
);

grad.addColorStop(
1,
"#8a5a30"
);


ctx.fillStyle=grad;

ctx.fill();


ctx.strokeStyle="#4f8f3b";

ctx.lineWidth=3;


ctx.beginPath();


ctx.moveTo(
seg[0].x-camX,
seg[0].y
);


for(
let i=1;
i<seg.length;
i++
){

ctx.lineTo(
seg[i].x-camX,
seg[i].y
);

}


ctx.stroke();

}


for(const h of course.holes){

if(
h.end-camX<-60 ||
h.start-camX>W+60
){

continue;

}


ctx.beginPath();


ctx.moveTo(
h.start-camX,
h.yStart
);


ctx.lineTo(
h.start-camX,
H
);


ctx.lineTo(
h.end-camX,
H
);


ctx.lineTo(
h.end-camX,
h.yEnd
);


ctx.closePath();


let g=
ctx.createLinearGradient(
0,
Math.min(
h.yStart,
h.yEnd
),
0,
H
);


g.addColorStop(
0,
"#3a2a1a"
);


g.addColorStop(
1,
"#150d08"
);


ctx.fillStyle=g;

ctx.fill();

}

}


/* =========================================================
   ブランコ
========================================================= */

function drawSwing(){

const pivotX=90;

const pivotY=110;


const A=
SWING_MAX_ANGLE;


const w=
2*Math.PI/SWING_PERIOD;


const theta=
A*Math.sin(w*swingT);


const thetaSpeed=
A*w*Math.cos(w*swingT);


const seatX=
pivotX+
Math.sin(theta)*
SWING_ROPE;


const seatY=
pivotY+
Math.cos(theta)*
SWING_ROPE;


ctx.strokeStyle="#8a6a4a";

ctx.lineWidth=8;

ctx.lineCap="round";


ctx.beginPath();

ctx.moveTo(
pivotX-46,
H-2
);

ctx.lineTo(
pivotX,
pivotY-8
);

ctx.lineTo(
pivotX+46,
H-2
);

ctx.stroke();


ctx.beginPath();

ctx.moveTo(
pivotX-46,
pivotY-4
);

ctx.lineTo(
pivotX+46,
pivotY-4
);

ctx.stroke();


let sweetZone=
theta>-0.15 &&
theta<0.5 &&
thetaSpeed>0;


ctx.strokeStyle=
sweetZone
?
"#ffce54"
:
"#c9b8a0";


ctx.lineWidth=3;


ctx.beginPath();

ctx.moveTo(
pivotX,
pivotY
);

ctx.lineTo(
seatX,
seatY
);

ctx.stroke();


if(sweetZone){

ctx.beginPath();

ctx.fillStyle="#ffce5455";

ctx.arc(
seatX,
seatY,
26,
0,
7
);

ctx.fill();

}


ctx.font="30px sans-serif";

ctx.fillText(
"🧒",
seatX,
seatY-6
);


ctx.font="18px sans-serif";

ctx.fillText(
currentShoe().emoji,
seatX+10,
seatY+16
);


ctx.fillStyle="#8a6a4a";

ctx.fillRect(
seatX-14,
seatY+2,
28,
6
);

}


/* =========================================================
   パーティクル
========================================================= */

function drawParticles(camX){

for(const p of particles){

ctx.beginPath();

ctx.fillStyle=
"rgba("+
p.color+
","+
clamp(
p.life/p.maxLife,
0,
1
)+")";


ctx.arc(
p.x-camX,
p.y,
p.r,
0,
7
);


ctx.fill();

}

}


/* =========================================================
   靴
========================================================= */

function drawShoe(camX){

ctx.save();


ctx.translate(
shoe.x-camX,
shoe.y
);


ctx.rotate(
shoe.rotation
);


ctx.font="30px sans-serif";


let emo=
shoe.heelBrokenTriggered
?
"🥿"
:
currentShoe().emoji;


ctx.fillText(
emo,
0,
0
);


ctx.restore();

}


/* =========================================================
   描画
========================================================= */

function draw(){

if(!ctx) return;


ctx.clearRect(
0,
0,
W,
H
);


drawSky();


let camX=
state==="aiming"
?
0
:
cameraX;


drawClouds(camX);

drawWind(camX);

drawGround(camX);


if(state==="aiming"){

drawSwing();

}


drawParticles(camX);


if(
state==="flight" ||
state==="result"
){

drawShoe(camX);

}

}


/* =========================================================
   メインループ
========================================================= */

function update(dt){

windAnimT+=dt;


if(state==="aiming"){

swingT+=dt;

}

else if(state==="flight"){

flightTime+=dt;

physicsStep(dt);


if(state==="flight"){

cameraX=
Math.max(
0,
shoe.x-W*0.34
);

}

}


updateParticles(dt);

}


function frame(ts){

if(!lastTime){

lastTime=ts;

}


let dt=
Math.min(
(ts-lastTime)/1000,
0.033
);


lastTime=ts;


update(dt);

draw();


requestAnimationFrame(frame);

}


/* =========================================================
   初期化
========================================================= */

loadSave();

buildShoeGrid();

renderTitleStats();

requestAnimationFrame(frame);

</script>
