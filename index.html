<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>イライラすとっぷ</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
text-align:center;
overflow:hidden;
}

h1{
font-size:40px;
}

.sub{
font-size:20px;
line-height:1.8;
color:#ccc;
}

button{
font-size:28px;
padding:15px 50px;
border-radius:20px;
border:none;
background:#00ffff;
}

#game{
display:none;
}

.field{

width:90%;
height:320px;
margin:20px auto;
background:#222;
border:3px solid white;
position:relative;
overflow:hidden;

}


.ufo{

position:absolute;
top:130px;
font-size:50px;
left:0;

}


.bubble{

position:absolute;
top:50px;
background:white;
color:black;
padding:8px 12px;
border-radius:15px;
font-size:16px;
white-space:nowrap;

}


.afterimage{

position:absolute;
top:130px;
font-size:50px;
opacity:0.3;

}


.bullet{

position:absolute;
bottom:20px;
font-size:35px;
display:none;

}


.status{

font-size:20px;
}


.bar{

width:80%;
height:25px;
background:#333;
margin:10px auto;
border-radius:20px;
overflow:hidden;

}


#stress{

height:100%;
width:50%;
background:red;

}


#message{

font-size:22px;
min-height:50px;

}


.rank{

margin-top:20px;

}

</style>

</head>

<body>


<div id="title">

<h1>
😡 イライラすとっぷ
</h1>


<div class="sub">

🛸 煽るUFOを予測して撃て！

<br>

「こっちだよ〜」に騙されるな

<br><br>

今まで本気だったと思った？

</div>


<button onclick="startGame()">

START

</button>


<h2>🏆 TOP5</h2>

<div id="ranking"></div>


</div>



<div id="game">


<div class="field">


<div id="bubble" class="bubble">
こっちだよ〜😏
</div>


<div id="ufo" class="ufo">
🛸
</div>


<div id="bullet" class="bullet">
💥
</div>


</div>


<div class="status">

連続成功：
<span id="combo">0</span>

<br>

スコア：
<span id="score">0</span>

<br>

ストレス

</div>


<div class="bar">

<div id="stress"></div>

</div>


<button onclick="stopGame()">

STOP

</button>


</div>


<div id="message"></div>



<script>


let ufo;
let bubble;
let bullet;

let x=0;
let dir=1;
let speed=4;

let timer;

let combo=0;
let score=0;
let stress=50;

let audio;



let comments=[

"こっちだよ〜😏",
"今押すと思った？🤣",
"残念、逆でした〜",
"読めるかな？笑",
"未来予測してみな？",
"あと0.2秒だったね"

];


function sound(f,t){

if(!audio){
audio=new AudioContext();
}

let o=audio.createOscillator();
let g=audio.createGain();

o.connect(g);
g.connect(audio.destination);

o.frequency.value=f;

g.gain.setValueAtTime(
0.2,
audio.currentTime
);

g.gain.exponentialRampToValueAtTime(
0.001,
audio.currentTime+t
);

o.start();
o.stop(audio.currentTime+t);

}



function startGame(){

document.getElementById("title").style.display="none";

document.getElementById("game").style.display="block";


ufo=document.getElementById("ufo");
bubble=document.getElementById("bubble");
bullet=document.getElementById("bullet");


sound(600,0.1);


move();

}
function move(){

timer=setInterval(()=>{


x += speed * dir;


// 通常反転

if(x > window.innerWidth*0.75){

dir=-1;

speed+=0.2;

}


if(x < 0){

dir=1;

speed+=0.2;

}


// 幻影フェイント

if(Math.random()<0.015){

phantom();

}


// UFO移動

ufo.style.left=x+"px";

bubble.style.left=(x-20)+"px";



// 煽り表示

if(Math.random()<0.02){

bubble.innerHTML=
comments[Math.floor(Math.random()*comments.length)];

}


},20);


}



// 幻影モード

function phantom(){


bubble.innerHTML=
"今まで本気だったと思った？😈";


speed=18;


let count=0;


let fast=setInterval(()=>{


x += speed * dir;


ufo.style.left=x+"px";

bubble.style.left=(x-20)+"px";


count++;


if(count>20){

clearInterval(fast);

speed=4+Math.random()*3;

}


},20);


}




function stopGame(){


clearInterval(timer);


sound(250,0.15);


// 発射演出

bullet.style.display="block";

bullet.style.left="50%";



setTimeout(()=>{


bullet.style.display="none";


judge();


},300);


}





function judge(){



let center=
window.innerWidth/2;


let distance=
Math.abs(
(x+25)-center
);



if(distance<60){


combo++;

score+=combo*100;

stress-=10;


sound(900,0.3);



let hit=[

"💥 HIT！読んだ！",

"🎯完璧な予測！",

"🛸撃墜成功！"

];


document.getElementById("message").innerHTML=

hit[Math.floor(Math.random()*hit.length)];



}else{


combo=0;

stress+=20;


sound(120,0.4);



let miss=[

"🛸え？今撃ったの？🤣",

"こっちだよ〜って言ったのに😏",

"残念！未来予測失敗",

"タイミング迷子発見😂"

];


document.getElementById("message").innerHTML=

miss[Math.floor(Math.random()*miss.length)];


}



if(stress<0){

stress=0;

}


if(stress>100){

stress=100;

document.getElementById("message").innerHTML=

"💀ストレス限界突破";


}



document.getElementById("combo").innerHTML=
combo;


document.getElementById("score").innerHTML=
score;


document.getElementById("stress").style.width=
stress+"%";



saveScore();



setTimeout(()=>{


document.getElementById("message").innerHTML="";


move();


},1200);



}


  function saveScore(){

let data=
JSON.parse(
localStorage.getItem("rank") || "[]"
);


data.push(score);


data.sort((a,b)=>b-a);


data=data.slice(0,5);


localStorage.setItem(
"rank",
JSON.stringify(data)
);


showRank();

}



function showRank(){

let data=
JSON.parse(
localStorage.getItem("rank") || "[]"
);


let html="";


data.forEach((v,i)=>{

html+=
(i+1)+"位 "+v+"点<br>";

});


document.getElementById("ranking").innerHTML=

html || "まだ記録なし";

}



showRank();



</script>


</body>

</html>
