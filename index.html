<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>靴飛ばし大飛行！</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    background:
        linear-gradient(
            180deg,
            #8ed5ff 0%,
            #dff5ff 45%,
            #fff7e8 100%
        );
    color:#30465d;
    font-family:
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        "M PLUS Rounded 1c",
        sans-serif;
    text-align:center;
    overflow-x:hidden;
}

.wrap{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:14px 12px 30px;
}

/* =========================
   タイトル
========================= */

#titleScreen{
    animation:fadeIn .35s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.badge{
    display:inline-block;
    margin-top:5px;
    padding:5px 15px;
    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #ff9c68,
            #ffd05a
        );

    color:#62421e;
    font-size:11px;
    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(255,150,90,.25);
}

h1{
    margin:8px 0 2px;
    color:#28496b;
    font-size:28px;
    line-height:1.2;

    text-shadow:
        0 2px #fff;
}

.sub{
    margin:6px 0 12px;
    color:#506a86;
    font-size:13px;
    line-height:1.7;
}

.flavorBox{
    min-height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:8px 12px;

    background:#fffdf8;
    border:1px solid #d9e8f4;
    border-radius:14px;

    color:#61758b;
    font-size:12px;

    box-shadow:
        0 3px 10px rgba(40,70,100,.08);
}

/* =========================
   靴選択
========================= */

.shoeGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:11px 0;
}

.shoeCard{
    min-height:88px;

    padding:8px 4px;

    background:#fffdf8;
    border:2px solid #dfebf4;
    border-radius:16px;

    box-shadow:
        0 3px 9px rgba(40,70,100,.08);

    transition:
        transform .12s,
        border-color .12s,
        box-shadow .12s;
}

.shoeCard:active{
    transform:scale(.96);
}

.shoeCard.active{
    border-color:#ff835d;

    background:
        linear-gradient(
            150deg,
            #fff0e8,
            #fffaf1
        );

    box-shadow:
        0 5px 15px rgba(255,120,80,.25);
}

.shoeCard .emo{
    font-size:28px;
    line-height:32px;
}

.shoeCard .nm{
    margin-top:3px;
    color:#304a64;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   ボタン
========================= */

button{
    border:0;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

.bigBtn{
    width:90%;
    padding:14px 20px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ff7356,
            #ffb400
        );

    color:white;
    font-size:20px;

    box-shadow:
        0 8px 18px rgba(255,110,70,.3);
}

.bigBtn:active{
    transform:translateY(2px) scale(.98);
}

.smallBtn{
    padding:9px 17px;

    border-radius:50px;

    background:#f1f7fc;
    border:1px solid #cbddea;

    color:#31516d;
    font-size:13px;
}

/* =========================
   ランキング
========================= */

.rankBox{
    margin-top:12px;

    background:#fffdf8;
    border:1px solid #dce9f3;
    border-radius:16px;

    overflow:hidden;

    box-shadow:
        0 4px 12px rgba(40,70,100,.07);
}

.rankBox h2{
    margin:8px 0;
    color:#304e6b;
    font-size:15px;
}

.rankRow,
.statRow{
    display:flex;
    justify-content:space-between;

    padding:5px 18px;

    border-top:1px solid #edf2f6;

    font-size:13px;
}

.statRow{
    color:#637990;
}

.statRow span:last-child,
.rankRow span:last-child{
    color:#294c6c;
    font-weight:bold;
}

/* =========================
   ゲーム画面
========================= */

#gameScreen{
    display:none;
}

.gameWrap{
    position:relative;
    width:100%;
    margin:auto;
}

canvas{
    display:block;

    width:100%;
    height:auto;

    border-radius:20px;

    background:#a9defc;

    box-shadow:
        0 7px 22px rgba(40,70,100,.25);

    touch-action:manipulation;
}

/* =========================
   HUD
========================= */

.hud{
    position:absolute;

    top:8px;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;

    padding:0 10px;

    pointer-events:none;
}

.hudBox{
    padding:5px 11px;

    background:rgba(255,255,255,.84);

    border-radius:12px;

    color:#304c68;

    font-size:12px;
    font-weight:bold;

    box-shadow:
        0 2px 8px rgba(40,70,100,.15);
}

.hudBox .big{
    color:#ff704f;
    font-size:18px;
}

/* =========================
   イベントメッセージ
========================= */

#eventMsg{
    position:absolute;

    top:47px;
    left:50%;

    transform:
        translateX(-50%)
        scale(.9);

    opacity:0;

    padding:6px 15px;

    background:rgba(50,39,65,.88);

    color:#ffe4a6;

    border-radius:15px;

    font-size:13px;
    font-weight:bold;

    white-space:nowrap;

    pointer-events:none;

    transition:
        opacity .18s,
        transform .18s;
}

#eventMsg.show{
    opacity:1;
    transform:
        translateX(-50%)
        scale(1);
}

/* =========================
   飛ぶボタン
========================= */

.fireBtnWrap{
    margin-top:10px;
}

#fireBtn{
    width:70%;

    padding:13px 20px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ff7458,
            #ffb400
        );

    color:white;

    font-size:21px;

    box-shadow:
        0 8px 18px rgba(255,110,70,.28);
}

#fireBtn:active{
    transform:
        scale(.96)
        translateY(2px);
}

.tapHint{
    margin-top:5px;

    color:#7288a0;

    font-size:11px;
}

/* =========================
   結果画面
========================= */

.resultOverlay{
    position:absolute;

    inset:0;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:18px;

    border-radius:20px;

    background:
        rgba(10,25,45,.88);

    color:white;

    z-index:10;
}

.resultOverlay.show{
    display:flex;
}

.resultOverlay .distTitle{
    color:#cce4fa;
    font-size:14px;
}

.resultOverlay .distNum{
    margin:3px 0;

    color:#ffd15b;

    font-size:56px;
    font-weight:900;

    text-shadow:
        0 3px 0 #9b701e;
}

.resultOverlay .distMsg{
    margin-bottom:10px;

    font-size:14px;
}

.resultOverlay .record{
    min-height:20px;

    margin-bottom:9px;

    color:#ffd15b;

    font-size:13px;
    font-weight:bold;
}

.resultBtnRow{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    justify-content:center;
}

.resultBtnRow button{
    padding:10px 18px;
    border-radius:50px;
    font-size:13px;
}

.retryBtn{
    background:
        linear-gradient(
            135deg,
            #ff7657,
            #ffb400
        );

    color:white;
}

.backBtn{
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.4);
    color:white;
}

/* =========================
   飛行中の小ネタ
========================= */

.flightLabel{
    position:absolute;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    font-size:26px;
    font-weight:900;

    opacity:0;

    white-space:nowrap;

    z-index:5;
}

.flightLabel.show{
    animation:
        flightPop .8s ease forwards;
}

@keyframes flightPop{
    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4)
            rotate(-5deg);
    }

    25%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.25)
            rotate(3deg);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-80%)
            scale(1.05);
    }
}

/* =========================
   スマホ微調整
========================= */

@media(max-width:360px){

    h1{
        font-size:25px;
    }

    .shoeGrid{
        gap:5px;
    }

    .shoeCard{
        min-height:82px;
    }

    .shoeCard .emo{
        font-size:25px;
    }

    .shoeCard .nm{
        font-size:10px;
    }

    #fireBtn{
        width:76%;
    }
}
</style>
</head>

<body>

<div class="wrap">

<!-- =====================================
     タイトル画面
===================================== -->

<div id="titleScreen">

    <div class="badge">
        SHOE FLYING DISTANCE GAME
    </div>

    <h1>
        👟 靴飛ばし大飛行！
    </h1>

    <div class="sub">
        ブランコの動きを見てタイミングを狙え！<br>
        飛んだ後は、跳ねて・転がって・風に乗れ！<br>
        <b>どこまで飛ぶかは、靴と運と腕次第。</b>
    </div>

    <div
        class="flavorBox"
        id="flavorBox">
        靴を選んでね
    </div>

    <div
        class="shoeGrid"
        id="shoeGrid">
    </div>

    <button
        class="bigBtn"
        onclick="beginAttempt()">
        🚀 スタート！
    </button>

    <div class="rankBox">

        <h2>
            🏆 自己ベスト TOP5
        </h2>

        <div id="ranking"></div>

    </div>

    <div
        class="rankBox"
        id="statsBox">

        <h2>
            📊 統計
        </h2>

        <div id="statsList"></div>

    </div>

</div>


<!-- =====================================
     ゲーム画面
===================================== -->

<div id="gameScreen">

    <div class="gameWrap">

        <canvas id="cv"></canvas>

        <div class="hud">

            <div class="hudBox">
                きょり<br>
                <span
                    class="big"
                    id="distHud">
                    0 m
                </span>
            </div>

            <div
                class="hudBox"
                id="windHud">
                🌤 無風
            </div>

            <div
                class="hudBox"
                id="shoeHud">
                👟
            </div>

        </div>

        <div id="eventMsg"></div>

        <div
            class="flightLabel"
            id="flightLabel">
        </div>


        <!-- 結果 -->

        <div
            class="resultOverlay"
            id="resultOverlay">

            <div class="distTitle">
                きょり
            </div>

            <div
                class="distNum"
                id="resultDist">
                0m
            </div>

            <div
                class="distMsg"
                id="resultMsg">
            </div>

            <div
                class="record"
                id="resultRecord">
            </div>

            <div class="resultBtnRow">

                <button
                    class="retryBtn"
                    onclick="retryAttempt()">
                    🔄 もう一度
                </button>

                <button
                    class="backBtn"
                    onclick="backToTitle()">
                    🏠 トップへ戻る
                </button>

            </div>

        </div>

    </div>


    <div class="fireBtnWrap">

        <button
            id="fireBtn"
            onclick="release()">
            👟 とぶ！
        </button>

    </div>

    <div class="tapHint">
        ブランコの動きを見て、自分のタイミングでタップ！
    </div>

</div>

</div>


<script>

/* =====================================================
   靴飛ばし大飛行
   Part 1 / 基本設定
===================================================== */


/* =========================
   画面・物理設定
========================= */

const GRAVITY = 245;


/*
 * 前版より風を弱める。
 *
 * 「風に負けて戻される」ことを減らして、
 * 「風に乗った！」を狙えるようにする。
 */
const WIND_BASE = 48;


/*
 * ここを小さくするほど
 * 画面上の1mが大きくなる。
 *
 * つまり、同じ画面移動でも
 * 距離表示を伸ばせる。
 */
const PPM = 13;


/*
 * 発射速度をかなり強化。
 */
const LAUNCH_MULT = 5.4;


/*
 * ブランコ
 */
const SWING_ROPE = 120;

const SWING_MAX_ANGLE = 0.96;

const SWING_PERIOD = 1.55;


/*
 * 着地したときの判定。
 */
const SHOE_RADIUS = 15;


/*
 * ポンポン跳ねるための最低速度。
 */
const BOUNCE_MIN_SPEED = 30;


/*
 * 完全停止判定。
 *
 * 前より少し低くすることで
 * 「なかなか止まらない」問題を改善。
 */
const STOP_SPEED = 22;


/*
 * 転がり減速。
 *
 * 小さいほどよく転がる。
 */
const ROLL_DECAY_CONST = 3.6;


/*
 * 跳ね返りの勢い。
 */
const BOUNCE_SOFTEN = 0.94;


/*
 * 速度が遅くなった後、
 * すぐ止めず少しだけ余韻を持たせる。
 */
const SETTLE_TIME = 0.38;


/*
 * 1プレイの最大飛行時間。
 */
const MAX_FLIGHT_TIME = 24;


/*
 * 発射位置。
 */
const LAUNCH_HEIGHT = 120;


/*
 * セーブ。
 */
const SAVE_KEY =
    "kutsutobashi_daikou_v2";


/* =====================================================
   靴データ

   今回は「特性を強める」が重要。
===================================================== */

const SHOES = [

    {
        id:"sneaker",
        name:"スニーカー",
        emoji:"👟",
        restitution:0.68,
        friction:0.26,
        drag:0.035,
        launchScale:1.05,
        wind:0.85,
        flavor:
            "クセが少ない万能型。跳ね・転がり・飛距離のバランスがいい。"
    },

    {
        id:"sandal",
        name:"ビーチサンダル",
        emoji:"🩴",
        restitution:0.88,
        friction:0.35,
        drag:0.055,
        launchScale:1.0,
        wind:1.55,
        flavor:
            "軽くて超バウンド！追い風に乗ると一気に大飛距離。"
    },

    {
        id:"leather",
        name:"革靴",
        emoji:"👞",
        restitution:0.42,
        friction:0.075,
        drag:0.018,
        launchScale:1.02,
        wind:0.38,
        flavor:
            "重くて風に強い。弾まない代わりに地面を猛烈に滑る。"
    },

    {
        id:"boots",
        name:"長靴",
        emoji:"👢",
        restitution:0.34,
        friction:0.24,
        drag:0.065,
        launchScale:0.95,
        wind:0.42,
        holeSurvive:0.72,
        flavor:
            "飛距離は控えめ。でも穴に強い。悪路攻略向き。"
    },

    {
        id:"heels",
        name:"ハイヒール",
        emoji:"👠",
        restitution:0.62,
        friction:0.035,
        drag:0.025,
        launchScale:1.08,
        wind:0.72,
        wild:true,
        flavor:
            "超スベる！転がり最強。たまにヒールが折れて大暴走。"
    },

    {
        id:"uwabaki",
        name:"上履き",
        emoji:"🥿",
        restitution:0.73,
        friction:0.20,
        drag:0.02,
        launchScale:1.25,
        wind:0.95,
        flavor:
            "靴飛ばしの王道。発射性能が高く、純粋に遠くへ飛ばせる。"
    },

    {
        id:"geta",
        name:"下駄",
        emoji:"👡",
        restitution:0.28,
        friction:0.045,
        drag:0.012,
        launchScale:0.94,
        wind:0.24,
        flavor:
            "風なんて知らん。重い。でも地面に落ちると恐ろしく滑る。"
    },

    {
        id:"crocs",
        name:"クロックス",
        emoji:"🥾",
        restitution:0.64,
        friction:0.29,
        drag:0.06,
        launchScale:1.05,
        wind:1.85,
        flavor:
            "風の申し子。追い風を掴んだ瞬間、別次元の飛距離になる。"
    },

    {
        id:"rollerskate",
        name:"ローラースケート",
        emoji:"🛼",
        restitution:0.18,
        friction:0.018,
        drag:0.028,
        launchScale:1.02,
        wind:0.55,
        flavor:
            "ほぼ跳ねない。でも転がり始めたら止まらない。"
    }

];


/* =====================================================
   ゲーム状態
===================================================== */

let canvas;
let ctx;
let W = 480;
let H = 420;

let state = "title";
/* title / aiming / flight / result */

let course;
let cameraX = 0;
let cameraY = 0;
let camScale = 1;
let lastGroundY = null;
let swingT = 0;

let selectedShoeId = "sneaker";

let shoe = {
    x:0, y:0, vx:0, vy:0, rotation:0,
    rolling:false, overHole:false, holeEnterY:0,
    bounceCount:0, heelBroken:false,
    heelBrokenTriggered:false, frictionOverride:null
};

let particles = [];

let lastTime = 0;

let currentDistanceM = 0;
let finalDistanceM = 0;

let messageTimer = 0;

let audio = null;

let stats = { best:0, plays:0, top:[] };

let windValue = 0;
let windAnimT = 0;

let settleTimer = 0;
let flightTime = 0;

let launchQuality = "NONE";

let gradePopup = null;


/* =====================================================
   共通関数
===================================================== */

function currentShoe(){
    return SHOES.find(s => s.id === selectedShoeId);
}

function clamp(v,a,b){
    return Math.max(a, Math.min(b,v));
}


/* =====================================================
   風
===================================================== */

function rollWind(){
    let r = Math.random();
    if(r < 0.28){
        windValue = -(0.10 + Math.random()*0.45);
    }else{
        windValue = (Math.random()*1.15)-0.05;
    }
}

function windLabel(){
    let a = Math.abs(windValue);
    if(a < 0.12){ return "🌤 無風"; }
    let strength;
    if(a < 0.4){ strength = "弱"; }
    else if(a < 0.75){ strength = "中"; }
    else{ strength = "強"; }
    if(windValue > 0){ return "➡️ 追い風 "+strength; }
    return "⬅️ 向かい風 "+strength;
}


/* =====================================================
   セーブ
===================================================== */

function loadSave(){
    try{
        const raw = localStorage.getItem(SAVE_KEY);
        if(raw){
            const data = JSON.parse(raw);
            if(data.stats){ Object.assign(stats, data.stats); }
        }
    }catch(e){ console.log("save load error", e); }
}

function writeSave(){
    try{
        localStorage.setItem(SAVE_KEY, JSON.stringify({stats}));
    }catch(e){ console.log("save write error", e); }
}


/* =====================================================
   Part 2
   コース・ブランコ・物理・発射
===================================================== */

function generateCourse(){

    const TARGET = 24000;

    let segments = [];
    let holes = [];
    let iceZones = [];
    let ramps = [];

    let curX = 0;
    let curY = 285;

    let current = [{x:0,y:curY}];

    while(curX < TARGET){

        let progress = curX / TARGET;
        let roll = Math.random();

        if(curX < 500){
            let len = 180 + Math.random()*180;
            curX += len;
            current.push({x:curX,y:curY});
            continue;
        }

        let holeP = 0.08 + progress*0.10;
        let rampP = 0.14;
        let iceP = 0.14;

        if(roll < holeP){

            let width = 70 + Math.random()*(90 + progress*100);
            let holeStart = curX;
            let holeEnd = curX + width;

            current.push({x:holeStart,y:curY});
            segments.push(current);

            let landY = clamp(curY + (Math.random()*60-30), 100, 330);

            holes.push({
                start:holeStart, end:holeEnd,
                yStart:curY, yEnd:landY
            });

            curX = holeEnd;
            curY = landY;

            current = [{x:curX,y:curY}];

        }
        else if(roll < holeP+rampP){

            let rise = 65 + Math.random()*70;
            let riseLen = 70 + Math.random()*60;

            let startX = curX;
            let startY = curY;

            curX += riseLen;
            curY -= rise;

            current.push({x:curX,y:curY});

            let topLen = 35 + Math.random()*35;
            curX += topLen;
            current.push({x:curX,y:curY});

            ramps.push({
                start:startX, end:curX,
                peakY:curY, startY:startY
            });

        }
        else if(roll < holeP+rampP+iceP){

            let len = 220 + Math.random()*280;
            let start = curX;
            curX += len;
            current.push({x:curX,y:curY});

            iceZones.push({start:start, end:curX});

        }
        else{

            let type = Math.random();
            let len = 180 + Math.random()*330;

            if(type < .38){
                curY += 20 + Math.random()*55;
            }
            else if(type < .65){
                curY -= 15 + Math.random()*45;
            }

            curX += len;
            curY = clamp(curY, 90, 330);

            current.push({x:curX,y:curY});

        }

    }

    curX += 600;
    current.push({x:curX,y:curY});
    segments.push(current);

    return { segments, holes, iceZones, ramps, length:curX };

}


function groundInfoAt(x){

    for(const seg of course.segments){

        const first = seg[0];
        const last = seg[seg.length-1];

        if(x < first.x-1 || x > last.x+1){ continue; }

        for(let i=0;i<seg.length-1;i++){

            const a = seg[i];
            const b = seg[i+1];

            if(x>=a.x && x<=b.x){
                const dx = (b.x-a.x)||1;
                const t = (x-a.x)/dx;
                const y = a.y + (b.y-a.y)*t;
                const slope = (b.y-a.y)/dx;
                return { y, slope };
            }
        }

        return { y:last.y, slope:0 };
    }

    return null;
}


function isIceAt(x){
    return course.iceZones.some(z => x>=z.start && x<=z.end);
}

function rampAt(x){
    return course.ramps.find(r => x>=r.start && x<=r.end);
}


/* =====================================================
   ブランコ
===================================================== */

function getSwingData(){
    const A = SWING_MAX_ANGLE;
    const w = 2*Math.PI/SWING_PERIOD;
    const theta = A*Math.sin(w*swingT);
    const thetaSpeed = A*w*Math.cos(w*swingT);
    return { theta, thetaSpeed };
}


function getLaunchQuality(){
    const { theta, thetaSpeed } = getSwingData();

    if(thetaSpeed <= 0){ return "MISS"; }
    if(theta >= 0.10 && theta <= 0.30){ return "PERFECT"; }
    if(theta >= -0.12 && theta <= 0.46){ return "GOOD"; }
    return "MISS";
}


function getLaunchMultiplier(){
    const quality = getLaunchQuality();
    if(quality === "PERFECT"){ return 1.32; }
    if(quality === "GOOD"){ return 1.08; }
    return 0.76;
}


/* =====================================================
   跳ね返り
===================================================== */

function bounceVelocity(vx, vy, slope, restitution){

    const len = Math.sqrt(slope*slope+1);
    const nx = slope/len;
    const ny = -1/len;
    const dot = vx*nx + vy*ny;

    let rx = vx - 2*dot*nx;
    let ry = vy - 2*dot*ny;

    rx *= 1.06;
    ry *= restitution;

    return { vx:rx, vy:ry };
}


/* =====================================================
   靴ごとの特殊物理
===================================================== */

function applyShoeSpecialPhysics(dt){

    const variant = currentShoe();

    if(variant.id === "heels" && !shoe.heelBroken &&
       shoe.bounceCount >= 2 && Math.random() < 0.006){

        shoe.heelBroken = true;
        flashMessage("パキッ！ヒールが折れた！");
        showFlightText("💥 大暴走！");
        spawnBurst(shoe.x, shoe.y, 18);

    }

    if(variant.id === "crocs" && windValue > 0.45 && Math.abs(shoe.vx)>180){
        if(Math.random()<0.035){ showFlightText("🌬️ 風に乗った！"); }
    }

    if(variant.id === "sandal" && shoe.bounceCount>=1 && Math.random()<0.015){
        showFlightText("ポーン！");
    }

    if(variant.id === "rollerskate" && shoe.rolling && Math.abs(shoe.vx)>220){
        if(Math.random()<0.018){ showFlightText("🛼 ゴロゴロゴロ…"); }
    }

}


/* =====================================================
   メイン物理
===================================================== */

function physicsStep(dt){

    const variant = currentShoe();

    shoe.vy += GRAVITY*dt;

    shoe.vx *= Math.max(0, 1 - variant.drag*dt);
    shoe.vy *= Math.max(0, 1 - variant.drag*0.35*dt);

    const windForce = WIND_BASE * variant.wind * (shoe.rolling ? 0.25 : 0.72);
    shoe.vx += windValue * windForce * dt;

    if(!shoe.rolling && shoe.vx>0){
        shoe.vx += 7*dt;
    }

    shoe.x += shoe.vx*dt;
    shoe.y += shoe.vy*dt;

    shoe.rotation += shoe.vx*dt*0.055;

    currentDistanceM = Math.max(0, shoe.x/PPM);
    updateHud();

    if(shoe.x >= course.length){
        finishRun(true, false);
        return;
    }

    const g = groundInfoAt(shoe.x);

    if(g===null){

        if(!shoe.overHole){
            shoe.overHole = true;
            shoe.holeEnterY = shoe.y;
            shoe.rolling = false;
        }

        if(shoe.vy>0 && shoe.y-shoe.holeEnterY > 360){
            handleHoleFall();
            return;
        }

        applyShoeSpecialPhysics(dt);
        return;
    }

    shoe.overHole=false;

    const groundY = g.y;

    if(shoe.rolling){

        const gAhead = groundInfoAt(shoe.x+18);

        if(gAhead && g.slope < -0.22 && gAhead.slope-g.slope > 0.18){

            shoe.vy = -Math.abs(shoe.vx)*0.72 - 90;
            shoe.vx *= 1.08;
            shoe.rolling=false;

            spawnBurst(shoe.x, shoe.y, 12);
            showFlightText("🚀 ジャンプ！");
            playJumpSound();
            settleTimer=0;

            return;
        }

        const slopeAngle = Math.atan(g.slope);

        shoe.vx += GRAVITY*Math.sin(slopeAngle)*dt;

        /* ここが未定義バグだった箇所: shoe.friction -> variant.friction に修正 */
        let friction = variant.friction;

        if(shoe.frictionOverride !== null){
            friction = shoe.frictionOverride;
        }

        if(isIceAt(shoe.x)){
            friction *= 0.10;
        }

        if(variant.id === "rollerskate"){
            friction *= 0.25;
        }

        const decay = friction * ROLL_DECAY_CONST * Math.max(0.35, Math.cos(slopeAngle));

        shoe.vx *= Math.exp(-decay*dt);

        if(g.slope > 0.12){
            shoe.vx += g.slope * 35 * dt;
        }

        shoe.y = groundY - SHOE_RADIUS;
        shoe.vy=0;

        if(Math.random()<0.25 && Math.abs(shoe.vx)>50){
            if(isIceAt(shoe.x)){
                spawnIceSpark(shoe.x, shoe.y+SHOE_RADIUS, 1);
            }else{
                spawnDust(shoe.x, shoe.y+SHOE_RADIUS, 1);
            }
        }

        if(Math.abs(shoe.vx) < STOP_SPEED){

            if(settleTimer<=0){ flashMessage("……止まる？"); }

            settleTimer += dt;

            if(settleTimer > SETTLE_TIME || flightTime > MAX_FLIGHT_TIME){
                finishRun(false, false);
                return;
            }

        }else{
            settleTimer=0;
        }

        applyShoeSpecialPhysics(dt);
        return;
    }

    if(shoe.y + SHOE_RADIUS >= groundY){

        const speed = Math.hypot(shoe.vx, shoe.vy);

        shoe.y = groundY - SHOE_RADIUS;

        if(shoe.heelBroken && !shoe.heelBrokenTriggered){

            shoe.heelBrokenTriggered=true;

            const boost = 1.45 + Math.random()*0.45;

            shoe.vx *= boost;
            shoe.vy = -Math.abs(shoe.vy)*0.75 - 70;

            shoe.frictionOverride = variant.friction * 0.12;

            showFlightText("💥 暴走！！");
            flashMessage("ヒールが折れて止まらない！");
            spawnBurst(shoe.x, shoe.y, 20);
            playHeelBreakSound();

            shoe.rolling=false;

            return;
        }

        if(speed > BOUNCE_MIN_SPEED){

            let decayFactor = Math.pow(0.91, shoe.bounceCount);

            let rest;

            if(variant.wild){
                rest = clamp(variant.restitution + (Math.random()*0.34-0.17), 0.15, 1.0);
            }else{
                rest = variant.restitution;
            }

            rest *= BOUNCE_SOFTEN * decayFactor;

            const res = bounceVelocity(shoe.vx, shoe.vy, g.slope, rest);

            shoe.vx = res.vx;
            shoe.vy = res.vy;

            shoe.vx *= 1.08;

            shoe.bounceCount++;

            spawnBurst(shoe.x, shoe.y, 8+Math.min(shoe.bounceCount,5));

            if(shoe.bounceCount===1){ showFlightText("ポンッ！"); }
            else if(shoe.bounceCount===2){ showFlightText("ポンポン！"); }
            else if(shoe.bounceCount>=3){ showFlightText("まだ飛ぶ！！"); }

            playBounceSound(speed);

            settleTimer=0;

        }else{
            shoe.rolling=true;
            shoe.vy=0;
        }

    }

    applyShoeSpecialPhysics(dt);
}


/* =====================================================
   穴
===================================================== */

function handleHoleFall(){

    const variant = currentShoe();

    if(variant.holeSurvive && Math.random() < variant.holeSurvive){

        const h = course.holes.find(hh => shoe.x >= hh.start-10 && shoe.x <= hh.end+100);
        const edgeX = h ? h.end+5 : shoe.x+45;

        shoe.x = edgeX;
        shoe.vx *= 0.72;
        shoe.vy = -100;
        shoe.overHole=false;

        const g = groundInfoAt(shoe.x);
        if(g){ shoe.y = g.y - SHOE_RADIUS; }

        shoe.rolling=true;

        flashMessage("ギリギリ踏ん張った！");
        showFlightText("👢 セーフ！");
        playSurviveSound();

        return;
    }

    flashMessage("穴に落ちた…");
    playHoleFallSound();
    finishRun(false, true);
}


/* =====================================================
   発射
===================================================== */

function release(){

    if(state !== "aiming"){ return; }

    const variant = currentShoe();
    const data = getSwingData();
    const quality = getLaunchQuality();

    const theta = data.theta;
    const thetaSpeed = data.thetaSpeed;

    const tangentSpeed = thetaSpeed * SWING_ROPE;

    let vxBase = Math.abs(tangentSpeed*Math.cos(theta));
    let vyBase = -Math.abs(tangentSpeed*Math.sin(theta));

    const scale = LAUNCH_MULT * variant.launchScale;
    const qualityMult = getLaunchMultiplier();

    shoe.vx = vxBase * scale * qualityMult;
    shoe.vy = vyBase * scale * qualityMult;

    if(shoe.vx < 80){ shoe.vx=80; }

    const g0 = groundInfoAt(0);

    shoe.x=0;
    shoe.y = (g0 ? g0.y : 285) - LAUNCH_HEIGHT;

    shoe.rotation=0;
    shoe.rolling=false;
    shoe.overHole=false;
    shoe.bounceCount=0;

    shoe.heelBroken = (variant.id === "heels" && Math.random()<0.12);
    shoe.heelBrokenTriggered=false;
    shoe.frictionOverride=null;

    currentDistanceM=0;
    flightTime=0;
    settleTimer=0;

    launchQuality = quality;

    state="flight";

    if(quality==="PERFECT"){
        showGrade("PERFECT", false);
        showFlightText("🔥 完璧！");
        spawnBurst(90,110,20);
        playPerfectSound();
    }
    else if(quality==="GOOD"){
        showGrade("GOOD", false);
        showFlightText("いいぞ！");
        spawnBurst(90,110,10);
        playGoodSound();
    }
    else{
        showGrade("MISS", false);
        playMissTimingSound();
    }

    playLaunchSound();
}

/* =====================================================
   結果
===================================================== */

function finishRun(reachedEnd, holeFall){

    if(state==="result"){ return; }

    state="result";

    let dist;

    if(reachedEnd){
        dist = currentDistanceM * 1.20;
    }else{
        dist = currentDistanceM;
    }

    finalDistanceM = Math.round(dist*10)/10;

    const isRecord = finalDistanceM > stats.best;

    stats.plays++;

    if(isRecord){ stats.best = finalDistanceM; }

    stats.top.push(finalDistanceM);
    stats.top.sort((a,b)=>b-a);
    stats.top = stats.top.slice(0,5);

    writeSave();

    showResult(reachedEnd, holeFall, isRecord);

    if(!holeFall){ playFinishSound(reachedEnd); }
}

    document.getElementById("resultDist").textContent = finalDistanceM+"m";

    else if(reachedEnd){ msg = "🎉 大飛行！コース制覇！"; }
    else{ msg = "🏁 着地！"; }

    document.getElementById("resultMsg").textContent = msg;
    document.getElementById("resultRecord").textContent = isRecord ? "🏆 自己ベスト更新！" : "";

    document.getElementById("resultOverlay").classList.add("show");
}

function spawnDust(x,y,n){
    for(let i=0;i<n;i++){
        particles.push({
            x, y,
            vx: Math.random()*60-30,
            vy: -Math.random()*45,
            life:.42, maxLife:.42,
            color:"201,160,106",
            r: 2+Math.random()*3
        });
    }
}

function spawnIceSpark(x,y,n){
    for(let i=0;i<n;i++){
        particles.push({
            x, y,
            vx: Math.random()*80-40,
            vy: -Math.random()*60,
            life:.35, maxLife:.35,
            color:"180,235,255",
            r: 2+Math.random()*2
        });
    }
}

function spawnBurst(x,y,n){
    for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2;
        const sp = 70+Math.random()*170;
        particles.push({
            x, y,
            vx: Math.cos(a)*sp,
            vy: Math.sin(a)*sp-70,
            life:.5, maxLife:.5,
            color:"255,220,150",
            r: 2+Math.random()*3
        });
    }
}

function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.vy += 500*dt;
        p.life -= dt;
        if(p.life<=0){ particles.splice(i,1); }
    }
}

/* =====================================================
   Audio
===================================================== */

function initAudio(){
    try{
        if(!audio){
            audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(audio.state === "suspended"){ audio.resume(); }
    }catch(e){ audio=null; }
}

function tone(frequency, duration, type="sine", volume=.045){
    if(!audio){ return; }
    try{
        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.type=type;
        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(0, audio.currentTime);
        gain.gain.linearRampToValueAtTime(volume, audio.currentTime+.008);
        gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime+duration);

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start();
        osc.stop(audio.currentTime+duration+.02);
    }catch(e){}
}

    setTimeout(()=>{ tone(330,.10,"triangle",.045); },55);

/* =====================================================
   背景描画

function drawSky(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#76c9f5");
    grad.addColorStop(.48,"#c9edff");
    grad.addColorStop(1,"#fff3dc");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
}

function drawSun(){
    const x=W-55, y=60;
    const grd = ctx.createRadialGradient(x,y,4,x,y,42);
    grd.addColorStop(0,"rgba(255,238,150,.95)");
    grd.addColorStop(1,"rgba(255,238,150,0)");
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(x,y,42,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ffe99a";
    ctx.beginPath();
    ctx.arc(x,y,15,0,Math.PI*2);
    ctx.fill();
}

function drawCloud(x,y,scale=1){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);

    ctx.fillStyle="rgba(255,255,255,.82)";

    ctx.beginPath();
    ctx.arc(-28,5,18,0,Math.PI*2);
    ctx.arc(-5,-5,25,0,Math.PI*2);
    ctx.arc(22,4,19,0,Math.PI*2);
    ctx.arc(0,10,28,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawClouds(){
    const shift = cameraX*.035;
    drawCloud(85-shift%560, 70, .9);
    drawCloud(310-shift%650, 105, .65);
    drawCloud(500-shift%800, 55, .75);
}

function drawMountain(){
    const cx = 175-cameraX*.055;
    const baseY = 235;

    ctx.fillStyle="rgba(102,148,176,.35)";
    ctx.beginPath();
    ctx.moveTo(cx-210,baseY);
    ctx.lineTo(cx,68);
    ctx.lineTo(cx+220,baseY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.82)";
    ctx.beginPath();
    ctx.moveTo(cx-63,119);
    ctx.lineTo(cx,68);
    ctx.lineTo(cx+68,120);
    ctx.lineTo(cx+35,108);
    ctx.lineTo(cx+12,132);
    ctx.lineTo(cx-8,108);
    ctx.lineTo(cx-34,132);
    ctx.closePath();
    ctx.fill();
}

function drawBackGroundHills(){
    const offset = cameraX*.12;

    ctx.fillStyle="rgba(114,180,157,.28)";
    ctx.beginPath();
    ctx.moveTo(0,250);

    for(let x=0;x<=W+40;x+=40){
        const worldX = x+offset;
        const y = 238+Math.sin(worldX*.008)*18+Math.sin(worldX*.021)*9;
        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();
}


/* =====================================================
   地面
===================================================== */

function drawCourse(){

    if(!course){ return; }

    ctx.save();
    ctx.scale(camScale, camScale);
    ctx.translate(-cameraX, -cameraY);

    for(const seg of course.segments){

        if(seg.length<2){ continue; }

        ctx.beginPath();
        ctx.moveTo(seg[0].x, seg[0].y);
        for(let i=1;i<seg.length;i++){ ctx.lineTo(seg[i].x, seg[i].y); }

        const last = seg[seg.length-1];
        ctx.lineTo(last.x, H+300);
        ctx.lineTo(seg[0].x, H+300);
        ctx.closePath();

        ctx.fillStyle="#d6ad78";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(seg[0].x, seg[0].y);
        for(let i=1;i<seg.length;i++){ ctx.lineTo(seg[i].x, seg[i].y); }

        ctx.strokeStyle="#77b85b";
        ctx.lineWidth=8;
        ctx.lineCap="round";
        ctx.stroke();
    }

    drawHoles();
    drawIceZones();
    drawRamps();

    ctx.restore();
}


function drawHoles(){
    for(const h of course.holes){

        if(h.end < cameraX-100 || h.start > cameraX+W+100){ continue; }

        ctx.fillStyle="#43515d";
        ctx.beginPath();
        ctx.moveTo(h.start, h.yStart);
        ctx.lineTo(h.end, h.yEnd);
        ctx.lineTo(h.end, h.yEnd+70);
        ctx.lineTo(h.start, h.yStart+70);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle="#7e654b";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(h.start, h.yStart);
        ctx.lineTo(h.end, h.yEnd);
        ctx.stroke();

        const mx = (h.start+h.end)/2;
        const my = (h.yStart+h.yEnd)/2+22;

        ctx.fillStyle="rgba(255,220,100,.8)";
        ctx.font="bold 17px sans-serif";
        ctx.fillText("!", mx, my);
    }
}


function drawIceZones(){
    for(const z of course.iceZones){

        if(z.end < cameraX-100 || z.start > cameraX+W+100){ continue; }

        const g1 = groundInfoAt(z.start);
        const g2 = groundInfoAt(z.end);

        if(!g1 || !g2){ continue; }

        ctx.fillStyle="rgba(183,235,255,.82)";
        ctx.beginPath();
        ctx.moveTo(z.start, g1.y-2);
        ctx.lineTo(z.end, g2.y-2);
        ctx.lineTo(z.end, g2.y+7);
        ctx.lineTo(z.start, g1.y+7);
        ctx.closePath();
        ctx.fill();

        for(let i=0;i<4;i++){
            const px = z.start + (z.end-z.start)*(i+1)/5;
            const pg = groundInfoAt(px);
            if(pg){
                ctx.fillStyle="rgba(255,255,255,.75)";
                ctx.fillRect(px, pg.y-4, 9, 2);
            }
        }
    }
}


function drawRamps(){
    for(const r of course.ramps){

        if(r.end < cameraX-100 || r.start > cameraX+W+100){ continue; }

        const startG = groundInfoAt(r.start);
        if(!startG){ continue; }

        ctx.fillStyle="#e88d4e";
        ctx.beginPath();
        ctx.moveTo(r.start, startG.y);
        ctx.lineTo(r.end, r.peakY);
        ctx.lineTo(r.end, r.peakY+18);
        ctx.lineTo(r.start, startG.y+18);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle="rgba(255,255,255,.7)";
        ctx.lineWidth=3;

        for(let x=r.start+18; x<r.end; x+=25){
            const t = (x-r.start)/(r.end-r.start);
            const y = startG.y + (r.peakY-startG.y)*t;

            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x+8,y+8);
            ctx.stroke();
        }
    }
}


/* =====================================================
   ブランコ
===================================================== */

function drawSwing(){

    const data = getSwingData();
    const theta = data.theta;

    const pivotX = 88;
    const pivotY = 28;
    const rope = SWING_ROPE;

    const seatX = pivotX + Math.sin(theta)*rope;
    const seatY = pivotY + Math.cos(theta)*rope;

    ctx.save();

    ctx.strokeStyle="#78563e";
    ctx.lineWidth=9;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(18,125);
    ctx.lineTo(55,28);
    ctx.lineTo(125,28);
    ctx.lineTo(158,125);
    ctx.stroke();

    ctx.strokeStyle="#9a704e";
    ctx.lineWidth=7;
    ctx.beginPath();
    ctx.moveTo(55,28);
    ctx.lineTo(125,28);
    ctx.stroke();

    ctx.strokeStyle="#eee2c5";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pivotX,pivotY);
    ctx.lineTo(seatX,seatY);
    ctx.stroke();

    ctx.fillStyle="#d86c43";
    ctx.fillRect(seatX-16, seatY-4, 32, 7);

    ctx.fillStyle="#456b87";
    ctx.beginPath();
    ctx.arc(seatX, seatY-21, 8, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#456b87";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(seatX, seatY-13);
    ctx.lineTo(seatX, seatY+1);
    ctx.stroke();

    if(state==="aiming"){
        ctx.fillStyle="rgba(255,255,255,.82)";
        ctx.font="bold 11px sans-serif";
        ctx.fillText("動きを見てタップ！", 89, 150);
    }

    ctx.restore();
}


/* =====================================================
   靴描画
===================================================== */

function drawShoe(){

    if(!shoe){ return; }

    const variant = currentShoe();

    ctx.save();
    ctx.scale(camScale, camScale);
    ctx.translate(-cameraX, -cameraY);
    ctx.translate(shoe.x, shoe.y);
    ctx.rotate(shoe.rotation);

    ctx.fillStyle="rgba(40,55,70,.18)";
    ctx.beginPath();
    ctx.ellipse(0, SHOE_RADIUS+5, 18, 5, 0, 0, Math.PI*2);
    ctx.fill();

    let mainColor = "#ff6f4f";

    if(variant.id==="leather" || variant.id==="geta"){ mainColor="#633f2b"; }
    else if(variant.id==="boots"){ mainColor="#e6c34f"; }
    else if(variant.id==="heels"){ mainColor="#e56b82"; }
    else if(variant.id==="sandal"){ mainColor="#ffbe72"; }
    else if(variant.id==="crocs"){ mainColor="#71b87c"; }
    else if(variant.id==="rollerskate"){ mainColor="#88bde5"; }
    else if(variant.id==="uwabaki"){ mainColor="#3fa9a4"; }

    ctx.fillStyle=mainColor;
    ctx.strokeStyle="rgba(30,35,45,.6)";
    ctx.lineWidth=1.6;

    ctx.beginPath();
    if(ctx.roundRect){
        ctx.roundRect(-19,-8,34,17,7);
    }else{
        ctx.rect(-19,-8,34,17);
    }
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(15,2,12,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#555b60";
    ctx.fillRect(-19,7,36,4);

    if(variant.id!=="sandal" && variant.id!=="boots"){
        ctx.strokeStyle="rgba(70,80,90,.65)";
        ctx.lineWidth=2;
        for(let i=0;i<3;i++){
            ctx.beginPath();
            ctx.moveTo(-8,-5+i*4);
            ctx.lineTo(5,-5+i*4);
            ctx.stroke();
        }
    }

    if(variant.id==="heels"){
        ctx.strokeStyle="#b63d5d";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(11,7);
        ctx.lineTo(14,18);
        ctx.stroke();
    }

    if(variant.id==="rollerskate"){
        ctx.fillStyle="#46525d";
        ctx.beginPath();
        ctx.arc(-8,12,4,0,Math.PI*2);
        ctx.arc(8,12,4,0,Math.PI*2);
        ctx.fill();
    }

    if(shoe.overHole){ ctx.globalAlpha=.75; }

    ctx.restore();
}


/* =====================================================
   発射位置の矢印
===================================================== */

function drawAimGuide(){

    if(state!=="aiming"){ return; }

    const data = getSwingData();
    const theta = data.theta;
    const speed = data.thetaSpeed;

    const x = 88 + Math.sin(theta)*SWING_ROPE;
    const y = 28 + Math.cos(theta)*SWING_ROPE;

    const dir = speed>=0 ? 1 : -1;

    ctx.save();
    ctx.globalAlpha=.75;

    ctx.strokeStyle = dir>0 ? "#ff7658" : "#71859a";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(x, y+28);
    ctx.lineTo(x+dir*30, y+28);
    ctx.stroke();

    ctx.fillStyle=ctx.strokeStyle;

    ctx.beginPath();
    ctx.moveTo(x+dir*30, y+28);
    ctx.lineTo(x+dir*20, y+22);
    ctx.lineTo(x+dir*20, y+34);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* =====================================================
   パーティクル描画
===================================================== */

function drawParticles(){
    ctx.save();
    ctx.scale(camScale, camScale);
    ctx.translate(-cameraX, -cameraY);

    for(const p of particles){

        ctx.globalAlpha = clamp(p.life/p.maxLife, 0, 1);
        ctx.fillStyle = "rgb("+p.color+")";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
}


/* =====================================================
   Grade Popup
===================================================== */

function drawGradePopup(dt){

    if(!gradePopup){ return; }

    gradePopup.t += dt;

    const p = gradePopup.t / gradePopup.maxT;

    if(p>=1){ gradePopup=null; return; }

    let alpha=1;
    if(p>.7){ alpha = 1-(p-.7)/.3; }

    const scale = p<.2 ? .7+p/.2*.45 : 1.15-(p-.2)*.15;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W/2, 205-p*30);
    ctx.scale(scale, scale);

    ctx.fillStyle = gradePopup.color;
    ctx.font="900 34px sans-serif";
    ctx.shadowColor="rgba(40,40,50,.35)";
    ctx.shadowBlur=5;
    ctx.shadowOffsetY=3;

    ctx.fillText(gradePopup.text, 0, 0);

    ctx.restore();
}


/* =====================================================
   カメラ
===================================================== */

function updateCamera(){

    if(state!=="flight"){ cameraX=0; cameraY=0; camScale=1; return; }

    /*
     * 靴が地面からどれだけ高いかを見て、
     * 高いほどズームアウトして地面も画面に収める。
     */

    const g = groundInfoAt(shoe.x);
    if(g){ lastGroundY = g.y; }
    const groundRefY = (lastGroundY!=null) ? lastGroundY : 300;

    const heightAboveGround = Math.max(0, groundRefY - shoe.y);
    const desiredSpan = heightAboveGround + H*0.62;

    camScale = clamp(H/Math.max(H, desiredSpan), 0.34, 1);

    const anchorX = W*.32;
    const anchorY = H*.36;

    cameraX = shoe.x - anchorX/camScale;
    cameraY = shoe.y - anchorY/camScale;

    const maxCamX = Math.max(0, course.length - W/camScale);
    cameraX = Math.max(0, Math.min(cameraX, maxCamX));
}


/* =====================================================
   メイン描画
===================================================== */

function renderGame(dt){

    if(!ctx){ return; }

    drawSky();
    drawSun();
    drawClouds();
    drawMountain();
    drawBackGroundHills();
    drawCourse();

    if(state==="aiming"){
        drawSwing();
        drawAimGuide();
    }

    if(state==="flight" || state==="result"){
        drawShoe();
    }

    drawParticles();
    drawGradePopup(dt);
}


/* =====================================================
   ゲーム更新
===================================================== */

function updateGame(dt){

    if(state==="aiming"){
        swingT += dt;
        return;
    }

    if(state==="flight"){

        flightTime += dt;

        if(flightTime > MAX_FLIGHT_TIME){
            finishRun(false, false);
            return;
        }

        physicsStep(dt);
        updateCamera();
    }
}


/* =====================================================
   メインループ
===================================================== */

function gameLoop(timestamp){

    if(!lastTime){ lastTime = timestamp; }

    let dt = (timestamp-lastTime)/1000;
    lastTime = timestamp;

    dt = clamp(dt, 0, .035);

    updateGame(dt);
    updateParticles(dt);
    renderGame(dt);

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   スタート時UI
===================================================== */

function initGame(){

    loadSave();
    buildShoeGrid();
    renderTitleStats();

    document.addEventListener("touchstart", ()=>{ initAudio(); }, { once:true, passive:true });
    document.addEventListener("click", ()=>{ initAudio(); }, { once:true });

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   画面初期化
===================================================== */

window.addEventListener("load", ()=>{ initGame(); });


/* =====================================================
   iPhone向け ダブルタップズーム防止
===================================================== */

let lastTouchTime=0;

document.addEventListener("touchend", function(e){
    const now = Date.now();
    if(now-lastTouchTime < 300){ e.preventDefault(); }
    lastTouchTime=now;
}, { passive:false });


/* =====================================================
   iPhone向け 長押しメニュー防止
===================================================== */

document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* =====================================================
   Part 3 END
===================================================== */

</script>
