<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>イライラすとっぷ</title>

<style>

body{
 margin:0;
 background:#111;
 color:white;
 font-family:sans-serif;
 text-align:center;
}

h1{
 font-size:40px;
 margin-top:40px;
}

.sub{
 color:#ccc;
 font-size:20px;
 line-height:1.8;
}


button{
 font-size:28px;
 padding:15px 45px;
 border-radius:20px;
 border:none;
 background:#00ffff;
}


#game{
 display:none;
}


.field{

width:90%;
height:300px;
background:#222;
border:3px solid white;
margin:20px auto;
position:relative;
overflow:hidden;

}


.zone{

position:absolute;
left:50%;
top:80px;
transform:translateX(-50%);

width:80px;
height:120px;

border:3px solid lime;

}


.ufo{

position:absolute;

top:110px;

font-size:45px;

left:0;

}


#message{

font-size:22px;
min-height:50px;

}


.status{

font-size:20px;

}


.bar{

width:80%;
height:25px;

background:#333;

margin:10px auto;

border-radius:20px;

overflow:hidden;

}


#stress{

height:100%;

width:50%;

background:red;

}


.rank{

margin-top:20px;

}


.hidden{

display:none;

}

</style>

</head>


<body>


<div id="title">


<h1>
😡 イライラすとっぷ
</h1>


<div class="sub">

🛸 UFOを狙い撃ち<br>

真ん中でSTOPできるか？

<br><br>

外したらストレス爆発💥

</div>


<button onclick="startGame()">

START

</button>


<div class="rank">

<h2>🏆 TOP5</h2>

<div id="ranking"></div>

</div>


</div>



<div id="game">


<div class="field">


<div class="zone"></div>


<div class="ufo" id="ufo">

🛸

</div>


</div>



<div class="status">

連続命中：
<span id="combo">
0
</span>

<br>

スコア：
<span id="score">
0
</span>

<br>

ストレス

</div>


<div class="bar">

<div id="stress"></div>

</div>


<button onclick="stopGame()">

STOP

</button>


</div>



<div id="message"></div>



<script>


let ufo=document.getElementById("ufo");

let x=0;

let direction=1;

let speed=4;

let timer;


let combo=0;

let score=0;

let stress=50;


let audio=new AudioContext();



function sound(freq,time){

let o=audio.createOscillator();

let g=audio.createGain();


o.connect(g);

g.connect(audio.destination);


o.frequency.value=freq;


g.gain.setValueAtTime(
0.2,
audio.currentTime
);


g.gain.exponentialRampToValueAtTime(
0.001,
audio.currentTime+time
);


o.start();

o.stop(audio.currentTime+time);

}


function startGame(){


document.getElementById("title").style.display="none";

document.getElementById("game").style.display="block";


sound(600,0.1);


speed=3+Math.random()*4;


move();


}function move(){

timer=setInterval(()=>{


x += speed * direction;


// 端で反転
if(x > window.innerWidth*0.75){

direction=-1;

speed+=0.5;

sound(300,0.05);

}


if(x < 0){

direction=1;

speed+=0.5;

}


// たまにフェイント
if(Math.random()<0.02){

direction*= -1;

}


ufo.style.left=x+"px";


},20);


}



function stopGame(){

clearInterval(timer);


sound(200,0.15);


// UFO位置判定
let center=
window.innerWidth/2;


let distance=
Math.abs(
(x+25)-center
);



if(distance < 50){


combo++;


score += combo*100;


stress-=10;


sound(900,0.3);


let success=[

"🎯命中！今日は定時で帰れるかも",

"🔥完璧！上司の攻撃を回避",

"🛸UFO撃墜！ストレス減少"

];


document.getElementById("message").innerHTML=
success[Math.floor(Math.random()*success.length)];



}else{


combo=0;


stress+=25;


sound(100,0.4);



let fail=[


"💀ハズレ！UFOに笑われています",

"🛸UFO『そのタイミング？』",

"😭残念。ストレス増加しました",

"🤖AI判定：反射神経アップデート失敗"


];


document.getElementById("message").innerHTML=
fail[Math.floor(Math.random()*fail.length)];


}



if(stress<0){

stress=0;

}


if(stress>100){

stress=100;

document.getElementById("message").innerHTML=

"💀限界突破！今日は帰って寝よう";

}



document.getElementById("combo").innerHTML=
combo;


document.getElementById("score").innerHTML=
score;


document.getElementById("stress").style.width=
stress+"%";



saveScore();



setTimeout(()=>{

document.getElementById("message").innerHTML="";

move();


},1200);



}



function saveScore(){


let data=
JSON.parse(
localStorage.getItem("ranking")||"[]"
);


data.push(score);


data.sort((a,b)=>b-a);


data=data.slice(0,5);


localStorage.setItem(
"ranking",
JSON.stringify(data)
);


showRank();


}



function showRank(){


let data=
JSON.parse(
localStorage.getItem("ranking")||"[]"
);


let html="";


data.forEach((v,i)=>{


html+=
(i+1)+"位 "+v+"点<br>";


});


document.getElementById("ranking").innerHTML=

html || "まだ記録なし";


}



showRank();


</script>

</body>

</html>
