<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>靴飛ばし大飛行！Ver.2</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
 user-select:none;
}

body{
 margin:0;
 min-height:100vh;
 background:linear-gradient(160deg,#bfe4ff,#e8f7ff 45%,#fff8ec);
 color:#33465e;
 font-family:
 "Hiragino Maru Gothic ProN",
 "Yu Gothic",
 "M PLUS Rounded 1c",
 sans-serif;
 text-align:center;
 overflow-x:hidden;
}

.wrap{
 max-width:480px;
 margin:auto;
 padding:14px 12px 30px;
}

h1{
 font-size:27px;
 margin:7px 0;
 color:#294b6d;
 text-shadow:0 2px #fff;
}

.badge{
 display:inline-block;
 background:linear-gradient(135deg,#ff8c62,#ffd05a);
 color:#633b1d;
 padding:5px 15px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
}

.sub{
 font-size:13px;
 line-height:1.7;
 margin:8px 0 12px;
 color:#506b89;
}

button{
 font-family:inherit;
 border:0;
 font-weight:bold;
 border-radius:50px;
 cursor:pointer;
}

.bigBtn{
 font-size:21px;
 padding:13px 48px;
 color:white;
 background:linear-gradient(135deg,#ff7357,#ffb703);
 box-shadow:0 8px 18px #ff735760;
}

.shoeGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:12px 0;
}

.shoeCard{
 background:#fff;
 border:2px solid #dce8f3;
 border-radius:15px;
 padding:7px 3px;
 box-shadow:0 3px 9px #33465e12;
}

.shoeCard.active{
 border-color:#ff795c;
 background:#fff4ed;
 box-shadow:0 4px 15px #ff795c40;
}

.shoeCard .emo{
 font-size:27px;
}

.shoeCard .nm{
 font-size:11px;
 font-weight:bold;
}

.flavorBox{
 background:#fff;
 border:1px solid #dce8f3;
 border-radius:14px;
 padding:9px;
 font-size:12px;
 min-height:38px;
}

.rankBox{
 background:#fff;
 border:1px solid #dce8f3;
 border-radius:15px;
 margin-top:10px;
 padding:8px 0;
}

.rankBox h2{
 margin:4px 0 7px;

}

.rankRow,
.statRow{

}

.statRow{

}

.statRow span:last-child{

 color:#294b6d;
}

/* GAME */

#gameScreen{
 display:none;
}

.gameWrap{
 position:relative;
 width:100%;
 max-width:480px;
 margin:auto;
}

canvas{
 width:100%;
 display:block;
 border-radius:20px;
 background:#bfe4ff;
 box-shadow:0 6px 20px #33465e35;
 touch-action:manipulation;
}

.hud{
 position:absolute;
 top:8px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:0 9px;
 pointer-events:none;
}

.hudBox{
 background:#ffffffdd;
 border-radius:12px;
 padding:4px 9px;
 font-size:11px;
 font-weight:bold;
 box-shadow:0 2px 8px #33465e20;
}

.hudBox .big{
 font-size:17px;
 color:#ff7657;
}

#eventMsg{
 position:absolute;
 top:47px;
 left:50%;
 transform:translateX(-50%);

 color:#ffe19a;

 border-radius:15px;
 font-size:13px;
 font-weight:bold;
 opacity:0;
 transition:.2s;
 white-space:nowrap;
 pointer-events:none;
}

#eventMsg.show{
 opacity:1;
}

#comboMsg{
 position:absolute;
 top:95px;
 left:50%;
 transform:translateX(-50%) scale(.7);
 font-size:25px;
 font-weight:900;
 color:#fff;
 text-shadow:
 0 3px 0 #d05b23,
 0 0 10px #ffbd3d;
 opacity:0;
 transition:.15s;
 pointer-events:none;
}

#comboMsg.show{
 opacity:1;
 transform:translateX(-50%) scale(1);
}

#judge{
 position:absolute;
 left:50%;
 top:155px;
 transform:translate(-50%,-50%) scale(.7);
 font-size:30px;
 font-weight:900;
 opacity:0;
 pointer-events:none;
 text-shadow:0 3px 0 #684;
}

#judge.show{
 animation:judge .7s forwards;
}

@keyframes judge{
 0%{
  opacity:0;
  transform:translate(-50%,-50%) scale(.5) rotate(-8deg);
 }
 20%{
  opacity:1;
  transform:translate(-50%,-50%) scale(1.15) rotate(4deg);
 }
 100%{
  opacity:0;
  transform:translate(-50%,-90%) scale(1);
 }
}

.fireBtnWrap{
 margin-top:10px;
}

#fireBtn{
 font-size:21px;
 padding:13px 52px;
 color:#fff;
 background:linear-gradient(135deg,#ff7357,#ffb703);

}

.tapHint{

 font-size:11px;
 color:#7189a4;
}

.resultOverlay{

 inset:0;
 background:#0d1b2ae8;
 border-radius:20px;
 color:#fff;
 align-items:center;
 justify-content:center;
 flex-direction:column;

}

.resultOverlay.show{
 display:flex;
}

.distTitle{
 font-size:14px;

}

.distNum{

 color:#ffd057;
 text-shadow:0 3px #a96f15;

}

.distMsg{
 font-size:14px;
 margin-bottom:5px;
}

.record{

 font-weight:bold;
 min-height:20px;
}

.resultStats{

 margin:4px 0 12px;
}

.resultBtnRow{

}

.resultBtnRow button{

}

.backBtn{

.timingBox{

}

.timingTrack{

 background:#ffffff99;

 position:relative;

 left:44%;

}

}

}

.timingLabel{
 font-size:11px;
 margin-top:3px;
 color:#fff;
 font-weight:bold;
 text-shadow:0 1px 2px #333;
}

<div class="gameWrap">

<script>

/* =========================================================
   基本設定
========================================================= */

const GRAVITY=300;
const WIND_BASE=90;
const PPM=18;

const SWING_ROPE=120;
const SWING_MAX_ANGLE=0.96;
const SWING_PERIOD=1.6;

const SHOE_RADIUS=15;

const BOUNCE_MIN_SPEED=40;
const STOP_SPEED=14;

const MAX_FLIGHT_TIME=25;

const SAVE_KEY="kutsutobashi_v2";


/* =========================================================
   靴
========================================================= */

const SHOES=[

{
 id:"sneaker",
 name:"スニーカー",
 emoji:"👟",
 restitution:.52,
 friction:.30,
 drag:.06,
 launchScale:1,
 wind:1,
 flavor:"バランス型。クセがなく使いやすい。"
},

{
 id:"sandal",
 name:"サンダル",
 emoji:"🩴",
 restitution:.78,
 friction:.42,
 drag:.10,
 launchScale:.95,
 wind:1.5,
 flavor:"超バウンド型。追い風なら爆発的に伸びる。"
},

{
 id:"leather",
 name:"革靴",
 emoji:"👞",
 restitution:.25,
 friction:.08,
 drag:.025,
 launchScale:.9,
 wind:.45,
 flavor:"重い。だが一度転がると止まらない。"
},

{
 id:"boots",
 name:"長靴",
 emoji:"👢",
 restitution:.18,
 friction:.32,
 drag:.12,
 launchScale:.85,
 wind:.55,
 holeSurvive:.65,
 flavor:"穴に強い。落ちても65%で生還。"
},

{
 id:"heels",
 name:"ハイヒール",
 emoji:"👠",
 restitution:.48,
 friction:.05,
 drag:.055,
 launchScale:1,
 wind:.9,
 wild:true,
 flavor:"超滑る。10%でヒールが折れて暴走。"
},

{
 id:"uwabaki",
 name:"上履き",
 emoji:"🥿",
 restitution:.56,
 friction:.22,
 drag:.045,
 launchScale:1.18,
 wind:1.1,
 flavor:"初速最強。靴飛ばしのエース。"
},

{
 id:"geta",
 name:"下駄",
 emoji:"👡",
 restitution:.17,
 friction:.045,
 drag:.025,
 launchScale:.84,
 wind:.4,
 flavor:"ほぼ弾まない。でも転がると異常に強い。"
},

{
 id:"crocs",
 name:"クロックス",
 emoji:"🥾",
 restitution:.4,
 friction:.32,
 drag:.11,
 launchScale:1,
 wind:1.8,
 flavor:"風の影響MAX。追い風なら化ける。"
},

{
 id:"roller",
 name:"ローラー",
 emoji:"🛼",
 restitution:.08,
 friction:.018,
 drag:.06,
 launchScale:.94,
 wind:.8,
 flavor:"弾まない代わりに地面を永遠に転がる。"
}

];


/* =========================================================
   状態
========================================================= */

let canvas,ctx;

let W=480;
let H=380;

let state="title";

let course;

let cameraX=0;

let swingT=0;

let selectedShoeId="sneaker";

let shoe={
 x:0,
 y:0,
 vx:0,
 vy:0,
 rotation:0,
 rolling:false,
 overHole:false,
 bounceCount:0,
 heelBroken:false,
 heelBrokenTriggered:false
};

let particles=[];

let lastTime=0;

let currentDistanceM=0;
let finalDistanceM=0;

let windValue=0;
let windAnimT=0;

let combo=0;
let coins=0;

let flightTime=0;
let settleTimer=0;

let audio=null;

let stats={
 best:0,
 plays:0,
 top:[]
};


/* =========================================================
   共通
========================================================= */

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function currentShoe(){
 return SHOES.find(s=>s.id===selectedShoeId);
}


/* =========================================================
   セーブ
========================================================= */

function loadSave(){

 try{

  const raw=localStorage.getItem(SAVE_KEY);

  if(raw){

   const d=JSON.parse(raw);

   if(d.stats){
    Object.assign(stats,d.stats);
   }

  }

 }catch(e){}

}


function writeSave(){

 try{

  localStorage.setItem(
   SAVE_KEY,
   JSON.stringify({stats})
  );

 }catch(e){}

}


/* =========================================================
   風
========================================================= */

function rollWind(){

 windValue=
 (Math.random()*2-1)
 *
 (.35+Math.random()*.65);

}


function windLabel(){

 const a=Math.abs(windValue);

 if(a<.15)
  return "🌤 無風";

 const strength=
 a<.45?"弱":
 a<.75?"中":"強";

 return windValue>0
  ?"➡️ 追い風 "+strength
  :"⬅️ 向かい風 "+strength;
}


/* =========================================================
   コース生成
========================================================= */

function generateCourse(){

 const TARGET=18000;

 const ground=[
  {x:0,y:260}
 ];

 let x=0;
 let y=260;

 const holes=[];
 const ramps=[];
 const windZones=[];
 const coinsList=[];

 while(x<TARGET){

  const r=Math.random();

  let len=
   140+
   Math.random()*240;

  let dy=0;

  if(r<.25){

   // 上り

   dy=-(25+Math.random()*50);

  }else if(r<.48){

   // 下り

   dy=25+Math.random()*60;

  }

  const oldX=x;
  const oldY=y;

  x+=len;
  y=clamp(y+dy,90,320);

  ground.push({x,y});


  /* ジャンプ台 */

  if(Math.random()<.18){

   const rx=x+15;

   const ry=y-55;

   ramps.push({
    x:rx,
    y:ry,
    width:55
   });

  }


  /* 穴 */

  if(x>700 && Math.random()<.18){

   const gap=50+Math.random()*70;

   holes.push({
    start:x+20,
    end:x+20+gap,
    yStart:y,
    yEnd:y+Math.random()*10
   });

   x+=gap+30;

   ground.push({
    x,
    y
   });

  }


  /* 風ゾーン */

  if(Math.random()<.12){

   windZones.push({
    start:x+30,
    end:x+180,
    power:(Math.random()>.5?1:-1)
   });

  }


  /* コイン */

  if(Math.random()<.3){

   coinsList.push({
    x:x+40+Math.random()*100,
    y:y-40-Math.random()*80,
    got:false
   });

  }

 }

 return {
  ground,
  holes,
  ramps,
  windZones,
  coins:coinsList,
  length:x
 };

}


/* =========================================================
   地面判定
========================================================= */

function groundInfoAt(x){

 const g=course.ground;

 for(let i=0;i<g.length-1;i++){

  if(x>=g[i].x && x<=g[i+1].x){

   const dx=g[i+1].x-g[i].x;

   const t=(x-g[i].x)/(dx||1);

   const y=
    g[i].y+
    (g[i+1].y-g[i].y)*t;

   const slope=
    (g[i+1].y-g[i].y)/(dx||1);

   return {
    y,
    slope
   };

  }

 }

 return null;

}


/* =========================================================
   穴
========================================================= */

function holeAt(x){

 return course.holes.find(
  h=>x>=h.start && x<=h.end
 );

}


/* =========================================================
   物理
========================================================= */

function bounceVelocity(
 vx,
 vy,
 slope,
 restitution
){

 const len=Math.sqrt(slope*slope+1);

 const nx=slope/len;
 const ny=-1/len;

 const dot=vx*nx+vy*ny;

 return {

  vx:(vx-2*dot*nx)*restitution,

  vy:(vy-2*dot*ny)*restitution

 };

}


function physicsStep(dt){

 const variant=currentShoe();

 /* 重力 */

 shoe.vy+=GRAVITY*dt;


 /* 空気抵抗 */

 shoe.vx*=1-variant.drag*dt;

 shoe.vy*=1-variant.drag*.6*dt;


 /* 風 */

 shoe.vx+=
 windValue*
 WIND_BASE*
 variant.wind*
 dt;


 /* 特殊風ゾーン */

 for(const z of course.windZones){

  if(
   shoe.x>=z.start &&
   shoe.x<=z.end
  ){

   shoe.vx+=
    z.power*
    170*
    variant.wind*
    dt;

   if(Math.random()<.015){

    flashMessage(
     z.power>0
      ?"💨 強烈な追い風！"
      :"🌪 強烈な向かい風！"
    );

   }

  }

 }


 shoe.x+=shoe.vx*dt;
 shoe.y+=shoe.vy*dt;

 shoe.rotation+=shoe.vx*dt*.06;


 currentDistanceM=
  Math.max(0,shoe.x/PPM);

 updateHud();


 /* コイン */

 for(const c of course.coins){

  if(!c.got){

   const d=
    Math.hypot(
     shoe.x-c.x,
     shoe.y-c.y
    );

   if(d<30){

    c.got=true;

    coins++;

    combo++;

    flashCombo();

    spawnBurst(
     c.x,
     c.y,
     10
    );

    playCoinSound();

   }

  }

 }


 /* コース制覇 */

 if(shoe.x>=course.length){

  finishRun(true,false);

  return;

 }


 /* 穴 */

 const hole=holeAt(shoe.x);

 if(hole){

  if(!shoe.overHole){

   shoe.overHole=true;

   shoe.holeStartY=shoe.y;

  }

  if(
   shoe.y-shoe.holeStartY>240
  ){

   handleHoleFall();

   return;

  }

 }else{

  shoe.overHole=false;

 }


 const g=groundInfoAt(shoe.x);

 if(!g)
  return;


 /* 着地 */

 if(
  shoe.y+SHOE_RADIUS>=g.y &&
  shoe.vy>0
 ){

  shoe.y=
   g.y-SHOE_RADIUS;


  const speed=
   Math.hypot(
    shoe.vx,
    shoe.vy
   );


  /* ヒール折れ */

  if(
   shoe.heelBroken &&
   !shoe.heelBrokenTriggered
  ){

   shoe.heelBrokenTriggered=true;

   shoe.vx*=2.1;

   shoe.vy*=1.2;

   flashMessage(
    "💥 パキッ！ヒールが折れた！"
   );

   spawnBurst(
    shoe.x,
    shoe.y,
    20
   );

   playHeelBreakSound();

  }


  /* ジャンプ台 */

  const ramp=
   course.ramps.find(
    r=>
     shoe.x>=r.x &&
     shoe.x<=r.x+r.width
   );

  if(ramp){

   shoe.vy=
    -Math.abs(shoe.vx)*.65-130;

   shoe.rolling=false;

   combo++;

   flashCombo();

   flashMessage("🚀 ジャンプ台！！");

   spawnBurst(
    shoe.x,
    shoe.y,
    16
   );

   playJumpSound();

   return;

  }


  if(speed>BOUNCE_MIN_SPEED){

   let rest=
    variant.restitution;

   if(variant.wild){

    rest=
     clamp(
      rest+
      (Math.random()-.5)*.5,
      .08,
      .95
     );

   }


   rest*=
    Math.pow(.85,shoe.bounceCount);


   const res=
    bounceVelocity(
     shoe.vx,
     shoe.vy,
     g.slope,
     rest
    );


   shoe.vx=res.vx;
   shoe.vy=res.vy;

   shoe.bounceCount++;

   combo++;

   flashCombo();

   spawnBurst(
    shoe.x,
    shoe.y,
    7
   );

   playBounceSound(speed);

  }else{

   shoe.rolling=true;

  }

 }


 /* 転がり */

 if(shoe.rolling){

  const angle=
   Math.atan(g.slope);

  shoe.vx+=
   GRAVITY*
   Math.sin(angle)*
   dt;


  const friction=
   variant.friction;


  shoe.vx*=
   Math.exp(
    -friction*
    5*
    Math.max(
     .4,
     Math.cos(angle)
    )*
    dt
   );


  shoe.y=
   g.y-SHOE_RADIUS;

  shoe.vy=0;


  if(Math.abs(shoe.vx)<STOP_SPEED){

   settleTimer+=dt;

   if(settleTimer>.55){

    finishRun(false,false);

    return;

   }

  }else{

   settleTimer=0;

  }

 }

}


/* =========================================================
   穴落下
========================================================= */

function handleHoleFall(){

 const variant=currentShoe();

 if(
  variant.holeSurvive &&
  Math.random()<variant.holeSurvive
 ){

  const h=holeAt(shoe.x);

  shoe.x=
   h ?
   h.end+6 :
   shoe.x+50;

  shoe.vx*=.35;

  shoe.vy=0;

  shoe.overHole=false;

  const g=groundInfoAt(shoe.x);

  if(g)
   shoe.y=
    g.y-SHOE_RADIUS;

  shoe.rolling=true;

  combo++;

  flashMessage(
   "😳 ギリギリ踏ん張った！！"
  );

  playSurviveSound();

 }else{

  combo=0;

  flashMessage(
   "🕳️ 穴に落ちたーー！！"
  );

  playHoleFallSound();

  finishRun(false,true);

 }

}


/* =========================================================
   発射判定
========================================================= */

function release(){

 if(state!=="aiming")
  return;


 const A=SWING_MAX_ANGLE;

 const w=
  2*Math.PI/SWING_PERIOD;


 const theta=
  A*Math.sin(w*swingT);

 const thetaSpeed=
  A*w*Math.cos(w*swingT);


 /*
   0〜1に変換

   sweet spot =
   thetaSpeed が最大付近
 */

 const timing=
  clamp(
   (thetaSpeed/(A*w)+1)/2,
   0,
   1
  );


 let judge;

 if(
  timing>=.44 &&
  timing<=.56
 ){

  judge="PERFECT";

 }else if(
  timing>=.30 &&
  timing<=.70
 ){

  judge="GOOD";

 }else{

  judge="MISS";

 }


 showJudge(judge);


 const variant=currentShoe();

 const pivotX=90;
 const pivotY=110;

 const seatX=
  pivotX+
  Math.sin(theta)*
  SWING_ROPE;

 const seatY=
  pivotY+
  Math.cos(theta)*
  SWING_ROPE;


 const g0=
  groundInfoAt(0);


 shoe.x=0;

 shoe.y=
  (g0?g0.y:260)-
  140;


 let base=
  thetaSpeed*
  SWING_ROPE*
  Math.cos(theta);


 let vertical=
  -thetaSpeed*
  SWING_ROPE*
  Math.sin(theta);


 let multiplier=
  variant.launchScale;


 if(judge==="PERFECT"){

  multiplier*=1.35;

  combo=1;

  flashMessage(
   "🔥 PERFECT発射！！"
  );

  playPerfectSound();

 }else if(judge==="GOOD"){

  multiplier*=1.05;

  combo=1;

  flashMessage(
   "👍 GOOD！"
  );

  playLaunchSound();

 }else{

  multiplier*=.55;

  combo=0;

  flashMessage(
   "💀 MISS！変な方向に飛んだ！"
  );

  playLaunchSound();

 }


 shoe.vx=
  base*
  3.6*
  multiplier;

 shoe.vy=
  vertical*
  3.6*
  multiplier;


 /* MISS時はランダムにズレる */

 if(judge==="MISS"){

  shoe.vx+=
   (Math.random()-.5)*160;

  shoe.vy+=
   (Math.random()-.5)*100;

 }


 shoe.rotation=0;

 shoe.rolling=false;

 shoe.overHole=false;

 shoe.bounceCount=0;

 shoe.heelBroken=
  variant.id==="heels" &&
  Math.random()<.10;

 shoe.heelBrokenTriggered=false;

 currentDistanceM=0;

 flightTime=0;

 settleTimer=0;

 state="flight";

}


/* =========================================================
   終了
========================================================= */

function finishRun(
 reachedEnd,
 holeFall
){

 if(state==="result")
  return;


 state="result";


 let dist=
  reachedEnd
   ? currentDistanceM*1.15
   : currentDistanceM;


 /*
   コンボボーナス
 */

 const comboBonus=
  combo*4;

 const coinBonus=
  coins*7;


 dist+=
  comboBonus+
  coinBonus;


 finalDistanceM=
  Math.round(dist*10)/10;


 const isRecord=
  finalDistanceM>stats.best;


 stats.plays++;


 if(isRecord)
  stats.best=finalDistanceM;


 stats.top.push(
  finalDistanceM
 );


 stats.top.sort(
  (a,b)=>b-a
 );


 stats.top=
  stats.top.slice(0,5);


 writeSave();


 showResult(
  reachedEnd,
  holeFall,
  isRecord
 );


 if(!holeFall)
  playFinishSound(
   reachedEnd
  );

}

========================================================= */

function spawnBurst(x,y,n){

 for(let i=0;i<n;i++){

  const a=
   Math.random()*
   Math.PI*2;

  const sp=
   60+
   Math.random()*160;

  particles.push({

   x,
   y,

   vx:
    Math.cos(a)*sp,

   vy:
    Math.sin(a)*sp-70,

   life:.5,

   maxLife:.5,

   r:
    2+
    Math.random()*3

  });

 }

}


function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=particles[i];

  p.x+=p.vx*dt;

  p.y+=p.vy*dt;

  p.vy+=500*dt;

  p.life-=dt;

  if(p.life<=0)
   particles.splice(i,1);

 }

}

   ((baseX%(W+200))+W+200)

  );

   20,

  );

   cx-20,
   cy+5,
   18,

   0,0,Math.PI*2
  );

function drawWind(camX){

 if(a<.15)
  return;

 ctx.lineWidth=2;

  windValue>0?1:-1;

function drawGround(camX){

 const g=course.ground;


 ctx.beginPath();

 ctx.moveTo(
  g[0].x-camX,
  g[0].y
 );


 for(let i=1;i<g.length;i++){

  );

 ctx.lineTo(
  g[g.length-1].x-camX,

 ctx.lineTo(
  g[0].x-camX,
  H
 );

 ctx.closePath();


 const grad=
  ctx.createLinearGradient(
   0,100,0,H
  );


 grad.addColorStop(
  0,
  "#8ed25e"
 );

 grad.addColorStop(
  .12,
  "#62a63d"
 );

 grad.addColorStop(
  .12,
  "#c98a4b"
 );

 grad.addColorStop(
  1,
  "#80532e"
 );


 ctx.fillStyle=grad;

 ctx.fill();


 ctx.strokeStyle="#4e913a";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(
  g[0].x-camX,
  g[0].y
 );

 for(let i=1;i<g.length;i++){

  ctx.lineTo(
   g[i].x-camX,
   g[i].y
  );

 }

 ctx.stroke();


 /* 穴 */

 for(const h of course.holes){

  const x1=
   h.start-camX;

  const x2=
   h.end-camX;


  ctx.fillStyle="#22150d";

  ctx.beginPath();

  ctx.moveTo(
   x1,
   h.yStart
  );

  ctx.lineTo(
   x1,
   H
  );

  ctx.lineTo(
   x2,
   H
  );

  ctx.lineTo(
   x2,
   h.yEnd
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.font="14px sans-serif";

  ctx.fillText(
   "🕳️",
   (x1+x2)/2,
   h.yStart+25
  );

 }


 /* ジャンプ台 */

 for(const r of course.ramps){

  const x=
   r.x-camX;


  ctx.fillStyle="#ff875f";

  ctx.beginPath();

  ctx.moveTo(
   x,
   r.y+55
  );

  ctx.lineTo(
   x+r.width,
   r.y+55
  );

  ctx.lineTo(
   x+r.width,
   r.y
  );

  ctx.closePath();

  ctx.fill();


  ctx.font="16px sans-serif";

  ctx.fillText(
   "🚀",
   x+r.width/2,
   r.y+15
  );

 }


 /* 風ゾーン */

 for(const z of course.windZones){

  const x1=
   z.start-camX;

  const x2=
   z.end-camX;


  if(
   x2<0 ||
   x1>W
  )
   continue;


  ctx.fillStyle=
   "rgba(255,255,255,.12)";

  ctx.fillRect(
   x1,
   70,
   x2-x1,
   170
  );


  ctx.fillStyle=
   "#ffffffaa";

  ctx.font="20px sans-serif";

  ctx.fillText(
   z.power>0?"💨➡️":"💨⬅️",
   (x1+x2)/2,
   90
  );

 }


 /* コイン */

 for(const c of course.coins){

  if(c.got)
   continue;


  const x=
   c.x-camX;


  if(
   x<-30 ||
   x>W+30
  )
   continue;


  ctx.font="20px sans-serif";

  ctx.fillText(
   "⭐",
   x,
   c.y
  );

 }

}

function drawSwing(){

 const pivotX=90;
 const pivotY=110;

 const A=SWING_MAX_ANGLE;

 const w=
  2*Math.PI/SWING_PERIOD;


 const theta=
  A*Math.sin(w*swingT);


 const thetaSpeed=
  A*w*Math.cos(w*swingT);


 const seatX=
  pivotX+
  Math.sin(theta)*
  SWING_ROPE;


 const seatY=
  pivotY+
  Math.cos(theta)*
  SWING_ROPE;


 ctx.strokeStyle="#876748";

 ctx.lineWidth=8;

 ctx.beginPath();

 ctx.moveTo(
  pivotX-46,
  H-2
 );

 ctx.lineTo(
  pivotX,
  pivotY-8
 );

 ctx.lineTo(
  pivotX+46,
  H-2
 );

 ctx.stroke();


 ctx.strokeStyle=
  thetaSpeed>0
   ?" #ffce54"
   :"#c9b8a0";


 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(
  pivotX,
  pivotY
 );

 ctx.lineTo(
  seatX,
  seatY
 );

 ctx.stroke();


 /* PERFECTゾーン */

 if(
  thetaSpeed>
  A*w*.7
 ){

  ctx.fillStyle="#ffce5444";

  ctx.beginPath();

  ctx.arc(
   seatX,
   seatY,
   30,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 ctx.font="30px sans-serif";

 ctx.fillText(
  "🧒",
  seatX,
  seatY-6
 );


 ctx.font="18px sans-serif";

 ctx.fillText(
  currentShoe().emoji,
  seatX+10,
  seatY+16
 );


 ctx.fillStyle="#876748";

 ctx.fillRect(
  seatX-14,
  seatY+2,
  28,
  6
 );

}

/* =========================================================
   音
========================================================= */

function getAudio(){

 if(!audio){

  audio=
   new(
    window.AudioContext||
    window.webkitAudioContext
   )();

 }

 if(audio.state==="suspended")
  audio.resume();

 return audio;

}


function tone(
 start,
 end,
 duration,
 type="sine",
 volume=.2
){

 const a=getAudio();

 const osc=
  a.createOscillator();

 const gain=
  a.createGain();


 osc.type=type;

 osc.frequency.setValueAtTime(
  start,
  a.currentTime
 );


 osc.frequency.exponentialRampToValueAtTime(
  Math.max(30,end),
  a.currentTime+duration
 );


 gain.gain.setValueAtTime(
  volume,
  a.currentTime
 );


 gain.gain.exponentialRampToValueAtTime(
  .001,
  a.currentTime+duration
 );


 osc.connect(gain);

 gain.connect(a.destination);

 osc.start();

 osc.stop(
  a.currentTime+duration
 );

}

/* =========================================================
   メインループ
========================================================= */

function update(dt){

 windAnimT+=dt;


 if(state==="aiming"){

  swingT+=dt;


  /*
   タイミングゲージ
  */

  const A=SWING_MAX_ANGLE;

  const w=
   2*Math.PI/SWING_PERIOD;


  const speed=
   A*w*Math.cos(w*swingT);


  const normalized=
   clamp(
    (speed/(A*w)+1)/2,
    0,
    1
   );


  document.getElementById(
   "timingCursor"
  ).style.left=
   (normalized*100)+"%";


 }else if(state==="flight"){

  flightTime+=dt;

  physicsStep(dt);


  if(
   state==="flight"
  ){

   cameraX=
    Math.max(
     0,
     shoe.x-W*.34
    );

  }


  if(
   flightTime>MAX_FLIGHT_TIME
  ){

   finishRun(
    false,
    false
   );

  }

 }


 updateParticles(dt);

}


function frame(ts){

 if(!lastTime)
  lastTime=ts;
