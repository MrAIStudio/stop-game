<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>イライラすとっぷ - 完全版 PLUS</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}

body{
margin:0;
min-height:100vh;
background:linear-gradient(160deg, #ffe6f0 0%, #ffeef7 22%, #ece6ff 55%, #e3f8ef 100%);
color:#6b5b8a;
font-family:"Hiragino Maru Gothic ProN","Yu Gothic","M PLUS Rounded 1c","Hiragino Sans",sans-serif;
text-align:center;
overflow-x:hidden;
position:relative;
}

/* 背景のふわふわバブル */
#stars{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
overflow:hidden;
}
.starDot{
position:absolute;
background:radial-gradient(circle at 35% 30%, #ffffffcc, #ffd6e6aa 60%, transparent 75%);
border-radius:50%;
opacity:0.7;
animation:floaty 6s infinite ease-in-out;
}
@keyframes floaty{
0%,100%{transform:translateY(0px);opacity:0.35;}
50%{transform:translateY(-18px);opacity:0.85;}
}

.wrap{
position:relative;
z-index:1;
max-width:480px;
margin:0 auto;
padding:20px 14px 40px;
}

.shake{ animation:shake 0.3s; }
@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(8px,0);}
50%{transform:translate(-8px,0);}
75%{transform:translate(8px,0);}
100%{transform:translate(0,0);}
}

.flash{ animation:flash 0.3s; }
@keyframes flash{
0%{box-shadow:inset 0 0 120px 40px #ff9e9e80;}
100%{box-shadow:inset 0 0 0 0 transparent;}
}

.hitflash{ animation:hitflash 0.3s; }
@keyframes hitflash{
0%{box-shadow:inset 0 0 120px 40px #b8f2d980;}
100%{box-shadow:inset 0 0 0 0 transparent;}
}

h1{
font-size:34px;
margin:10px 0 4px;
letter-spacing:1px;
color:#7a5fa8;
text-shadow:0 0 16px #ffc4de;
}

.sub{
font-size:15px;
line-height:1.8;
color:#8a7aa8;
}

.badge{
display:inline-block;
background:linear-gradient(135deg,#ffb6c9,#c9b8ff);
color:#6b4a72;
padding:4px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
box-shadow:0 4px 14px #d9c9ff90;
}

button{
font-family:inherit;
font-size:24px;
padding:14px 46px;
border-radius:50px;
border:none;
cursor:pointer;
font-weight:bold;
}

#startBtn{
margin-top:18px;
background:linear-gradient(135deg,#ffb6c9,#a8c8ff);
color:#5b4a72;
box-shadow:0 8px 20px #c9b8ff70;
}

.tapHint{
font-size:13px;
color:#a898c8;
margin:6px 0 2px;
font-weight:bold;
}

.field{ cursor:pointer; }
.field:active{ filter:brightness(0.97); }

#game{ display:none; }

.hud{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
color:#9a8ab8;
margin-bottom:8px;
padding:0 4px;
}
.hud .val{
font-size:20px;
color:#6b5b8a;
font-weight:bold;
}

.combo{
font-size:13px;
color:#ff9ec4;
min-height:18px;
font-weight:bold;
text-shadow:0 0 8px #ffc4de80;
}

.field{
width:100%;
height:340px;
margin:8px auto;
background:linear-gradient(180deg,#eef4ff 0%, #f3ecff 45%, #ffeef5 78%, #fff6ec 100%);
border:3px solid #d9c9ff;
border-radius:24px;
position:relative;
overflow:hidden;
box-shadow:0 0 24px #d9c9ff60, inset 0 0 40px #ffffffa0;
}

.horizon{
position:absolute;
left:0;
right:0;
top:78%;
height:2px;
background:linear-gradient(90deg,transparent,#ffb6c9a0,transparent);
pointer-events:none;
}
.horizon-glow{
position:absolute;
left:0;
right:0;
top:78%;
height:60px;
background:linear-gradient(180deg,#ffe0ec55,transparent);
pointer-events:none;
}

.crosshair{
position:absolute;
left:50%;
top:0;
height:78%;
width:1px;
background:repeating-linear-gradient(180deg,#c9b8ff40 0 6px,transparent 6px 12px);
transform:translateX(-50%);
pointer-events:none;
}
.target-zone{
position:absolute;
left:50%;
top:0;
height:78%;
width:36px;
transform:translateX(-50%);
background:#ffd9ec30;
border-left:1px dashed #ffb6c980;
border-right:1px dashed #ffb6c980;
pointer-events:none;
}

.ufo{
position:absolute;
top:38px;
font-size:34px;
left:0;
transition:0.05s;
filter:drop-shadow(0 0 8px #c9b8ff);
z-index:3;
}

/* 発射口（銃口）*/
.turret-mount{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:64px;
height:46px;
pointer-events:none;
z-index:4;
}
.turret-base{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:54px;
height:16px;
background:linear-gradient(180deg,#ffd9ec,#ffb6c9);
border-radius:10px 10px 6px 6px;
border:1px solid #ff9eb670;
}
.turret-barrel{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
width:14px;
height:34px;
background:linear-gradient(180deg,#c9b8ff,#a8c8ff);
border-radius:8px 8px 4px 4px;
border:1px solid #ffffff80;
box-shadow:0 0 10px #c9b8ff90;
}
.turret-muzzle{
position:absolute;
bottom:44px;
left:50%;
transform:translateX(-50%);
width:20px;
height:8px;
background:#ffe0a3;
border-radius:4px;
box-shadow:0 0 10px #ffe0a3;
}
.muzzleFlash{
animation:muzzleFlash 0.15s ease-out;
}
@keyframes muzzleFlash{
0%{box-shadow:0 0 26px 10px #fff3c490; background:#fffbe6;}
100%{box-shadow:0 0 8px #ffe0a3; background:#ffe0a3;}
}

.bubble{
position:absolute;
top:2px;
background:#fffdfb;
color:#6b5b8a;
padding:5px 10px;
border-radius:16px;
font-size:13px;
white-space:nowrap;
font-weight:bold;
opacity:0;
transform:translateY(4px) scale(0.9);
transition:opacity 0.25s, transform 0.25s;
pointer-events:none;
z-index:5;
box-shadow:0 4px 12px #d9c9ff60;
border:1.5px solid #ffd9ec;
}
.bubble.show{
opacity:1;
transform:translateY(0) scale(1);
}

.bullet{
position:absolute;
bottom:50px;
font-size:20px;
display:none;
filter:drop-shadow(0 0 10px #ffe0a3);
z-index:3;
}

.ufo.jiggle{
animation:ufoJiggle 0.35s ease;
}
@keyframes ufoJiggle{
0%{transform:scale(1,1) rotate(0deg);}
20%{transform:scale(1.28,0.72) rotate(-7deg);}
40%{transform:scale(0.82,1.22) rotate(6deg);}
60%{transform:scale(1.18,0.85) rotate(-4deg);}
80%{transform:scale(0.94,1.06) rotate(2deg);}
100%{transform:scale(1,1) rotate(0deg);}
}

.bar-label{
display:flex;
justify-content:space-between;
font-size:12px;
color:#9a8ab8;
margin:14px 0 4px;
}

.bar{
width:100%;
height:22px;
background:#f3ecff;
border-radius:20px;
overflow:hidden;
border:1px solid #d9c9ff80;
}

#stress{
height:100%;
width:0%;
background:linear-gradient(90deg,#ffe0a3,#ff9eb5);
transition:0.25s;
}

#hpBarFill{
height:100%;
width:100%;
background:linear-gradient(90deg,#b8f2d9,#a8c8ff);
transition:0.25s;
}

.ufo.enraged{
animation:enrageZoom 2s ease-in-out;
filter:drop-shadow(0 0 26px #ff8a80) !important;
z-index:6;
}
@keyframes enrageZoom{
0%{transform:scale(1);}
12%{transform:scale(2.6) rotate(-4deg);}
25%{transform:scale(2.35) rotate(4deg);}
40%{transform:scale(2.55) rotate(-3deg);}
60%{transform:scale(2.5) rotate(3deg);}
85%{transform:scale(2.2);}
100%{transform:scale(1);}
}

.enrageFlash{
position:absolute;
left:50%;
top:42%;
transform:translate(-50%,-50%);
font-size:24px;
font-weight:900;
color:#ff6f8a;
text-shadow:0 0 14px #ffc4de;
z-index:8;
animation:enrageTextPulse 2s ease-in-out forwards;
pointer-events:none;
white-space:nowrap;
}
@keyframes enrageTextPulse{
0%{opacity:0; transform:translate(-50%,-50%) scale(0.5);}
12%{opacity:1; transform:translate(-50%,-50%) scale(1.25);}
25%{transform:translate(-50%,-50%) scale(1);}
82%{opacity:1;}
100%{opacity:0; transform:translate(-50%,-50%) scale(1);}
}

#message{
font-size:19px;
min-height:30px;
margin:10px 0;
font-weight:bold;
color:#7a5fa8;
}

.banFlash{
position:fixed;
top:38%;
left:50%;
transform:translate(-50%,-50%);
font-size:64px;
color:#ff8fab;
font-weight:900;
text-shadow:0 0 20px #ffd6e6;
animation:banAnim 0.25s forwards;
pointer-events:none;
z-index:10;
}
@keyframes banAnim{
0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
100%{opacity:0; transform:translate(-50%,-50%) scale(1.8);}
}

.explode{
position:absolute;
font-size:38px;
animation:boom 0.6s forwards;
pointer-events:none;
}
@keyframes boom{
0%{opacity:1; transform:scale(1);}
100%{opacity:0; transform:scale(3);}
}

.star{
position:absolute;
color:#ffcf8a;
font-size:18px;
animation:starFly 0.8s forwards;
pointer-events:none;
}
@keyframes starFly{
0%{opacity:1; transform:translate(0,0);}
100%{opacity:0; transform:translate(80px,-80px);}
}

.popScore{
position:absolute;
font-weight:bold;
font-size:18px;
color:#7fd9b6;
animation:popUp 0.7s forwards;
pointer-events:none;
text-shadow:0 0 8px #b8f2d9;
}
@keyframes popUp{
0%{opacity:1; transform:translateY(0);}
100%{opacity:0; transform:translateY(-40px);}
}

.rankRow{
display:flex;
justify-content:space-between;
padding:6px 16px;
font-size:15px;
color:#6b5b8a;
border-bottom:1px solid #d9c9ff50;
}
.rankBox{
background:#fffdfb;
border:1px solid #d9c9ff80;
border-radius:16px;
padding:6px 0;
margin-top:8px;
box-shadow:0 4px 14px #d9c9ff40;
}

.retryBtn{
margin-top:14px;
background:linear-gradient(135deg,#b8f2d9,#a8e6cf);
color:#2f6b52;
box-shadow:0 8px 20px #b8f2d980;
}

.title-tag{
font-size:16px;
color:#e0a35c;
font-weight:bold;
margin-top:4px;
}

.powerup{
position:absolute;
top:44px;
font-size:26px;
display:none;
filter:drop-shadow(0 0 10px #b8f2d9);
}

</style>

</head>

<body>

<div id="stars"></div>

<div class="wrap">

<div id="title">

<div class="badge">STRESS RELEASE SHOOTER</div>
<h1>😡 イライラすとっぷ</h1>

<div class="sub">
🛸 煽るUFOを予測してタップで撃て！<br>
ストレス10で即ゲームオーバー<br>
連続HITでコンボボーナス発生！<br><br>
狙った場所をタップして未来を読め！
</div>

<button id="startBtn" onclick="startGame()">START</button>

<div class="rankBox">
<h2 style="margin:10px 0 4px;font-size:18px;">🏆 TOP5</h2>
<div id="ranking"></div>
</div>

</div>



<div id="game">

<div class="hud">
<div>SCORE<br><span class="val" id="score">0</span></div>
<div>COMBO<br><span class="val" id="comboVal">0</span></div>
<div>LV<br><span class="val" id="levelVal">1</span></div>
<div><button id="muteBtn" onclick="toggleMute()" style="font-size:18px;padding:4px 10px;background:#f3ecff;color:#7a5fa8;box-shadow:none;">🔊</button></div>
</div>

<div class="combo" id="comboMsg"></div>

<div class="bar-label"><span>👾 敵の体力</span><span id="hpNum">4/4</span></div>
<div class="bar"><div id="hpBarFill"></div></div>

<div class="field" id="fieldEl" onclick="fireAt(event.clientX)">
<div class="horizon-glow"></div>
<div class="horizon"></div>
<div class="target-zone"></div>
<div class="crosshair"></div>

<div id="bubble" class="bubble"></div>
<div id="ufo" class="ufo">🛸</div>
<div id="powerup" class="powerup">⭐</div>
<div id="bullet" class="bullet">🥚</div>

<div class="turret-mount">
<div class="turret-barrel" id="turretBarrel"></div>
<div class="turret-muzzle" id="turretMuzzle"></div>
<div class="turret-base"></div>
</div>

</div>

<div class="tapHint">画面をタップして発射！</div>

<div class="bar-label"><span>ストレス</span><span id="stressNum">0</span>/10</div>
<div class="bar"><div id="stress"></div></div>

<div id="message"></div>

</div>

</div>

<script>

/* ---------- 背景の星生成 ---------- */
(function makeStars(){
let field = document.getElementById("stars");
for(let i=0;i<60;i++){
let s = document.createElement("div");
s.className = "starDot";
let size = Math.random()*2+1;
s.style.width = size+"px";
s.style.height = size+"px";
s.style.left = Math.random()*100+"%";
s.style.top = Math.random()*100+"%";
s.style.animationDelay = (Math.random()*3)+"s";
field.appendChild(s);
}
})();

let ufo, bubble, bullet, powerupEl, field;
let x=0, dir=1, speed=4;
let timer;
let score=0;
let stress=0;
let audio;

let firing = false;

let ufoType = "normal";
let zigzagOffset = 0;
let lastTeleport = 0;
let baitWasFleeing = false;
let shotX = 0;

let combo = 0;
let maxCombo = 0;
let level = 1; // ステージ
let elapsedHits = 0;

let enemyHP = 4;
let enemyMaxHP = 4;
let totalKills = 0;
let totalHits = 0;
let enraged = false;
let specialMoveActive = false;
let respawnPending = false;

let powerupActive = false;
let slowMoActive = false;
let powerupX = 0;
let powerupTimer = null;

const titles = [
  {min:0, text:""},
  {min:5, text:"見習いハンター"},
  {min:12, text:"UFO駆除人"},
  {min:20, text:"未来予知の使い手"},
  {min:30, text:"銀河のBAN王"},
  {min:45, text:"伝説のクレーマー撃退者"}
];

let comments=[
"こっちだよ〜😏","今押すと思った？🤣","残念、逆でした〜","読めるかな？笑",
"未来予測してみな？","あと0.2秒だったね","焦ってる？😏","読みが浅いね〜",
"もっと集中しなよ？","今のは惜しい！","揺さぶられてるね〜","反応遅いよ？笑",
"まだまだだね😈","予測できてる？","迷ってるの見えてるよ？","今のは罠だよ〜",
"ふふふ😏","読めないでしょ？","揺らしていくよ〜","そのタイミングじゃないよ",
"逆だって言ったよね？","もっと早く！","もっと遅く！","揺れるよ〜？",
"惑わされてるね〜","今のはフェイント！","見抜けるかな？","まだ本気じゃないよ？",
"そろそろ本気出す？😈"
];

const comboComments = [
"止まらない！","絶好調！","ノリノリだね！","その調子！","無双状態！"
];

/* ---------- 吹き出し：たまに呟く演出 ---------- */
let bubbleShowTimer = null;
let bubbleHideTimer = null;

function showTaunt(text){
if(!bubble) return;
clearTimeout(bubbleHideTimer);
bubble.innerHTML = text;
bubble.classList.add("show");
bubbleHideTimer = setTimeout(()=>{
bubble.classList.remove("show");
}, 1700);
}

function scheduleTaunt(){
let delay = 4500 + Math.random()*4500; // 4.5〜9秒に一度だけポロッと呟く
bubbleShowTimer = setTimeout(()=>{
if(document.getElementById("game").style.display==="block"){
showTaunt(comments[Math.floor(Math.random()*comments.length)]);
}
scheduleTaunt();
}, delay);
}

function stopTaunts(){
clearTimeout(bubbleShowTimer);
clearTimeout(bubbleHideTimer);
if(bubble) bubble.classList.remove("show");
}

let muted = false;

function getAudio(){
    if(!audio){
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audio.state === "suspended"){
        audio.resume();
    }
    return audio;
}

function banSound(freqLow=80, freqHigh=900){
    if(muted) return;
    audio = getAudio();

    let osc1 = audio.createOscillator();
    let gain1 = audio.createGain();
    osc1.frequency.value = freqLow;
    gain1.gain.setValueAtTime(0.6, audio.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);

    let osc2 = audio.createOscillator();
    let gain2 = audio.createGain();
    osc2.frequency.value = freqHigh;
    gain2.gain.setValueAtTime(0.3, audio.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);

    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(audio.destination);
    gain2.connect(audio.destination);

    osc1.start();
    osc2.start();
    osc1.stop(audio.currentTime + 0.25);
    osc2.stop(audio.currentTime + 0.15);
}

function hitSound(){
    if(muted) return;
    audio = getAudio();
    [880, 1320].forEach((f,i)=>{
        let osc = audio.createOscillator();
        let gain = audio.createGain();
        osc.frequency.value = f;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.001, audio.currentTime + i*0.06);
        gain.gain.linearRampToValueAtTime(0.25, audio.currentTime + i*0.06 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + i*0.06 + 0.18);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(audio.currentTime + i*0.06);
        osc.stop(audio.currentTime + i*0.06 + 0.2);
    });
}

function missSound(){
    if(muted) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audio.currentTime + 0.25);
    gain.gain.setValueAtTime(0.25, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.25);
}

function angrySound(){
    if(muted) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(160, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, audio.currentTime + 0.6);
    gain.gain.setValueAtTime(0.35, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.6);
}

function toggleMute(){
    muted = !muted;
    document.getElementById("muteBtn").innerHTML = muted ? "🔇" : "🔊";
}

function chimeSound(){
    if(muted) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.frequency.value = 1300;
    gain.gain.setValueAtTime(0.25, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.2);
}

/* ---------- 軽快なBGMループ ---------- */
let bgmTimer = null;
let bgmStep = 0;
const bgmPattern = [523.25,0,659.25,0,783.99,659.25,0,880.00, 783.99,0,659.25,0,523.25,0,0,0];

function playBgmNote(freq){
    if(muted || !freq) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, audio.currentTime);
    gain.gain.linearRampToValueAtTime(0.09, audio.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.22);
}

function startBGM(){
    stopBGM();
    bgmStep = 0;
    bgmTimer = setInterval(()=>{
        playBgmNote(bgmPattern[bgmStep % bgmPattern.length]);
        bgmStep++;
    }, 180);
}

function stopBGM(){
    if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; }
}

function startGame(){
document.getElementById("title").style.display="none";
document.getElementById("game").style.display="block";
ufo=document.getElementById("ufo");
bubble=document.getElementById("bubble");
bullet=document.getElementById("bullet");
powerupEl=document.getElementById("powerup");
field=document.querySelector(".field");
banSound();
spawnPowerupCycle();
startBGM();
scheduleTaunt();
move();
}

function chooseUFO(){
let r=Math.random();
let bossChance = level>=3 ? 0.06 : 0;
let c = bossChance;
if(r<c){ ufoType="boss"; showTaunt("ボス出現！！(x5)👹"); return; }
c += 0.05;
if(r<c){ ufoType="rare"; showTaunt("レア個体だよ😎 (x3)"); return; }
c += 0.14;
if(r<c){ ufoType="fast"; return; }
c += 0.14;
if(r<c){ ufoType="zigzag"; return; }
c += 0.14;
if(r<c){ ufoType="teleport"; showTaunt("つかまえてみ？📍"); return; }
c += 0.14;
if(r<c){ ufoType="bait"; showTaunt("いつでも逃げれるし😏"); return; }
c += 0.14;
if(r<c){ ufoType="jitter"; return; }
ufoType="normal";
}

function currentLevelMultiplier(){
return 1 + (level-1)*0.35;
}

/* ---------- 敵HP・ステージシステム ---------- */
function baseHPForStage(lv){
return 4 + (lv-1)*2; // ステージ1=HP4、以降+2ずつ
}

function enemySpriteForStage(lv){
if(lv<=1) return "🛸";
if(lv===2) return "👽";
return "🦍";
}

function newEnemy(){
clearInterval(gagTimer);
specialMoveActive = false;
chooseUFO();
enemyMaxHP = baseHPForStage(level);
if(ufoType==="boss") enemyMaxHP = Math.round(enemyMaxHP*1.8);
enemyHP = enemyMaxHP;
updateHPBar();
ufo.innerHTML = enemySpriteForStage(level);
}

function updateHPBar(){
let pct = Math.max(0,(enemyHP/enemyMaxHP)*100);
document.getElementById("hpBarFill").style.width = pct+"%";
document.getElementById("hpNum").innerHTML = Math.max(0,enemyHP)+"/"+enemyMaxHP;
}

function triggerEnrage(){
enraged = true;
ufo.classList.add("enraged");
angrySound();
navigator.vibrate?.([100,60,100,60,220]);

let fx=document.createElement("div");
fx.className="enrageFlash";
fx.innerHTML="😡 怒ったぞー！！";
field.appendChild(fx);
setTimeout(()=>fx.remove(),2000);

setTimeout(()=>{
ufo.classList.remove("enraged");
enraged = false;
},2000);
}

function stageUp(){
let newLevel = 1 + Math.floor(totalKills/3);
if(newLevel !== level){
level = newLevel;
document.getElementById("levelVal").innerHTML = level;
document.getElementById("message").innerHTML = "🔺 ステージアップ！ Stage "+level;
}
}

function move(){
newEnemy();
timer=setInterval(()=>{

let mult = currentLevelMultiplier() * (slowMoActive ? 0.45 : 1);

if(ufoType==="fast") speed=10*mult;
if(ufoType==="normal") speed=(4+Math.random()*3)*mult;
if(ufoType==="boss") speed=2.5*mult;
if(ufoType==="rare") speed=6*mult;
if(ufoType==="zigzag"){
speed=5*mult;
zigzagOffset = Math.sin(Date.now()/80)*22;
ufo.style.top = (38 + zigzagOffset)+"px";
}
if(ufoType==="jitter"){
speed=7*mult;
if(Math.random()<0.06){ dir = -dir; }
}
if(ufoType==="bait"){
let fleeing = (bullet.style.display==="block");
if(fleeing && !baitWasFleeing){
let center = field.clientWidth/2;
dir = ((x+17) < center) ? -1 : 1;
}
baitWasFleeing = fleeing;
speed = (fleeing ? 15 : 3)*mult;
}
if(ufoType==="teleport"){
speed = 2*mult;
let now = Date.now();
if(now - lastTeleport > 700 + Math.random()*500){
lastTeleport = now;
let maxWT = field ? field.clientWidth-50 : window.innerWidth*0.75;
x = Math.random()*maxWT;
ufo.style.left = x+"px";
bubble.style.left=(x-20)+"px";
navigator.vibrate?.(25);
if(Math.random()<0.35) showTaunt("ここだよ〜😝");
}
}

x += speed * dir;

let maxW = field ? field.clientWidth-50 : window.innerWidth*0.75;
if(x > maxW){ dir=-1; }
if(x < 0){ dir=1; }

if(!enraged){
if(ufoType==="rare"){
ufo.style.filter="drop-shadow(0 0 20px #ffe0a3)";
ufo.style.fontSize="40px";
}else if(ufoType==="boss"){
ufo.style.filter="drop-shadow(0 0 22px #ff8fab)";
ufo.style.fontSize="70px";
}else{
ufo.style.filter="drop-shadow(0 0 8px #c9b8ff)";
ufo.style.fontSize="34px";
}
}

if(Math.random()<0.0012) phantom();
if(Math.random()<0.0015) wiggle();

ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";

},20);
}

let gagTimer = null;

function phantom(){
if(specialMoveActive) return;
specialMoveActive = true;
showTaunt("今まで本気だったと思った？😈");
speed=18;
let count=0;
gagTimer=setInterval(()=>{
x += speed * dir;
ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";
count++;
if(count>20){
clearInterval(gagTimer);
speed=4+Math.random()*3;
specialMoveActive = false;
}
},20);
}

function wiggle(){
if(specialMoveActive) return;
specialMoveActive = true;
showTaunt("ぷるぷるぷる〜😆");
let originX = x;
let count = 0;
gagTimer=setInterval(()=>{
x = originX + (count%2===0 ? 16 : -16);
ufo.style.left = x+"px";
bubble.style.left=(x-20)+"px";
count++;
if(count>18){
clearInterval(gagTimer);
x = originX;
ufo.style.left = x+"px";
specialMoveActive = false;
}
},22);
}

function desperateDodge(){
specialMoveActive = true;
showTaunt("こんなん誰が当てれんねん😆💦");
navigator.vibrate?.([30,30,30,30,30,30]);
let originX = x;
let count = 0;
gagTimer=setInterval(()=>{
x = originX + (count%2===0 ? 24 : -24);
ufo.style.left = x+"px";
bubble.style.left=(x-20)+"px";
count++;
if(count>32){
clearInterval(gagTimer);
x = originX;
ufo.style.left = x+"px";
specialMoveActive = false;
}
},18);
}

/* ---------- パワーアップ（スター）システム ---------- */
function spawnPowerupCycle(){
powerupTimer = setInterval(()=>{
if(!powerupActive && document.getElementById("game").style.display==="block"){
showPowerup();
}
}, 9000 + Math.random()*4000);
}

function showPowerup(){
powerupActive = true;
let maxW = field.clientWidth-40;
powerupX = Math.random()*maxW;
powerupEl.style.left = powerupX+"px";
powerupEl.style.display = "block";

setTimeout(()=>{
if(powerupActive){
powerupActive = false;
powerupEl.style.display = "none";
}
}, 3500);
}

function tryGrabPowerup(){
if(!powerupActive) return false;
let dist = Math.abs((x+17) - (powerupX+15));
if(dist < 55){
powerupActive = false;
powerupEl.style.display = "none";
activateSlowMo();
chimeSound();
return true;
}
return false;
}

function activateSlowMo(){
slowMoActive = true;
document.getElementById("message").innerHTML = "⭐ スローモーション発動！";
setTimeout(()=>{ slowMoActive = false; }, 4000);
}

function fireAt(clientX){

if(firing || respawnPending) return;
firing = true;

let rect = field.getBoundingClientRect();
let tapX = clientX - rect.left;
tapX = Math.max(15, Math.min(field.clientWidth-15, tapX));
shotX = tapX;

document.querySelector(".turret-mount").style.left = tapX+"px";

// パワーアップ取得判定（撃つ瞬間の位置で判定）
tryGrabPowerup();

banSound();

let fx = document.createElement("div");
fx.className = "banFlash";
fx.innerHTML = "BAN!!";
document.body.appendChild(fx);
setTimeout(()=>fx.remove(),250);

let muzzle = document.getElementById("turretMuzzle");
muzzle.classList.add("muzzleFlash");
setTimeout(()=>muzzle.classList.remove("muzzleFlash"),150);

bullet.style.display = "block";
bullet.style.left = tapX+"px";
bullet.style.bottom = "50px";

slowBullet();
}

function slowBullet(){

let pos = 50;
let impactY = 282;
let speedB = 3;
let phase = "approach";

let bulletTimer = setInterval(()=>{

if(phase === "approach"){

pos += speedB;
bullet.style.bottom = pos + "px";

if(pos >= impactY){
let distance = Math.abs((x+17)-shotX);

if(distance < 18){
// 命中：その場で止まってUFOがぶるるん！
clearInterval(bulletTimer);
bullet.style.display = "none";
bullet.style.opacity = 1;
jiggleUFO();
judge();
}else{
// 外れ：奥（画面上部）まで貫通していく
phase = "through";
}
}

}else{

pos += speedB * 1.6;
bullet.style.bottom = pos + "px";
bullet.style.opacity = Math.max(0, 1 - (pos-impactY)/70);

if(pos >= 335){
clearInterval(bulletTimer);
bullet.style.display = "none";
bullet.style.opacity = 1;
judge();
}

}

}, 16);
}

function jiggleUFO(){
ufo.classList.remove("jiggle");
void ufo.offsetWidth;
ufo.classList.add("jiggle");
setTimeout(()=>ufo.classList.remove("jiggle"),350);
}

function explodeEffect(){
let boom=document.createElement("div");
boom.className="explode";
boom.innerHTML="💫";
boom.style.left=(x)+"px";
boom.style.top="38px";
field.appendChild(boom);
setTimeout(()=>boom.remove(),600);

for(let i=0;i<5;i++){
let star=document.createElement("div");
star.className="star";
star.innerHTML="🌸";
star.style.left=(x)+"px";
star.style.top="38px";
field.appendChild(star);
setTimeout(()=>star.remove(),800);
}
}

function popScoreText(text){
let p = document.createElement("div");
p.className = "popScore";
p.innerHTML = text;
p.style.left = x+"px";
p.style.top = "18px";
field.appendChild(p);
setTimeout(()=>p.remove(),700);
}

function currentTitle(){
let t = "";
for(const item of titles){
if(maxCombo >= item.min) t = item.text;
}
return t;
}

function hitSpark(){
let star=document.createElement("div");
star.className="star";
star.innerHTML="✨";
star.style.left=(x)+"px";
star.style.top="38px";
field.appendChild(star);
setTimeout(()=>star.remove(),500);
}

function judge(){

let distance=Math.abs((x+17)-shotX);

if(distance < 18){

let base = 1;
if(ufoType==="rare") base = 3;
if(ufoType==="boss") base = 5;

combo++;
if(combo > maxCombo) maxCombo = combo;
totalHits++;

let comboBonus = combo>=10 ? 3 : combo>=5 ? 2 : 1;
let gained = base * comboBonus;
score += gained;

stress -= (ufoType==="boss" ? 2 : 1);
if(stress < 0) stress = 0;

hitSound();
popScoreText("+"+gained + (comboBonus>1 ? " COMBO×"+comboBonus : ""));
navigator.vibrate?.(100);

document.querySelector(".field").classList.add("hitflash");
setTimeout(()=>document.querySelector(".field").classList.remove("hitflash"),300);

document.getElementById("comboVal").innerHTML = combo;
if(combo>0 && combo%5===0){
document.getElementById("comboMsg").innerHTML = combo+"連続！ "+comboComments[Math.floor(Math.random()*comboComments.length)];
}

// 敵のHPを削る
enemyHP -= 1;
updateHPBar();

if(enemyHP <= 0){
totalKills++;
explodeEffect();
document.getElementById("message").innerHTML="💥 撃破！";
stageUp();
ufo.style.opacity = "0";
respawnPending = true;
setTimeout(()=>{
newEnemy();
ufo.style.opacity = "1";
respawnPending = false;
firing = false;
}, 450);
}else{
hitSpark();
document.getElementById("message").innerHTML="🎯 HIT！";
if(enemyHP === 1){
desperateDodge();
}
}

// 5発ごとに敵が怒って巨大化するびっくり演出
if(totalHits % 5 === 0 && !enraged){
triggerEnrage();
}

}else{

combo = 0;
document.getElementById("comboVal").innerHTML = combo;
document.getElementById("comboMsg").innerHTML = "";

stress += 1;

missSound();

document.body.classList.add("flash");
setTimeout(()=>document.body.classList.remove("flash"),300);

document.getElementById("message").innerHTML="😈 MISS！";
}

if(stress >= 10){
stress = 10;
document.getElementById("stress").style.width = "100%";
document.getElementById("stressNum").innerHTML = 10;
document.getElementById("message").innerHTML = "💀ストレス限界突破…GAME OVER";

navigator.vibrate?.([200,100,200]);

clearInterval(timer);
clearInterval(powerupTimer);
stopBGM();
stopTaunts();
setTimeout(()=>{ showRetry(); },1200);

return;
}

document.getElementById("score").innerHTML=score;
document.getElementById("stress").style.width=(stress*10)+"%";
document.getElementById("stressNum").innerHTML = stress;

saveScore();

if(!respawnPending){
firing = false;
}

setTimeout(()=>{
document.getElementById("message").innerHTML="";
},900);
}

function showRetry(){
let box = document.getElementById("message");

let title = currentTitle();
if(title){
let tEl = document.createElement("div");
tEl.className = "title-tag";
tEl.innerHTML = "🏅 称号：「"+title+"」獲得！（最大コンボ "+maxCombo+"）";
box.appendChild(tEl);
}

let btn = document.createElement("button");
btn.className = "retryBtn";
btn.innerHTML = "RETRY";
btn.onclick = ()=>location.reload();
box.appendChild(btn);
}

let rankData = [];

function saveScore(){
rankData.push(score);
rankData.sort((a,b)=>b-a);
rankData = rankData.slice(0,5);
showRank();
}

function showRank(){
let data = rankData;
let html="";
data.forEach((v,i)=>{
let medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1)+"位";
html += "<div class='rankRow'><span>"+medal+"</span><span>"+v+"点</span></div>";
});
document.getElementById("ranking").innerHTML=html || "<div class='rankRow'><span>まだ記録なし</span></div>";
}

showRank();

</script>

</body>
</html>
