<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>イライラすとっぷ - 完全版 PLUS</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}

body{
margin:0;
min-height:100vh;
background:radial-gradient(ellipse at 50% 0%, #1a1030 0%, #0a0714 55%, #050409 100%);
color:white;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
text-align:center;
overflow-x:hidden;
position:relative;
}

/* 背景の星 */
#stars{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
overflow:hidden;
}
.starDot{
position:absolute;
background:white;
border-radius:50%;
opacity:0.6;
animation:twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{
0%,100%{opacity:0.15;}
50%{opacity:0.9;}
}

.wrap{
position:relative;
z-index:1;
max-width:480px;
margin:0 auto;
padding:20px 14px 40px;
}

.shake{ animation:shake 0.3s; }
@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(10px,0);}
50%{transform:translate(-10px,0);}
75%{transform:translate(10px,0);}
100%{transform:translate(0,0);}
}

.flash{ animation:flash 0.3s; }
@keyframes flash{
0%{box-shadow:inset 0 0 120px 40px #ff2a2a80;}
100%{box-shadow:inset 0 0 0 0 transparent;}
}

.hitflash{ animation:hitflash 0.3s; }
@keyframes hitflash{
0%{box-shadow:inset 0 0 120px 40px #2cff9d80;}
100%{box-shadow:inset 0 0 0 0 transparent;}
}

h1{
font-size:34px;
margin:10px 0 4px;
letter-spacing:1px;
text-shadow:0 0 20px #a855f7;
}

.sub{
font-size:15px;
line-height:1.8;
color:#c9c3e0;
}

.badge{
display:inline-block;
background:linear-gradient(135deg,#7f5af0,#a855f7);
padding:3px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
box-shadow:0 0 14px #7f5af080;
}

button{
font-family:inherit;
font-size:24px;
padding:14px 46px;
border-radius:50px;
border:none;
cursor:pointer;
font-weight:bold;
}

#startBtn{
margin-top:18px;
background:linear-gradient(135deg,#7f5af0,#2cb67d);
color:white;
box-shadow:0 0 22px #7f5af090;
}

#banBtn{
background:linear-gradient(135deg,#ff4444,#ff8844);
color:white;
font-weight:bold;
box-shadow:0 0 18px #ff444490;
width:80%;
max-width:320px;
transition:transform 0.08s;
}
#banBtn:active{ transform:scale(0.94); }

#game{ display:none; }

.hud{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
color:#c9c3e0;
margin-bottom:8px;
padding:0 4px;
}
.hud .val{
font-size:20px;
color:white;
font-weight:bold;
}

.combo{
font-size:13px;
color:#ffd166;
min-height:18px;
font-weight:bold;
text-shadow:0 0 10px #ffd16690;
}

.field{
width:100%;
height:340px;
margin:8px auto;
background:linear-gradient(180deg,#0a0616 0%,#140b26 55%,#1c1030 78%,#241238 100%);
border:2px solid #7f5af0;
border-radius:16px;
position:relative;
overflow:hidden;
box-shadow:0 0 26px #7f5af040, inset 0 0 40px #00000060;
}

.horizon{
position:absolute;
left:0;
right:0;
top:78%;
height:1px;
background:linear-gradient(90deg,transparent,#a855f780,transparent);
pointer-events:none;
}
.horizon-glow{
position:absolute;
left:0;
right:0;
top:78%;
height:60px;
background:linear-gradient(180deg,#a855f722,transparent);
pointer-events:none;
}

.crosshair{
position:absolute;
left:50%;
top:0;
height:78%;
width:1px;
background:repeating-linear-gradient(180deg,#ffffff25 0 6px,transparent 6px 12px);
transform:translateX(-50%);
pointer-events:none;
}
.target-zone{
position:absolute;
left:50%;
top:0;
height:78%;
width:38px;
transform:translateX(-50%);
background:#ffd16610;
border-left:1px dashed #ffd16640;
border-right:1px dashed #ffd16640;
pointer-events:none;
}

.ufo{
position:absolute;
top:38px;
font-size:34px;
left:0;
transition:0.05s;
filter:drop-shadow(0 0 6px #7f5af0);
z-index:3;
}

/* 発射口（銃口）*/
.turret-mount{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:64px;
height:46px;
pointer-events:none;
z-index:4;
}
.turret-base{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:54px;
height:16px;
background:linear-gradient(180deg,#3a2a5c,#1c1030);
border-radius:8px 8px 4px 4px;
border:1px solid #7f5af060;
}
.turret-barrel{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
width:14px;
height:34px;
background:linear-gradient(180deg,#a855f7,#4c2e8f);
border-radius:6px 6px 2px 2px;
border:1px solid #ffffff30;
box-shadow:0 0 10px #7f5af090;
}
.turret-muzzle{
position:absolute;
bottom:44px;
left:50%;
transform:translateX(-50%);
width:20px;
height:8px;
background:#c9a8ff;
border-radius:4px;
box-shadow:0 0 8px #c9a8ff;
}
.muzzleFlash{
animation:muzzleFlash 0.15s ease-out;
}
@keyframes muzzleFlash{
0%{box-shadow:0 0 26px 10px #ffe08890; background:#fff3cc;}
100%{box-shadow:0 0 8px #c9a8ff; background:#c9a8ff;}
}

.bubble{
position:absolute;
top:2px;
background:white;
color:#111;
padding:5px 10px;
border-radius:14px;
font-size:13px;
white-space:nowrap;
font-weight:bold;
opacity:0;
transform:translateY(4px) scale(0.9);
transition:opacity 0.25s, transform 0.25s;
pointer-events:none;
z-index:5;
}
.bubble.show{
opacity:1;
transform:translateY(0) scale(1);
}

.bullet{
position:absolute;
bottom:50px;
font-size:20px;
display:none;
filter:drop-shadow(0 0 10px #ffd166);
z-index:3;
}

.bar-label{
display:flex;
justify-content:space-between;
font-size:12px;
color:#c9c3e0;
margin:14px 0 4px;
}

.bar{
width:100%;
height:22px;
background:#1c1430;
border-radius:20px;
overflow:hidden;
border:1px solid #ffffff20;
}

#stress{
height:100%;
width:0%;
background:linear-gradient(90deg,#ffd166,#ff4444);
transition:0.25s;
}

#message{
font-size:19px;
min-height:30px;
margin:10px 0;
font-weight:bold;
}

.banFlash{
position:fixed;
top:38%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:#ff2a2a;
font-weight:900;
text-shadow:0 0 24px #ff0000;
animation:banAnim 0.25s forwards;
pointer-events:none;
z-index:10;
}
@keyframes banAnim{
0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
100%{opacity:0; transform:translate(-50%,-50%) scale(1.8);}
}

.explode{
position:absolute;
font-size:38px;
animation:boom 0.6s forwards;
pointer-events:none;
}
@keyframes boom{
0%{opacity:1; transform:scale(1);}
100%{opacity:0; transform:scale(3);}
}

.star{
position:absolute;
color:#ffd166;
font-size:18px;
animation:starFly 0.8s forwards;
pointer-events:none;
}
@keyframes starFly{
0%{opacity:1; transform:translate(0,0);}
100%{opacity:0; transform:translate(80px,-80px);}
}

.popScore{
position:absolute;
font-weight:bold;
font-size:18px;
color:#2cff9d;
animation:popUp 0.7s forwards;
pointer-events:none;
text-shadow:0 0 8px #2cff9d;
}
@keyframes popUp{
0%{opacity:1; transform:translateY(0);}
100%{opacity:0; transform:translateY(-40px);}
}

.rankRow{
display:flex;
justify-content:space-between;
padding:6px 16px;
font-size:15px;
border-bottom:1px solid #ffffff15;
}
.rankBox{
background:#140b26;
border:1px solid #7f5af040;
border-radius:12px;
padding:6px 0;
margin-top:8px;
}

.retryBtn{
margin-top:14px;
background:linear-gradient(135deg,#2cb67d,#2cff9d);
color:#052014;
box-shadow:0 0 18px #2cff9d80;
}

.title-tag{
font-size:16px;
color:#ffd166;
font-weight:bold;
margin-top:4px;
}

.powerup{
position:absolute;
top:44px;
font-size:26px;
display:none;
filter:drop-shadow(0 0 8px #2cff9d);
}

</style>

</head>

<body>

<div id="stars"></div>

<div class="wrap">

<div id="title">

<div class="badge">STRESS RELEASE SHOOTER</div>
<h1>😡 イライラすとっぷ</h1>

<div class="sub">
🛸 煽るUFOを予測して撃て！<br>
ストレス10で即ゲームオーバー<br>
連続HITでコンボボーナス発生！<br><br>
BAN！で未来を読め！
</div>

<button id="startBtn" onclick="startGame()">START</button>

<div class="rankBox">
<h2 style="margin:10px 0 4px;font-size:18px;">🏆 TOP5</h2>
<div id="ranking"></div>
</div>

</div>



<div id="game">

<div class="hud">
<div>SCORE<br><span class="val" id="score">0</span></div>
<div>COMBO<br><span class="val" id="comboVal">0</span></div>
<div>LV<br><span class="val" id="levelVal">1</span></div>
<div><button id="muteBtn" onclick="toggleMute()" style="font-size:18px;padding:4px 10px;background:#1c1430;color:white;box-shadow:none;">🔊</button></div>
</div>

<div class="combo" id="comboMsg"></div>

<div class="field">
<div class="horizon-glow"></div>
<div class="horizon"></div>
<div class="target-zone"></div>
<div class="crosshair"></div>

<div id="bubble" class="bubble"></div>
<div id="ufo" class="ufo">🛸</div>
<div id="powerup" class="powerup">⭐</div>
<div id="bullet" class="bullet">💥</div>

<div class="turret-mount">
<div class="turret-barrel" id="turretBarrel"></div>
<div class="turret-muzzle" id="turretMuzzle"></div>
<div class="turret-base"></div>
</div>

</div>

<div class="bar-label"><span>ストレス</span><span id="stressNum">0</span>/10</div>
<div class="bar"><div id="stress"></div></div>

<div id="message"></div>

<button id="banBtn" onclick="stopGame()">BAN！</button>

</div>

</div>

<script>

/* ---------- 背景の星生成 ---------- */
(function makeStars(){
let field = document.getElementById("stars");
for(let i=0;i<60;i++){
let s = document.createElement("div");
s.className = "starDot";
let size = Math.random()*2+1;
s.style.width = size+"px";
s.style.height = size+"px";
s.style.left = Math.random()*100+"%";
s.style.top = Math.random()*100+"%";
s.style.animationDelay = (Math.random()*3)+"s";
field.appendChild(s);
}
})();

let ufo, bubble, bullet, powerupEl, field;
let x=0, dir=1, speed=4;
let timer;
let score=0;
let stress=0;
let audio;

let firing = false;

let ufoType = "normal";
let zigzagOffset = 0;

let combo = 0;
let maxCombo = 0;
let level = 1;
let elapsedHits = 0;

let powerupActive = false;
let slowMoActive = false;
let powerupX = 0;
let powerupTimer = null;

const titles = [
  {min:0, text:""},
  {min:5, text:"見習いハンター"},
  {min:12, text:"UFO駆除人"},
  {min:20, text:"未来予知の使い手"},
  {min:30, text:"銀河のBAN王"},
  {min:45, text:"伝説のクレーマー撃退者"}
];

let comments=[
"こっちだよ〜😏","今押すと思った？🤣","残念、逆でした〜","読めるかな？笑",
"未来予測してみな？","あと0.2秒だったね","焦ってる？😏","読みが浅いね〜",
"もっと集中しなよ？","今のは惜しい！","揺さぶられてるね〜","反応遅いよ？笑",
"まだまだだね😈","予測できてる？","迷ってるの見えてるよ？","今のは罠だよ〜",
"ふふふ😏","読めないでしょ？","揺らしていくよ〜","そのタイミングじゃないよ",
"逆だって言ったよね？","もっと早く！","もっと遅く！","揺れるよ〜？",
"惑わされてるね〜","今のはフェイント！","見抜けるかな？","まだ本気じゃないよ？",
"そろそろ本気出す？😈"
];

const comboComments = [
"止まらない！","絶好調！","ノリノリだね！","その調子！","無双状態！"
];

/* ---------- 吹き出し：たまに呟く演出 ---------- */
let bubbleShowTimer = null;
let bubbleHideTimer = null;

function showTaunt(text){
if(!bubble) return;
clearTimeout(bubbleHideTimer);
bubble.innerHTML = text;
bubble.classList.add("show");
bubbleHideTimer = setTimeout(()=>{
bubble.classList.remove("show");
}, 1700);
}

function scheduleTaunt(){
let delay = 4500 + Math.random()*4500; // 4.5〜9秒に一度だけポロッと呟く
bubbleShowTimer = setTimeout(()=>{
if(document.getElementById("game").style.display==="block"){
showTaunt(comments[Math.floor(Math.random()*comments.length)]);
}
scheduleTaunt();
}, delay);
}

function stopTaunts(){
clearTimeout(bubbleShowTimer);
clearTimeout(bubbleHideTimer);
if(bubble) bubble.classList.remove("show");
}

let muted = false;

function getAudio(){
    if(!audio){
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audio.state === "suspended"){
        audio.resume();
    }
    return audio;
}

function banSound(freqLow=80, freqHigh=900){
    if(muted) return;
    audio = getAudio();

    let osc1 = audio.createOscillator();
    let gain1 = audio.createGain();
    osc1.frequency.value = freqLow;
    gain1.gain.setValueAtTime(0.6, audio.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);

    let osc2 = audio.createOscillator();
    let gain2 = audio.createGain();
    osc2.frequency.value = freqHigh;
    gain2.gain.setValueAtTime(0.3, audio.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);

    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(audio.destination);
    gain2.connect(audio.destination);

    osc1.start();
    osc2.start();
    osc1.stop(audio.currentTime + 0.25);
    osc2.stop(audio.currentTime + 0.15);
}

function hitSound(){
    if(muted) return;
    audio = getAudio();
    [880, 1320].forEach((f,i)=>{
        let osc = audio.createOscillator();
        let gain = audio.createGain();
        osc.frequency.value = f;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.001, audio.currentTime + i*0.06);
        gain.gain.linearRampToValueAtTime(0.25, audio.currentTime + i*0.06 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + i*0.06 + 0.18);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(audio.currentTime + i*0.06);
        osc.stop(audio.currentTime + i*0.06 + 0.2);
    });
}

function missSound(){
    if(muted) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audio.currentTime + 0.25);
    gain.gain.setValueAtTime(0.25, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.25);
}

function toggleMute(){
    muted = !muted;
    document.getElementById("muteBtn").innerHTML = muted ? "🔇" : "🔊";
}

function chimeSound(){
    if(muted) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.frequency.value = 1300;
    gain.gain.setValueAtTime(0.25, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.2);
}

/* ---------- 軽快なBGMループ ---------- */
let bgmTimer = null;
let bgmStep = 0;
const bgmPattern = [523.25,0,659.25,0,783.99,659.25,0,880.00, 783.99,0,659.25,0,523.25,0,0,0];

function playBgmNote(freq){
    if(muted || !freq) return;
    audio = getAudio();
    let osc = audio.createOscillator();
    let gain = audio.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, audio.currentTime);
    gain.gain.linearRampToValueAtTime(0.09, audio.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.22);
}

function startBGM(){
    stopBGM();
    bgmStep = 0;
    bgmTimer = setInterval(()=>{
        playBgmNote(bgmPattern[bgmStep % bgmPattern.length]);
        bgmStep++;
    }, 180);
}

function stopBGM(){
    if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; }
}

function startGame(){
document.getElementById("title").style.display="none";
document.getElementById("game").style.display="block";
ufo=document.getElementById("ufo");
bubble=document.getElementById("bubble");
bullet=document.getElementById("bullet");
powerupEl=document.getElementById("powerup");
field=document.querySelector(".field");
banSound();
spawnPowerupCycle();
startBGM();
scheduleTaunt();
move();
}

function chooseUFO(){
let r=Math.random();
let bossChance = level>=3 ? 0.06 : 0;
if(r<bossChance){ ufoType="boss"; showTaunt("ボスUFO出現！！(x5)👹"); }
else if(r<bossChance+0.05){ ufoType="rare"; showTaunt("レアUFOだよ😎 (x3)"); }
else if(r<bossChance+0.25){ ufoType="fast"; }
else if(r<bossChance+0.45){ ufoType="zigzag"; }
else{ ufoType="normal"; }
}

function currentLevelMultiplier(){
return 1 + (level-1)*0.35;
}

function move(){
chooseUFO();
timer=setInterval(()=>{

let mult = currentLevelMultiplier() * (slowMoActive ? 0.45 : 1);

if(ufoType==="fast") speed=10*mult;
if(ufoType==="normal") speed=(4+Math.random()*3)*mult;
if(ufoType==="boss") speed=2.5*mult;
if(ufoType==="zigzag"){
speed=5*mult;
zigzagOffset = Math.sin(Date.now()/80)*22;
ufo.style.top = (38 + zigzagOffset)+"px";
}

x += speed * dir;

let maxW = field ? field.clientWidth-50 : window.innerWidth*0.75;
if(x > maxW){ dir=-1; }
if(x < 0){ dir=1; }

if(ufoType==="rare"){
ufo.style.filter="drop-shadow(0 0 20px gold)";
ufo.style.fontSize="40px";
}else if(ufoType==="boss"){
ufo.style.filter="drop-shadow(0 0 22px #ff3366)";
ufo.style.fontSize="70px";
}else{
ufo.style.filter="drop-shadow(0 0 6px #7f5af0)";
ufo.style.fontSize="34px";
}

if(Math.random()<0.0012) phantom();
if(Math.random()<0.004) chooseUFO();

ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";

},20);
}

function phantom(){
showTaunt("今まで本気だったと思った？😈");
speed=18;
let count=0;
let fast=setInterval(()=>{
x += speed * dir;
ufo.style.left=x+"px";
bubble.style.left=(x-20)+"px";
count++;
if(count>20){
clearInterval(fast);
speed=4+Math.random()*3;
}
},20);
}

/* ---------- パワーアップ（スター）システム ---------- */
function spawnPowerupCycle(){
powerupTimer = setInterval(()=>{
if(!powerupActive && document.getElementById("game").style.display==="block"){
showPowerup();
}
}, 9000 + Math.random()*4000);
}

function showPowerup(){
powerupActive = true;
let maxW = field.clientWidth-40;
powerupX = Math.random()*maxW;
powerupEl.style.left = powerupX+"px";
powerupEl.style.display = "block";

setTimeout(()=>{
if(powerupActive){
powerupActive = false;
powerupEl.style.display = "none";
}
}, 3500);
}

function tryGrabPowerup(){
if(!powerupActive) return false;
let dist = Math.abs((x+17) - (powerupX+15));
if(dist < 55){
powerupActive = false;
powerupEl.style.display = "none";
activateSlowMo();
chimeSound();
return true;
}
return false;
}

function activateSlowMo(){
slowMoActive = true;
document.getElementById("message").innerHTML = "⭐ スローモーション発動！";
setTimeout(()=>{ slowMoActive = false; }, 4000);
}

function stopGame(){

if(firing) return;
firing = true;

// パワーアップ取得判定（撃つ瞬間の位置で判定）
tryGrabPowerup();

banSound();

let fx = document.createElement("div");
fx.className = "banFlash";
fx.innerHTML = "BAN!!";
document.body.appendChild(fx);
setTimeout(()=>fx.remove(),250);

let muzzle = document.getElementById("turretMuzzle");
muzzle.classList.add("muzzleFlash");
setTimeout(()=>muzzle.classList.remove("muzzleFlash"),150);

bullet.style.display = "block";
bullet.style.left = "50%";
bullet.style.bottom = "50px";

slowBullet();
}

function slowBullet(){

let pos = 50;
let target = 250;
let speedB = 4;

let bulletTimer = setInterval(()=>{

pos += speedB;
bullet.style.bottom = pos + "px";

if(pos >= target){
clearInterval(bulletTimer);
bullet.style.display = "none";
judge();
}

}, 16);
}

function explodeEffect(){
let boom=document.createElement("div");
boom.className="explode";
boom.innerHTML="💥";
boom.style.left=(x)+"px";
boom.style.top="38px";
field.appendChild(boom);
setTimeout(()=>boom.remove(),600);

for(let i=0;i<5;i++){
let star=document.createElement("div");
star.className="star";
star.innerHTML="⭐";
star.style.left=(x)+"px";
star.style.top="38px";
field.appendChild(star);
setTimeout(()=>star.remove(),800);
}
}

function popScoreText(text){
let p = document.createElement("div");
p.className = "popScore";
p.innerHTML = text;
p.style.left = x+"px";
p.style.top = "18px";
field.appendChild(p);
setTimeout(()=>p.remove(),700);
}

function updateLevel(){
let newLevel = 1 + Math.floor(elapsedHits/6);
if(newLevel !== level){
level = newLevel;
document.getElementById("levelVal").innerHTML = level;
document.getElementById("message").innerHTML = "🔺 LEVEL UP！ Lv."+level;
}
}

function currentTitle(){
let t = "";
for(const item of titles){
if(maxCombo >= item.min) t = item.text;
}
return t;
}

function judge(){

let center=field.clientWidth/2;
let distance=Math.abs((x+17)-center);

if(distance < 20){

let base = 1;
if(ufoType==="rare") base = 3;
if(ufoType==="boss") base = 5;

combo++;
if(combo > maxCombo) maxCombo = combo;
elapsedHits++;

let comboBonus = combo>=10 ? 3 : combo>=5 ? 2 : 1;
let gained = base * comboBonus;
score += gained;

stress -= (ufoType==="boss" ? 2 : 1);
if(stress < 0) stress = 0;

hitSound();
explodeEffect();
popScoreText("+"+gained + (comboBonus>1 ? " COMBO×"+comboBonus : ""));
navigator.vibrate?.(100);

document.querySelector(".field").classList.add("hitflash");
setTimeout(()=>document.querySelector(".field").classList.remove("hitflash"),300);

document.getElementById("message").innerHTML="🎯 HIT！";

document.getElementById("comboVal").innerHTML = combo;
if(combo>0 && combo%5===0){
document.getElementById("comboMsg").innerHTML = combo+"連続！ "+comboComments[Math.floor(Math.random()*comboComments.length)];
}

updateLevel();

}else{

combo = 0;
document.getElementById("comboVal").innerHTML = combo;
document.getElementById("comboMsg").innerHTML = "";

stress += 1;

missSound();

document.body.classList.add("flash");
setTimeout(()=>document.body.classList.remove("flash"),300);

document.getElementById("message").innerHTML="😈 MISS！";
}

if(stress >= 10){
stress = 10;
document.getElementById("stress").style.width = "100%";
document.getElementById("stressNum").innerHTML = 10;
document.getElementById("message").innerHTML = "💀ストレス限界突破…GAME OVER";

navigator.vibrate?.([200,100,200]);

clearInterval(timer);
clearInterval(powerupTimer);
stopBGM();
stopTaunts();
setTimeout(()=>{ showRetry(); },1200);

return;
}

document.getElementById("score").innerHTML=score;
document.getElementById("stress").style.width=(stress*10)+"%";
document.getElementById("stressNum").innerHTML = stress;

saveScore();

firing = false;

setTimeout(()=>{
document.getElementById("message").innerHTML="";
chooseUFO();
},900);
}

function showRetry(){
let box = document.getElementById("message");

let title = currentTitle();
if(title){
let tEl = document.createElement("div");
tEl.className = "title-tag";
tEl.innerHTML = "🏅 称号：「"+title+"」獲得！（最大コンボ "+maxCombo+"）";
box.appendChild(tEl);
}

let btn = document.createElement("button");
btn.className = "retryBtn";
btn.innerHTML = "RETRY";
btn.onclick = ()=>location.reload();
box.appendChild(btn);
}

let rankData = [];

function saveScore(){
rankData.push(score);
rankData.sort((a,b)=>b-a);
rankData = rankData.slice(0,5);
showRank();
}

function showRank(){
let data = rankData;
let html="";
data.forEach((v,i)=>{
let medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1)+"位";
html += "<div class='rankRow'><span>"+medal+"</span><span>"+v+"点</span></div>";
});
document.getElementById("ranking").innerHTML=html || "<div class='rankRow'><span>まだ記録なし</span></div>";
}

showRank();

</script>

</body>
</html>
