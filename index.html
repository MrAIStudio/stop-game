<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>靴飛ばし大飛行！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{
margin:0;min-height:100vh;
background:linear-gradient(160deg,#bfe4ff 0%,#e8f7ff 40%,#fff8ec 100%);
color:#33465e;
font-family:"Hiragino Maru Gothic ProN","Yu Gothic","M PLUS Rounded 1c","Hiragino Sans",sans-serif;
text-align:center;overflow-x:hidden;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 12px 32px;position:relative;}
h1{font-size:26px;margin:8px 0 2px;color:#2b4a6b;text-shadow:0 2px 0 #fff;}
.badge{display:inline-block;background:linear-gradient(135deg,#ff9d6c,#ffce54);color:#5b3a1e;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:8px;box-shadow:0 4px 12px #ffb37050;}
.sub{font-size:13px;line-height:1.7;color:#4d6786;margin-bottom:10px;}
button{font-family:inherit;border:none;cursor:pointer;font-weight:bold;border-radius:50px;}
.bigBtn{font-size:20px;padding:12px 40px;background:linear-gradient(135deg,#ff7a59,#ffb703);color:#fff;box-shadow:0 8px 18px #ff7a5960;margin-top:10px;}
.smallBtn{font-size:13px;padding:8px 18px;background:#eef6ff;color:#2b4a6b;border:1px solid #bcdcff;box-shadow:none;}
.shoeGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
.shoeCard{background:#fffdf8;border:2px solid #dfeaf5;border-radius:16px;padding:8px 4px;cursor:pointer;box-shadow:0 3px 10px #33465e12;}
.shoeCard.active{border-color:#ff7a59;background:linear-gradient(160deg,#fff2ea,#fff8ec);box-shadow:0 4px 14px #ff7a5940;}
.shoeCard .emo{font-size:28px;}
.shoeCard .nm{font-size:11px;font-weight:bold;margin-top:2px;}
.flavorBox{background:#fffdf8;border:1px solid #dfeaf5;border-radius:14px;padding:8px 12px;font-size:12px;color:#5b6f8a;min-height:34px;margin-bottom:6px;}
.rankBox{background:#fffdf8;border:1px solid #dfeaf5;border-radius:16px;padding:8px 0;margin-top:10px;box-shadow:0 4px 12px #33465e10;}
.rankBox h2{margin:4px 0 6px;font-size:15px;color:#2b4a6b;}
.rankRow{display:flex;justify-content:space-between;padding:4px 18px;font-size:14px;border-bottom:1px solid #eef3f8;}
.statRow{display:flex;justify-content:space-between;padding:3px 18px;font-size:12px;color:#5b6f8a;}
.statRow span:last-child{font-weight:bold;color:#2b4a6b;}

#gameScreen{display:none;}
.gameWrap{position:relative;width:100%;max-width:480px;margin:0 auto;}
canvas{width:100%;display:block;border-radius:20px;box-shadow:0 6px 20px #33465e30;background:#bfe4ff;touch-action:manipulation;}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;}
.hudBox{background:#ffffffcc;border-radius:12px;padding:4px 12px;font-size:13px;font-weight:bold;color:#2b4a6b;box-shadow:0 2px 8px #33465e20;}
.hudBox .big{font-size:18px;color:#ff7a59;}
#eventMsg{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#3a2a52dd;color:#ffe0a3;padding:6px 16px;border-radius:14px;font-size:13px;font-weight:bold;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
#eventMsg.show{opacity:1;}
.fireBtnWrap{margin-top:10px;}
#fireBtn{font-size:20px;padding:12px 46px;background:linear-gradient(135deg,#ff7a59,#ffb703);color:#fff;box-shadow:0 8px 18px #ff7a5960;}
.tapHint{font-size:12px;color:#7a90ac;margin-top:4px;}

.resultOverlay{display:none;position:absolute;inset:0;background:#0d1b2add;border-radius:20px;color:#fff;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
.resultOverlay.show{display:flex;}
.resultOverlay .distTitle{font-size:14px;color:#cfe4ff;}
.resultOverlay .distNum{font-size:52px;font-weight:900;color:#ffce54;text-shadow:0 3px 0 #b5791a;margin:4px 0 2px;}
.resultOverlay .distMsg{font-size:14px;margin-bottom:12px;}
.resultOverlay .record{font-size:13px;color:#ffce54;font-weight:bold;margin-bottom:8px;}
.resultBtnRow{display:flex;gap:10px;}
.resultBtnRow button{font-size:14px;padding:10px 20px;}
.retryBtn{background:linear-gradient(135deg,#ff7a59,#ffb703);color:#fff;}
.backBtn{background:#ffffff22;color:#fff;border:1px solid #ffffff55;}
</style>
</head>
<body>
<div class="wrap">

<div id="titleScreen">
<div class="badge">SHOE FLYING DISTANCE GAME</div>
<h1>👟 靴飛ばし大飛行！</h1>
<div class="sub">
ブランコのタイミングを見極めてジャンプ！<br>
坂で加速、ジャンプ台で大ジャンプ、穴に注意！<br>
転がって跳ねて、飛距離を伸ばそう！
</div>

<div class="flavorBox" id="flavorBox">靴をえらんでね</div>
<div class="shoeGrid" id="shoeGrid"></div>

<button class="bigBtn" onclick="beginAttempt()">スタート</button>

<div class="rankBox">
<h2>🏆 自己ベスト TOP5</h2>
<div id="ranking"></div>
</div>
<div class="rankBox" id="statsBox">
<h2>📊 統計</h2>
<div id="statsList"></div>
</div>
</div>

<div id="gameScreen">
<div class="gameWrap">
<canvas id="cv"></canvas>
<div class="hud">
<div class="hudBox">きょり<br><span class="big" id="distHud">0 m</span></div>
<div class="hudBox" id="shoeHud">👟</div>
</div>
<div id="eventMsg"></div>
<div class="resultOverlay" id="resultOverlay">
<div class="distTitle">きょり</div>
<div class="distNum" id="resultDist">0m</div>
<div class="distMsg" id="resultMsg"></div>
<div class="record" id="resultRecord"></div>
<div class="resultBtnRow">
<button class="retryBtn" onclick="retryAttempt()">もう一度</button>
<button class="backBtn" onclick="backToTitle()">靴を選び直す</button>
</div>
</div>
</div>
<div class="fireBtnWrap"><button id="fireBtn" onclick="release()">とぶ！</button></div>
<div class="tapHint">画面をタップ、またはボタンでジャンプのタイミングを決めよう</div>
</div>

</div>

<script>
/* ================= 定数 ================= */
const GRAVITY=2000;
const PPM=18;
const LAUNCH_MULT=4.2;
const SWING_ROPE=120;
const SWING_MAX_ANGLE=0.96; // ~55deg
const SWING_PERIOD=1.6;
const SHOE_RADIUS=15;
const BOUNCE_MIN_SPEED=90;
const STOP_SPEED=18;
const FRICTION_SCALE=0.6;
const LAUNCH_HEIGHT=140;
const SAVE_KEY="kutsutobashi_save_v1";

const SHOES=[
{id:"sneaker",name:"スニーカー",emoji:"👟",restitution:0.5,friction:0.55,drag:0.10,launchScale:1.0,flavor:"クセがなくバランス型。まずはこれで練習しよう。"},
{id:"sandal",name:"サンダル",emoji:"🩴",restitution:0.75,friction:0.8,drag:0.16,launchScale:0.95,flavor:"よく弾むけど風に弱く、すぐ失速しがち。"},
{id:"leather",name:"革靴",emoji:"👞",restitution:0.25,friction:0.18,drag:0.05,launchScale:0.9,flavor:"あまり弾まないが、一度転がると止まらない。"},
{id:"boots",name:"長靴",emoji:"👢",restitution:0.15,friction:0.6,drag:0.20,launchScale:0.85,holeSurvive:0.5,flavor:"重くて飛びにくいが、穴に落ちても半分の確率で踏ん張れる。"},
{id:"heels",name:"ハイヒール",emoji:"👠",restitution:0.45,friction:0.10,drag:0.09,launchScale:1.0,wild:true,flavor:"よく滑ってどこまでも転がるが、弾み方は運まかせ。"},
{id:"uwabaki",name:"上履き",emoji:"🥿",restitution:0.55,friction:0.45,drag:0.08,launchScale:1.15,flavor:"靴飛ばしの定番。飛距離ボーナスつき！"}
];

/* ================= 状態 ================= */
let canvas,ctx,W=480,H=380;
let state="title"; // title / aiming / flight / result
let course;
let cameraX=0;
let swingT=0;
let selectedShoeId="sneaker";
let shoe={x:0,y:0,vx:0,vy:0,rotation:0,rolling:false,overHole:false,holeEnterY:0,bounceCount:0};
let particles=[];
let lastTime=0;
let currentDistanceM=0;
let finalDistanceM=0;
let messageTimer=0;
let audio=null;
let stats={best:0,plays:0,top:[]};

function currentShoe(){ return SHOES.find(s=>s.id===selectedShoeId); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ================= セーブ ================= */
function loadSave(){
try{
let raw=localStorage.getItem(SAVE_KEY);
if(raw){ let d=JSON.parse(raw); if(d.stats) Object.assign(stats,d.stats); }
}catch(e){}
}
function writeSave(){
try{ localStorage.setItem(SAVE_KEY,JSON.stringify({stats})); }catch(e){}
}

/* ================= コース生成 ================= */
function generateCourse(){
const TARGET=9000;
let segments=[];
let holes=[];
let current=[{x:0,y:300}];
let curX=0,curY=300;
while(curX<TARGET){
let type;
if(curX<450){ type="flat"; }
else if(curY>680){ type=Math.random()<0.75?"up":"flat"; }
else if(curY<100){ type=Math.random()<0.75?"down":"flat"; }
else{
let progress=curX/TARGET;
let roll=Math.random();
let holeP=0.16+progress*0.22;
let rampP=0.10;
if(roll<holeP) type="hole";
else if(roll<holeP+rampP) type="ramp";
else{ let r2=Math.random(); type=r2<0.4?"down":(r2<0.7?"flat":"up"); }
}

if(type==="flat"){
let len=150+Math.random()*220;
curX+=len; current.push({x:curX,y:curY});
}else if(type==="down"){
let len=250+Math.random()*300;
curY+=40+Math.random()*110;
curX+=len; current.push({x:curX,y:curY});
}else if(type==="up"){
let len=150+Math.random()*200;
curY-=20+Math.random()*70;
curX+=len; current.push({x:curX,y:curY});
}else if(type==="ramp"){
let riseLen=55+Math.random()*35;
curY-=70+Math.random()*70;
curX+=riseLen; current.push({x:curX,y:curY});
let topLen=30+Math.random()*20;
curX+=topLen; current.push({x:curX,y:curY});
}else if(type==="hole"){
let progress=curX/TARGET;
let width=65+Math.random()*(60+progress*130);
let holeStart=curX;
let holeEnd=curX+width;
current.push({x:holeStart,y:curY});
segments.push(current);
let yStartHole=curY;
let landY=clamp(curY+(Math.random()*50-15),90,760);
holes.push({start:holeStart,end:holeEnd,yStart:yStartHole,yEnd:landY});
curX=holeEnd; curY=landY;
current=[{x:curX,y:curY}];
}
curY=clamp(curY,80,770);
}
curX+=350;
current.push({x:curX,y:curY});
segments.push(current);
return {segments,holes,length:curX};
}

function groundInfoAt(x){
for(const seg of course.segments){
const first=seg[0], last=seg[seg.length-1];
if(x>=first.x-1 && x<=last.x+1){
for(let i=0;i<seg.length-1;i++){
if(x>=seg[i].x && x<=seg[i+1].x){
let dx=(seg[i+1].x-seg[i].x)||1;
let t=(x-seg[i].x)/dx;
let y=seg[i].y+(seg[i+1].y-seg[i].y)*t;
let slope=(seg[i+1].y-seg[i].y)/dx;
return {y,slope};
}
}
return {y:last.y,slope:0};
}
}
return null;
}

/* ================= 物理 ================= */
function bounceVelocity(vx,vy,slope,restitution){
let len=Math.sqrt(slope*slope+1);
let nx=slope/len, ny=-1/len;
let dot=vx*nx+vy*ny;
let rx=vx-2*dot*nx;
let ry=vy-2*dot*ny;
return {vx:rx*restitution, vy:ry*restitution};
}

function physicsStep(dt){
const variant=currentShoe();
shoe.vy+=GRAVITY*dt;
shoe.vx*=(1-variant.drag*dt);
shoe.vy*=(1-variant.drag*0.6*dt);
shoe.x+=shoe.vx*dt;
shoe.y+=shoe.vy*dt;
shoe.rotation+=shoe.vx*dt*0.06;

currentDistanceM=Math.max(0,shoe.x/PPM);
updateHud();

if(shoe.x>=course.length){ finishRun(true,false); return; }

let g=groundInfoAt(shoe.x);

if(g===null){
if(!shoe.overHole){ shoe.overHole=true; shoe.holeEnterY=shoe.y; shoe.rolling=false; }
if(shoe.vy>0 && (shoe.y-shoe.holeEnterY)>260){ handleHoleFall(); return; }
return;
}

if(shoe.overHole) shoe.overHole=false;
let groundY=g.y;

if(shoe.rolling){
let gAhead=groundInfoAt(shoe.x+12);
if(gAhead && g.slope<-0.32 && (gAhead.slope-g.slope)>0.25){
shoe.vy=-Math.abs(shoe.vx)*0.55-70;
shoe.rolling=false;
spawnBurst(shoe.x,shoe.y,10);
playJumpSound();
return;
}
let slopeAngle=Math.atan(g.slope);
shoe.vx+=GRAVITY*Math.sin(slopeAngle)*dt;
let decel=variant.friction*GRAVITY*FRICTION_SCALE*Math.cos(slopeAngle)*dt;
if(shoe.vx>0) shoe.vx=Math.max(0,shoe.vx-decel);
else if(shoe.vx<0) shoe.vx=Math.min(0,shoe.vx+decel);
shoe.y=groundY-SHOE_RADIUS;
shoe.vy=0;
if(Math.random()<0.35 && Math.abs(shoe.vx)>40) spawnDust(shoe.x,shoe.y+SHOE_RADIUS,1);
if(Math.abs(shoe.vx)<STOP_SPEED){ finishRun(false,false); return; }
}else{
if(shoe.y+SHOE_RADIUS>=groundY){
let speed=Math.hypot(shoe.vx,shoe.vy);
shoe.y=groundY-SHOE_RADIUS;
if(speed>BOUNCE_MIN_SPEED){
let rest=variant.wild? clamp(variant.restitution+(Math.random()*0.5-0.25),0.08,0.95) : variant.restitution;
let res=bounceVelocity(shoe.vx,shoe.vy,g.slope,rest);
shoe.vx=res.vx; shoe.vy=res.vy;
shoe.bounceCount++;
spawnBurst(shoe.x,shoe.y,6);
playBounceSound(speed);
}else{
shoe.rolling=true;
shoe.vy=0;
}
}
}
}

function handleHoleFall(){
const variant=currentShoe();
if(variant.holeSurvive && Math.random()<variant.holeSurvive){
let h=course.holes.find(hh=>shoe.x>=hh.start-5 && shoe.x<=hh.end+90);
let edgeX=h? h.end+4 : shoe.x+40;
shoe.x=edgeX;
shoe.vx*=0.3; shoe.vy=0;
shoe.overHole=false;
let g=groundInfoAt(shoe.x);
shoe.y=(g?g.y:shoe.y)-SHOE_RADIUS;
shoe.rolling=true;
flashMessage("ギリギリ踏ん張った！");
playSurviveSound();
}else{
flashMessage("穴に落ちた…");
playHoleFallSound();
finishRun(false,true);
}
}

function finishRun(reachedEnd,holeFall){
if(state==="result") return;
state="result";
let dist = reachedEnd ? currentDistanceM*1.15 : currentDistanceM;
finalDistanceM=Math.round(dist*10)/10;
let isRecord = finalDistanceM>stats.best;
stats.plays++;
if(isRecord) stats.best=finalDistanceM;
stats.top.push(finalDistanceM);
stats.top.sort((a,b)=>b-a);
stats.top=stats.top.slice(0,5);
writeSave();
showResult(reachedEnd,holeFall,isRecord);
if(!holeFall) playFinishSound(reachedEnd);
}

/* ================= 発射 ================= */
function release(){
if(state!=="aiming") return;
const A=SWING_MAX_ANGLE, w=2*Math.PI/SWING_PERIOD;
const theta=A*Math.sin(w*swingT);
const thetaSpeed=A*w*Math.cos(w*swingT);
const variant=currentShoe();
const vxBase=thetaSpeed*SWING_ROPE*Math.cos(theta);
const vyBase=-thetaSpeed*SWING_ROPE*Math.sin(theta);
const scale=LAUNCH_MULT*variant.launchScale;
const g0=groundInfoAt(0);
shoe.x=0;
shoe.y=(g0?g0.y:300)-LAUNCH_HEIGHT;
shoe.vx=vxBase*scale;
shoe.vy=vyBase*scale;
shoe.rotation=0;
shoe.rolling=false;
shoe.overHole=false;
shoe.bounceCount=0;
currentDistanceM=0;
state="flight";
flashMessage(shoe.vx<40 ? "うわっ、変な方向に飛んだ！？" : "とんだ！");
playLaunchSound();
}

/* ================= パーティクル ================= */
function spawnDust(x,y,n){
for(let i=0;i<n;i++){
particles.push({x,y,vx:(Math.random()*60-30),vy:-Math.random()*40,life:0.4,maxLife:0.4,color:"201,160,106",r:2.5+Math.random()*2.5});
}
}
function spawnBurst(x,y,n){
for(let i=0;i<n;i++){
let a=Math.random()*Math.PI*2, sp=60+Math.random()*140;
particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.5,maxLife:0.5,color:"255,220,150",r:2+Math.random()*3});
}
}
function updateParticles(dt){
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.life-=dt;
if(p.life<=0) particles.splice(i,1);
}
}

/* ================= サウンド ================= */
function getAudio(){
if(!audio){ audio=new (window.AudioContext||window.webkitAudioContext)(); }
if(audio.state==="suspended") audio.resume();
return audio;
}
function tone(freqStart,freqEnd,dur,type,vol){
let a=getAudio();
let osc=a.createOscillator(); let gain=a.createGain();
osc.type=type||"sine";
osc.frequency.setValueAtTime(freqStart,a.currentTime);
osc.frequency.exponentialRampToValueAtTime(Math.max(30,freqEnd),a.currentTime+dur);
gain.gain.setValueAtTime((vol||0.25),a.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
osc.connect(gain); gain.connect(a.destination);
osc.start(); osc.stop(a.currentTime+dur);
}
function playLaunchSound(){ tone(300,900,0.25,"sawtooth",0.2); }
function playBounceSound(speed){ let p=clamp(speed/900,0.2,1); tone(200+p*500,120,0.12,"sine",0.2); }
function playJumpSound(){ tone(500,1100,0.15,"triangle",0.2); }
function playHoleFallSound(){ tone(400,60,0.5,"sawtooth",0.25); }
function playSurviveSound(){ tone(700,900,0.2,"square",0.15); }
function playFinishSound(good){ tone(good?700:500,good?1400:700,0.4,"triangle",0.25); }

/* ================= UI補助 ================= */
function flashMessage(text){
let el=document.getElementById("eventMsg");
el.textContent=text;
el.classList.add("show");
clearTimeout(flashMessage._t);
flashMessage._t=setTimeout(()=>el.classList.remove("show"),1400);
}
function updateHud(){
document.getElementById("distHud").textContent=Math.round(currentDistanceM)+" m";
}

/* ================= 画面遷移 ================= */
function buildShoeGrid(){
let grid=document.getElementById("shoeGrid");
grid.innerHTML="";
SHOES.forEach(s=>{
let card=document.createElement("div");
card.className="shoeCard"+(s.id===selectedShoeId?" active":"");
card.innerHTML="<div class='emo'>"+s.emoji+"</div><div class='nm'>"+s.name+"</div>";
card.onclick=()=>{ selectedShoeId=s.id; buildShoeGrid(); document.getElementById("flavorBox").textContent=s.flavor; };
grid.appendChild(card);
});
document.getElementById("flavorBox").textContent=currentShoe().flavor;
}

function renderTitleStats(){
document.getElementById("statsList").innerHTML=
"<div class='statRow'><span>ベスト距離</span><span>"+stats.best+" m</span></div>"+
"<div class='statRow'><span>プレイ回数</span><span>"+stats.plays+"</span></div>";
let html="";
if(stats.top.length===0){ html="<div class='rankRow'><span>まだ記録なし</span></div>"; }
else{
stats.top.forEach((v,i)=>{
let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"位";
html+="<div class='rankRow'><span>"+medal+"</span><span>"+v+" m</span></div>";
});
}
document.getElementById("ranking").innerHTML=html;
}

function beginAttempt(){
document.getElementById("titleScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";
document.getElementById("shoeHud").textContent=currentShoe().emoji;
fitCanvas();
startAttemptCommon();
}
function retryAttempt(){
document.getElementById("resultOverlay").classList.remove("show");
startAttemptCommon();
}
function backToTitle(){
document.getElementById("resultOverlay").classList.remove("show");
document.getElementById("gameScreen").style.display="none";
document.getElementById("titleScreen").style.display="block";
renderTitleStats();
buildShoeGrid();
state="title";
}
function startAttemptCommon(){
course=generateCourse();
cameraX=0; swingT=0; particles=[];
shoe={x:0,y:0,vx:0,vy:0,rotation:0,rolling:false,overHole:false,holeEnterY:0,bounceCount:0};
currentDistanceM=0;
state="aiming";
updateHud();
}

function showResult(reachedEnd,holeFall,isRecord){
document.getElementById("resultDist").textContent=finalDistanceM+"m";
let msg = holeFall ? "😵 穴に落ちてしまった…" : reachedEnd ? "🎉 コース制覇ボーナス！" : "🏁 着地！";
document.getElementById("resultMsg").textContent=msg;
document.getElementById("resultRecord").textContent = isRecord ? "🏆 自己ベスト更新！" : "";
document.getElementById("resultOverlay").classList.add("show");
renderTitleStatsQuietly();
}
function renderTitleStatsQuietly(){ /* stats box on title updates next time it's shown */ }

/* ================= 描画 ================= */
function fitCanvas(){
canvas=document.getElementById("cv");
let wrapW=Math.min(document.querySelector(".gameWrap").clientWidth||480,480);
canvas.width=wrapW; canvas.height=380;
W=canvas.width; H=canvas.height;
ctx=canvas.getContext("2d");
ctx.textAlign="center"; ctx.textBaseline="middle";
canvas.onclick=()=>{ if(state==="aiming") release(); };
}
window.addEventListener("resize",()=>{ if(canvas) fitCanvas(); });

function drawSky(){
let grad=ctx.createLinearGradient(0,0,0,H);
grad.addColorStop(0,"#7ec8f0"); grad.addColorStop(0.55,"#cdeeff"); grad.addColorStop(1,"#fff8ec");
ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
ctx.beginPath(); ctx.fillStyle="#ffe27a"; ctx.arc(W-50,50,26,0,7); ctx.fill();
}
function drawClouds(camX){
ctx.fillStyle="#ffffffcc";
for(let i=0;i<5;i++){
let baseX=(i*260)-((camX*0.15)%260);
let cx=((baseX%(W+200))+W+200)%(W+200)-100;
let cy=40+((i*37)%50);
ctx.beginPath();
ctx.ellipse(cx,cy,26,14,0,0,7);
ctx.ellipse(cx+20,cy+4,20,12,0,0,7);
ctx.ellipse(cx-20,cy+5,18,11,0,0,7);
ctx.fill();
}
}
function drawGround(camX){
for(const seg of course.segments){
let first=seg[0], last=seg[seg.length-1];
if(last.x-camX<-60 || first.x-camX>W+60) continue;
ctx.beginPath();
ctx.moveTo(seg[0].x-camX,seg[0].y);
for(let i=1;i<seg.length;i++) ctx.lineTo(seg[i].x-camX,seg[i].y);
ctx.lineTo(last.x-camX,H);
ctx.lineTo(first.x-camX,H);
ctx.closePath();
let grad=ctx.createLinearGradient(0,first.y,0,H);
grad.addColorStop(0,"#8fd35f"); grad.addColorStop(0.12,"#5fa73c"); grad.addColorStop(0.12,"#c98a4b"); grad.addColorStop(1,"#8a5a30");
ctx.fillStyle=grad; ctx.fill();
ctx.strokeStyle="#4f8f3b"; ctx.lineWidth=3; ctx.beginPath();
ctx.moveTo(seg[0].x-camX,seg[0].y);
for(let i=1;i<seg.length;i++) ctx.lineTo(seg[i].x-camX,seg[i].y);
ctx.stroke();
}
for(const h of course.holes){
if(h.end-camX<-60 || h.start-camX>W+60) continue;
ctx.beginPath();
ctx.moveTo(h.start-camX,h.yStart);
ctx.lineTo(h.start-camX,H);
ctx.lineTo(h.end-camX,H);
ctx.lineTo(h.end-camX,h.yEnd);
ctx.closePath();
let g=ctx.createLinearGradient(0,Math.min(h.yStart,h.yEnd),0,H);
g.addColorStop(0,"#3a2a1a"); g.addColorStop(1,"#150d08");
ctx.fillStyle=g; ctx.fill();
}
}
function drawSwing(){
const pivotX=90, pivotY=110;
const A=SWING_MAX_ANGLE, w=2*Math.PI/SWING_PERIOD;
const theta=A*Math.sin(w*swingT);
const thetaSpeed=A*w*Math.cos(w*swingT);
const seatX=pivotX+Math.sin(theta)*SWING_ROPE;
const seatY=pivotY+Math.cos(theta)*SWING_ROPE;

ctx.strokeStyle="#8a6a4a"; ctx.lineWidth=8; ctx.lineCap="round";
ctx.beginPath(); ctx.moveTo(pivotX-46,H-2); ctx.lineTo(pivotX,pivotY-8); ctx.lineTo(pivotX+46,H-2); ctx.stroke();
ctx.beginPath(); ctx.moveTo(pivotX-46,pivotY-4); ctx.lineTo(pivotX+46,pivotY-4); ctx.stroke();

let sweetZone = theta>-0.15 && theta<0.5 && thetaSpeed>0;
ctx.strokeStyle= sweetZone ? "#ffce54" : "#c9b8a0";
ctx.lineWidth=3;
ctx.beginPath(); ctx.moveTo(pivotX,pivotY); ctx.lineTo(seatX,seatY); ctx.stroke();

if(sweetZone){
ctx.beginPath(); ctx.fillStyle="#ffce5455"; ctx.arc(seatX,seatY,26,0,7); ctx.fill();
}

ctx.font="30px sans-serif";
ctx.fillText("🧒",seatX,seatY-6);
ctx.font="18px sans-serif";
ctx.fillText(currentShoe().emoji,seatX+10,seatY+16);

ctx.fillStyle="#8a6a4a";
ctx.fillRect(seatX-14,seatY+2,28,6);
}
function drawParticles(camX){
for(const p of particles){
ctx.beginPath();
ctx.fillStyle="rgba("+p.color+","+clamp(p.life/p.maxLife,0,1)+")";
ctx.arc(p.x-camX,p.y,p.r,0,7); ctx.fill();
}
}
function drawShoe(camX){
ctx.save();
ctx.translate(shoe.x-camX,shoe.y);
ctx.rotate(shoe.rotation);
ctx.font="30px sans-serif";
ctx.fillText(currentShoe().emoji,0,0);
ctx.restore();
}

function draw(){
if(!ctx) return;
ctx.clearRect(0,0,W,H);
drawSky();
let camX = state==="aiming" ? 0 : cameraX;
drawClouds(camX);
drawGround(camX);
if(state==="aiming") drawSwing();
drawParticles(camX);
if(state==="flight"||state==="result") drawShoe(camX);
}

/* ================= メインループ ================= */
function update(dt){
if(state==="aiming"){ swingT+=dt; }
else if(state==="flight"){
physicsStep(dt);
if(state==="flight") cameraX=Math.max(0,shoe.x-W*0.34);
}
updateParticles(dt);
}
function frame(ts){
if(!lastTime) lastTime=ts;
let dt=Math.min((ts-lastTime)/1000,0.033);
lastTime=ts;
update(dt);
draw();
requestAnimationFrame(frame);
}

/* ================= 初期化 ================= */
loadSave();
buildShoeGrid();
renderTitleStats();
requestAnimationFrame(frame);
</script>
</body>
</html>
