<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>イライラすとっぷ</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
text-align:center;
overflow:hidden;
}

h1{
font-size:42px;
}

.sub{
font-size:20px;
color:#ccc;
line-height:1.8;
}

button{
font-size:28px;
padding:15px 45px;
border-radius:20px;
border:none;
background:#00ffff;
}

#game{
display:none;
}

.field{

width:90%;
height:300px;
margin:20px auto;
background:#222;
border:3px solid white;
position:relative;
overflow:hidden;

}


/* UFO */

.ufo{

position:absolute;
top:110px;
font-size:50px;
left:0;

}


.bubble{

position:absolute;
top:40px;
left:0;

background:white;
color:black;

padding:8px 12px;

border-radius:15px;

font-size:16px;

white-space:nowrap;

}


/* 弾 */

.bullet{

position:absolute;
bottom:20px;

font-size:35px;

display:none;

}


.status{

font-size:20px;

}


.bar{

width:80%;
height:25px;

background:#333;

margin:10px auto;

border-radius:20px;

overflow:hidden;

}


#stress{

height:100%;

width:50%;

background:red;

}


#message{

font-size:22px;

min-height:50px;

}


.rank{

margin-top:20px;

}

</style>

</head>


<body>


<div id="title">


<h1>
😡 イライラすとっぷ
</h1>


<div class="sub">

🛸 煽ってくるUFOを撃ち落とせ

<br>

動きを読んでSTOP！

<br><br>

「こっちだよ〜」に騙されるな🤣

</div>


<button onclick="startGame()">

START

</button>


<h2>🏆 TOP5</h2>

<div id="ranking"></div>


</div>




<div id="game">


<div class="field">


<div class="bubble" id="bubble">

こっちだよ〜😏

</div>


<div class="ufo" id="ufo">

🛸

</div>


<div class="bullet" id="bullet">

💥

</div>


</div>


<div class="status">

連続成功：
<span id="combo">0</span>

<br>

スコア：
<span id="score">0</span>

<br>

ストレス

</div>


<div class="bar">

<div id="stress"></div>

</div>


<button onclick="stopGame()">

STOP

</button>


</div>


<div id="message"></div>



<script>


let ufo=document.getElementById("ufo");

let bubble=document.getElementById("bubble");

let bullet=document.getElementById("bullet");


let x=0;

let direction=1;

let speed=4;

let timer;


let combo=0;

let score=0;

let stress=50;



let taunts=[

"こっちだよ〜😏",

"今押すと思った？🤣",

"残念、逆でした〜",

"読めるかな？笑",

"未来予測してみな？",

"あと0.2秒だったね"

];


let audio;


function sound(freq,time){

if(!audio){
audio=new AudioContext();
}

let o=audio.createOscillator();

let g=audio.createGain();


o.connect(g);

g.connect(audio.destination);


o.frequency.value=freq;


g.gain.setValueAtTime(
0.2,
audio.currentTime
);


g.gain.exponentialRampToValueAtTime(
0.001,
audio.currentTime+time
);


o.start();

o.stop(audio.currentTime+time);

}


function startGame(){


document.getElementById("title").style.display="none";

document.getElementById("game").style.display="block";


sound(600,0.1);


move();

}function move(){

timer=setInterval(()=>{


x += speed * direction;


// 端で反転
if(x > window.innerWidth*0.75){

direction=-1;

speed+=0.3;

}


if(x < 0){

direction=1;

speed+=0.3;

}


// フェイント
if(Math.random()<0.025){

direction*= -1;

}


// UFO移動
ufo.style.left=x+"px";

bubble.style.left=(x-20)+"px";


// 煽り吹き出しランダム

if(Math.random()<0.015){

bubble.innerHTML=
taunts[Math.floor(Math.random()*taunts.length)];

}


},20);


}



function stopGame(){


clearInterval(timer);


sound(250,0.15);


// 発射演出

bullet.style.display="block";

bullet.style.left="50%";


setTimeout(()=>{


bullet.style.display="none";


judge();


},300);



}



function judge(){


let center=
window.innerWidth/2;


let distance=
Math.abs(
(x+25)-center
);



if(distance < 60){


combo++;


score += combo*100;


stress-=10;


sound(900,0.3);



let win=[

"💥 HIT！やったね",

"🎯完璧！読んだ！",

"🛸UFO撃墜成功！"

];


document.getElementById("message").innerHTML=

win[Math.floor(Math.random()*win.length)];



}else{


combo=0;


stress+=20;


sound(100,0.4);



let lose=[

"🛸え？今撃ったの？🤣",

"残念〜！タイミング迷子",

"こっちだよ〜って言ったのに😏",

"未来予測失敗しました"

];


document.getElementById("message").innerHTML=

lose[Math.floor(Math.random()*lose.length)];



}



if(stress<0){

stress=0;

}


if(stress>100){

stress=100;

}



document.getElementById("combo").innerHTML=
combo;


document.getElementById("score").innerHTML=
score;



document.getElementById("stress").style.width=
stress+"%";



saveScore();



setTimeout(()=>{


document.getElementById("message").innerHTML="";


move();


},1200);



}




function saveScore(){


let data=

JSON.parse(
localStorage.getItem("rank")||"[]"
);



data.push(score);



data.sort((a,b)=>b-a);



data=data.slice(0,5);



localStorage.setItem(
"rank",
JSON.stringify(data)
);



showRank();


}



function showRank(){


let data=

JSON.parse(
localStorage.getItem("rank")||"[]"
);



let html="";



data.forEach((v,i)=>{


html+=

(i+1)+"位 "+v+"点<br>";


});



document.getElementById("ranking").innerHTML=

html || "まだ記録なし";


}


showRank();
