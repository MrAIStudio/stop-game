<script>

/* =====================================================
   基本設定
===================================================== */

const GRAVITY=260;

/* 風を弱くして、追い風時だけ楽しく伸びる */

const WIND_BASE=42;

const PPM=14;

/* 発射速度を大幅アップ */

const LAUNCH_MULT=6.5;

const SWING_ROPE=120;

const SWING_MAX_ANGLE=0.96;

const SWING_PERIOD=1.55;

/* 跳ねやすくする */

const BOUNCE_MIN_SPEED=24;

const STOP_SPEED=7;

const ROLL_DECAY_CONST=2.3;

const BOUNCE_SOFTEN=0.96;

const SETTLE_TIME=1.8;

const MAX_FLIGHT_TIME=45;

const LAUNCH_HEIGHT=140;

const SAVE_KEY="kutsutobashi_save_v3";


/* =====================================================
   靴
===================================================== */

const SHOES=[

{
 id:"sneaker",
 name:"スニーカー",
 emoji:"👟",
 restitution:.72,
 friction:.17,
 drag:.025,
 launchScale:1.08,
 wind:1.0,
 bounce:"normal",
 flavor:"バランス型。よく飛んで、よく跳ねる。"
},

{
 id:"sandal",
 name:"ビーチサンダル",
 emoji:"🩴",
 restitution:.88,
 friction:.20,
 drag:.015,
 launchScale:1.04,
 wind:2.8,
 bounce:"wind",
 flavor:"風に乗れば超強力！追い風で一気に加速。"
},

{
 id:"leather",
 name:"革靴",
 emoji:"👞",
 restitution:.48,
 friction:.045,
 drag:.012,
 launchScale:1.0,
 wind:.45,
 bounce:"roll",
 flavor:"重い。でも一度転がれば止まらない。"
},

{
 id:"boots",
 name:"長靴",
 emoji:"👢",
 restitution:.42,
 friction:.25,
 drag:.035,
 launchScale:.92,
 wind:.5,
 holeSurvive:.85,
 bounce:"heavy",
 flavor:"飛距離は控えめ。でも穴に異常に強い。"
},

{
 id:"heels",
 name:"ハイヒール",
 emoji:"👠",
 restitution:.65,
 friction:.025,
 drag:.02,
 launchScale:1.16,
 wind:1.1,
 wild:true,
 bounce:"wild",
 flavor:"暴れる！うまくハマると爆発的に飛ぶ。"
},

{
 id:"uwabaki",
 name:"上履き",
 emoji:"🥿",
 restitution:.78,
 friction:.13,
 drag:.018,
 launchScale:1.22,
 wind:1.15,
 bounce:"super",
 flavor:"靴飛ばし最強候補。飛距離重視の上履き。"
},

{
 id:"geta",
 name:"下駄",
 emoji:"👡",
 restitution:.30,
 friction:.025,
 drag:.008,
 launchScale:.91,
 wind:.25,
 bounce:"slide",
 flavor:"ほぼ跳ねない。でも地面を猛烈に滑る。"
},

{
 id:"crocs",
 name:"クロックス",
 emoji:"🥾",
 restitution:.76,
 friction:.18,
 drag:.025,
 launchScale:1.06,
 wind:3.2,
 bounce:"wind",
 flavor:"穴だらけで風の影響MAX。追い風なら化ける。"
},

{
 id:"rollerskate",
 name:"ローラースケート",
 emoji:"🛼",
 restitution:.25,
 friction:.008,
 drag:.01,
 launchScale:1.02,
 wind:.75,
 bounce:"roll",
 flavor:"跳ねない。その代わり転がり始めたら止まらない。"

}

];


/* =====================================================
   状態
===================================================== */

let canvas,ctx;

let W=480,H=380;

let state="title";

let course;

let cameraX=0;

let swingT=0;

let selectedShoeId="sneaker";

let shoe={
 x:0,y:0,vx:0,vy:0,
 rotation:0,
 rolling:false,
 overHole:false,
 holeEnterY:0,
 bounceCount:0,
 heelBroken:false,
 heelBrokenTriggered:false
};

let particles=[];

let lastTime=0;

let currentDistanceM=0;

let finalDistanceM=0;

let messageTimer=0;

let audio=null;

let stats={
 best:0,
 plays:0,
 top:[]
};

let windValue=0;

let windAnimT=0;

let settleTimer=0;

let flightTime=0;


/* =====================================================
   ユーティリティ
===================================================== */

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function currentShoe(){
 return SHOES.find(s=>s.id===selectedShoeId);
}

function rollWind(){

 /*
  -1～1
  追い風を少し多めに
 */

 let r=Math.random()*2-1;

 if(r>0){
   r*=1.05;
 }

 windValue=r;
}

function windLabel(){

 let a=Math.abs(windValue);

 if(a<.12)
  return "🌤 無風";

 let strength=
   a<.4?"弱":
   a<.7?"中":"強";

 return windValue>0
   ?"➡️ 追い風 "+strength
   :"⬅️ 向かい風 "+strength;
}


/* =====================================================
   保存
===================================================== */

function loadSave(){

 try{

  let raw=localStorage.getItem(SAVE_KEY);

  if(raw){

   let d=JSON.parse(raw);

   if(d.stats)
    Object.assign(stats,d.stats);

  }

 }catch(e){}

}

function writeSave(){

 try{

  localStorage.setItem(
   SAVE_KEY,
   JSON.stringify({stats})
  );

 }catch(e){}

}


/* =====================================================
   コース生成
===================================================== */

function generateCourse(){

 /*
  以前よりかなり長くする
 */

 const TARGET=30000;

 let current=[{x:0,y:260}];

 let curX=0;

 let curY=260;

 while(curX<TARGET){

  let type;

  if(curX<500){

   type="flat";

  }else{

   let r=Math.random();

   if(r<.15)
     type="ramp";

   else if(r<.48)
     type="down";

   else if(r<.72)
     type="up";

   else
     type="flat";

  }


  if(type==="flat"){

   let len=180+Math.random()*320;

   curX+=len;

   current.push({
    x:curX,
    y:curY
   });

  }


  if(type==="down"){

   let len=260+Math.random()*450;

   curY+=15+Math.random()*45;

   curX+=len;

   current.push({
    x:curX,
    y:curY
   });

  }


  if(type==="up"){

   let len=220+Math.random()*300;

   curY-=15+Math.random()*45;

   curX+=len;

   current.push({
    x:curX,
    y:curY
   });

  }


  if(type==="ramp"){

   let rise=70+Math.random()*70;

   curY-=rise;

   curX+=70+Math.random()*50;

   current.push({
    x:curX,
    y:curY
   });

   curX+=30+Math.random()*30;

   current.push({
    x:curX,
    y:curY
   });

  }


  curY=clamp(curY,80,330);

 }


 curX+=500;

 current.push({
  x:curX,
  y:curY
 });

 return{
  segments:[current],
  holes:[],
  length:curX
 };

}


function groundInfoAt(x){

 for(const seg of course.segments){

  let first=seg[0];
  let last=seg[seg.length-1];

  if(
   x>=first.x-1 &&
   x<=last.x+1
  ){

   for(
    let i=0;
    i<seg.length-1;
    i++
   ){

    if(
     x>=seg[i].x &&
     x<=seg[i+1].x
    ){

     let dx=
       (seg[i+1].x-seg[i].x)||1;

     let t=
       (x-seg[i].x)/dx;

     let y=
       seg[i].y+
       (seg[i+1].y-seg[i].y)*t;

     let slope=
       (seg[i+1].y-seg[i].y)/dx;

     return{
      y,
      slope
     };

    }

   }

  }

 }

 return null;

}


/* =====================================================
   跳ね返り
===================================================== */

function bounceVelocity(
 vx,vy,slope,restitution
){

 let len=Math.sqrt(
  slope*slope+1
 );

 let nx=slope/len;

 let ny=-1/len;

 let dot=
  vx*nx+
  vy*ny;

 let rx=
  vx-2*dot*nx;

 let ry=
  vy-2*dot*ny;

 return{
  vx:rx*restitution,
  vy:ry*restitution
 };

}


/* =====================================================
   物理
===================================================== */

function physicsStep(dt){

 const variant=currentShoe();


 /* 空気抵抗 */

 shoe.vx*=
  (1-variant.drag*dt);

 shoe.vy+=
  GRAVITY*dt;


 /* 風 */

 let windPower=
  windValue*
  WIND_BASE*
  variant.wind;


 /*
  空中は風の影響を弱める。
  追い風はしっかり感じる。
 */

 shoe.vx+=
  windPower*dt;


 /* 特殊：ローラー系は転がり中に強い */

 if(
  shoe.rolling &&
  variant.bounce==="roll"
 ){

  shoe.vx+=
   windValue*WIND_BASE*.4*dt;

 }


 shoe.x+=
  shoe.vx*dt;

 shoe.y+=
  shoe.vy*dt;


 shoe.rotation+=
  shoe.vx*dt*.065;


 currentDistanceM=
  Math.max(
   0,
   shoe.x/PPM
  );


 updateHud();


 /* 追い風演出 */

 if(
  windValue>.65 &&
  Math.random()<.035
 ){

  flashMessage("🌬️ 風に乗った！！");

  spawnWindBurst(
   shoe.x,
   shoe.y,
   12
  );

 }


 /* コース制覇 */

 if(
  shoe.x>=course.length
 ){

  finishRun(true,false);

  return;

 }


 let g=
  groundInfoAt(shoe.x);


 if(!g)
  return;


 let groundY=g.y;


 /* =================================================
    転がり
 ================================================= */

 if(shoe.rolling){

  let slopeAngle=
   Math.atan(g.slope);


  /*
   坂を下ると加速
  */

  shoe.vx+=
   GRAVITY*
   Math.sin(slopeAngle)*
   dt;


  let fric=
   variant.friction;


  /*
   停止しにくくする
  */

  let k=
   fric*
   ROLL_DECAY_CONST*
   Math.max(
    .25,
    Math.cos(slopeAngle)
   );


  shoe.vx*=
   Math.exp(-k*dt);


  shoe.y=
   groundY-SHOE_RADIUS;


  shoe.vy=0;


  /*
   スピードが十分ある限り、
   基本的には走り続ける
  */

  if(
   Math.abs(shoe.vx)<STOP_SPEED
  ){

   settleTimer+=dt;

  }else{

   settleTimer=0;

  }


  /*
   下駄・革靴・ローラーは
   特に転がる
  */

  if(
   variant.bounce==="roll" ||
   variant.bounce==="slide"
  ){

   if(
    Math.abs(shoe.vx)>20
   ){

    settleTimer=0;

   }

  }


  if(
   settleTimer>SETTLE_TIME
  ){

   finishRun(false,false);

   return;

  }


 }else{


 /* =================================================
    空中から着地
 ================================================= */

 if(
  shoe.y+SHOE_RADIUS>=groundY
 ){

  shoe.y=
   groundY-SHOE_RADIUS;


  let speed=
   Math.hypot(
    shoe.vx,
    shoe.vy
   );


  /*
   速度が残っていれば跳ねる
  */

  if(
   speed>BOUNCE_MIN_SPEED
  ){

   let rest=
    variant.restitution;


   /*
    ハイヒールはランダム性
   */

   if(variant.wild){

    rest+=
     Math.random()*.35-.1;

    rest=
     clamp(rest,.35,1.15);

   }


   /*
    跳ねるたびに少しずつ弱くするが
    以前よりかなり緩やか
   */

   let decay=
    Math.pow(
     .94,
     Math.min(
      shoe.bounceCount,
      8
     )
    );


   rest*=
    BOUNCE_SOFTEN*
    decay;


   /*
    特殊補正
   */

   if(
    variant.bounce==="super"
   ){

    rest*=1.12;

   }

   if(
    variant.bounce==="heavy"
   ){

    rest*=.85;

   }

   if(
    variant.bounce==="slide"
   ){

    rest*=.55;

   }


   let res=
    bounceVelocity(
     shoe.vx,
     shoe.vy,
     g.slope,
     rest
    );


   shoe.vx=
    res.vx;

   shoe.vy=
    res.vy;


   shoe.bounceCount++;


   spawnBurst(
    shoe.x,
    shoe.y,
    8
   );


   /*
    ポンッ！演出
   */

   if(
    shoe.bounceCount%2===0
   ){

    flashMessage(
     "ポンッ！ 跳ねた！"
    );

   }


   playBounceSound(speed);


  }else{

   /*
    低速になったら転がりへ
   */

   shoe.rolling=true;

   shoe.vy=0;

  }

 }

 }

}


/* =====================================================
   発射
===================================================== */

function release(){

 if(state!=="aiming")
  return;


 const A=
  SWING_MAX_ANGLE;

 const w=
  2*Math.PI/SWING_PERIOD;


 const theta=
  A*Math.sin(
   w*swingT
  );


 const thetaSpeed=
  A*w*Math.cos(
   w*swingT
  );


 const variant=
  currentShoe();


 /*
  ブランコの実際の速度のみで判定。
  ゲージなし。
 */

 let vxBase=
  thetaSpeed*
  SWING_ROPE*
  Math.cos(theta);


 let vyBase=
  -thetaSpeed*
  SWING_ROPE*
  Math.sin(theta);


 /*
  発射倍率大幅アップ
 */

 let scale=
  LAUNCH_MULT*
  variant.launchScale;


 shoe.x=0;


 let g0=
  groundInfoAt(0);


 shoe.y=
  (g0?g0.y:300)-
  LAUNCH_HEIGHT;


 shoe.vx=
  vxBase*scale;


 shoe.vy=
  vyBase*scale;


 /*
  失敗してもある程度は飛ぶ
 */

 if(shoe.vx<40){

  shoe.vx+=
   100+
   Math.random()*80;

 }


 shoe.rotation=0;

 shoe.rolling=false;

 shoe.overHole=false;

 shoe.bounceCount=0;

 shoe.heelBroken=
  (
   variant.id==="heels" &&
   Math.random()<.16
  );

 shoe.heelBrokenTriggered=false;

 currentDistanceM=0;

 state="flight";


 if(
  windValue>.55
 ){

  flashMessage(
   "🌬️ 追い風だ！！"
  );

 }else{

  flashMessage(
   "とんだーー！！"
  );

 }


 playLaunchSound();

}


/* =====================================================
   パーティクル
===================================================== */

function spawnBurst(x,y,n){

 for(let i=0;i<n;i++){

  let a=
   Math.random()*
   Math.PI*2;

  let sp=
   70+
   Math.random()*180;

  particles.push({

   x,
   y,

   vx:
    Math.cos(a)*sp,

   vy:
    Math.sin(a)*sp-60,

   life:.55,

   maxLife:.55,

   color:"255,220,150",

   r:
    2+
    Math.random()*3

  });

 }

}


function spawnWindBurst(x,y,n){

 for(let i=0;i<n;i++){

  particles.push({

   x:x-Math.random()*100,

   y:y+(Math.random()*80-40),

   vx:
    80+
    Math.random()*160,

   vy:
    Math.random()*30-15,

   life:.4,

   maxLife:.4,

   color:"255,255,255",

   r:1+Math.random()*2

  });

 }

}


function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  let p=particles[i];

  p.x+=p.vx*dt;

  p.y+=p.vy*dt;

  p.vy+=300*dt;

  p.life-=dt;

  if(p.life<=0)
   particles.splice(i,1);

 }

}


/* =====================================================
   サウンド
===================================================== */

function getAudio(){

 if(!audio){

  audio=
   new(
    window.AudioContext||
    window.webkitAudioContext
   )();

 }

 if(audio.state==="suspended")
  audio.resume();

 return audio;

}


function tone(
 freqStart,
 freqEnd,
 dur,
 type,
 vol
){

 let a=getAudio();

 let osc=
  a.createOscillator();

 let gain=
  a.createGain();

 osc.type=
  type||"sine";

 osc.frequency.setValueAtTime(
  freqStart,
  a.currentTime
 );

 osc.frequency.exponentialRampToValueAtTime(
  Math.max(30,freqEnd),
  a.currentTime+dur
 );

 gain.gain.setValueAtTime(
  vol||.25,
  a.currentTime
 );

 gain.gain.exponentialRampToValueAtTime(
  .001,
  a.currentTime+dur
 );

 osc.connect(gain);

 gain.connect(a.destination);

 osc.start();

 osc.stop(
  a.currentTime+dur
 );

}


function playLaunchSound(){
 tone(250,1000,.3,"sawtooth",.18);
}

function playBounceSound(speed){

 let p=
  clamp(
   speed/800,
   .2,
   1
  );

 tone(
  220+p*450,
  90,
  .13,
  "sine",
  .18
 );

}

function finishRun(

){

  return;

 );

 );

  stats.top.slice(0,5);

  reachedEnd,

 );

}

   ).clientWidth||480,

  );

 W=canvas.width;

 H=canvas.height;

/* =====================================================
   背景
===================================================== */

function drawSky(){

 let grad=
  ctx.createLinearGradient(
   0,0,0,H
  );

 grad.addColorStop(
  0,
  "#65bce9"
 );

 grad.addColorStop(
  .55,
  "#c8edff"
 );

 grad.addColorStop(
  1,
  "#fff5df"
 );

 ctx.fillStyle=grad;

 ctx.fillRect(
  0,0,W,H
 );


 /* 太陽 */

 ctx.beginPath();

 ctx.fillStyle=
  "#ffe77b";

 ctx.arc(
  W-55,
  48,
  28,
  0,
  Math.PI*2
 );

 ctx.fill();

}


/* =====================================================
   富士山風景
===================================================== */

function drawMountains(camX){

 /*
  遠景の山
 */

 function mountain(
  offset,
  baseY,
  peak,
  width,
  color
 ){

  let x=
   -((camX*offset)%width);

  while(x<W+width){

   ctx.fillStyle=color;

   ctx.beginPath();

   ctx.moveTo(
    x,
    baseY
   );

   ctx.lineTo(
    x+width*.5,
    peak
   );

   ctx.lineTo(
    x+width,
    baseY
   );

   ctx.closePath();

   ctx.fill();

   x+=width;

  }

 }


 mountain(
  .08,
  235,
  110,
  320,
  "#9cc3cf"
 );

 mountain(
  .14,
  255,
  145,
  250,
  "#79aab7"
 );


 /*
  富士山っぽい大きな山
 */

 let fx=
  320-
  ((camX*.22)%720);

 while(fx<W+300){

  ctx.fillStyle=
   "#668c9a";

  ctx.beginPath();

  ctx.moveTo(
   fx-170,
   265
  );

  ctx.lineTo(
   fx,
   85
  );

  ctx.lineTo(
   fx+175,
   265
  );

  ctx.closePath();

  ctx.fill();


  /*
   雪
  */

  ctx.fillStyle=
   "#ffffffdd";

  ctx.beginPath();

  ctx.moveTo(
   fx-55,
   140
  );

  ctx.lineTo(
   fx,
   85
  );

  ctx.lineTo(
   fx+58,
   140
  );

  ctx.lineTo(
   fx+32,
   130
  );

  ctx.lineTo(
   fx+10,
   153
  );

  ctx.lineTo(
   fx-8,
   132
  );

  ctx.lineTo(
   fx-30,
   153
  );

  ctx.closePath();

  ctx.fill();


  fx+=720;

 }

}


/* =====================================================
   雲
===================================================== */

function drawClouds(camX){

 ctx.fillStyle=
  "#ffffffcc";

 for(let i=0;i<6;i++){

  let base=
   i*260-
   ((camX*.12)%260);

  let cx=
   ((base%(W+300))+
   W+300)%(W+300)-100;

  let cy=
   35+
   (i*31)%65;


  ctx.beginPath();

  ctx.ellipse(
   cx,
   cy,
   32,
   16,
   0,
   0,
   Math.PI*2
  );

  ctx.ellipse(
   cx+25,
   cy+5,
   22,
   13,
   0,
   0,
   Math.PI*2
  );

  ctx.ellipse(
   cx-25,
   cy+6,
   20,
   12,
   0,
   0,
   Math.PI*2
  );

  ctx.fill();

 }

}


/* =====================================================
   風
===================================================== */

function drawWind(){

 let a=
  Math.abs(windValue);

 if(a<.12)
  return;


 ctx.strokeStyle=
  "rgba(255,255,255,.5)";

 ctx.lineWidth=2;


 let dir=
  windValue>0?1:-1;


 for(let i=0;i<5;i++){

  let y=
   60+i*25;

  let x=
   ((windAnimT*260*dir+i*140)
    %(W+120));

  if(x<0)
   x+=W+120;


  ctx.beginPath();

  ctx.moveTo(
   x,
   y
  );

  ctx.lineTo(
   x+dir*30,
   y
  );

  ctx.stroke();

 }

}


/* =====================================================
   地面
===================================================== */

function drawGround(camX){

 for(const seg of course.segments){

  let first=seg[0];

  let last=
   seg[seg.length-1];


  if(
   last.x-camX<-60 ||
   first.x-camX>W+60
  )
   continue;


  ctx.beginPath();

  ctx.moveTo(
   seg[0].x-camX,
   seg[0].y
  );


  for(
   let i=1;
   i<seg.length;
   i++
  ){

   ctx.lineTo(
    seg[i].x-camX,
    seg[i].y
   );

  }


  ctx.lineTo(
   last.x-camX,
   H
  );

  ctx.lineTo(
   first.x-camX,
   H
  );

  ctx.closePath();


  let grad=
   ctx.createLinearGradient(
    0,
    first.y,
    0,
    H
   );

  grad.addColorStop(
   0,
   "#8bd15b"
  );

  grad.addColorStop(
   .1,
   "#5da83c"
  );

  grad.addColorStop(
   .1,
   "#c98b4d"
  );

  grad.addColorStop(
   1,
   "#81552e"
  );


  ctx.fillStyle=grad;

  ctx.fill();


  ctx.strokeStyle=
   "#4f903b";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
   seg[0].x-camX,
   seg[0].y
  );


  for(
   let i=1;
   i<seg.length;
   i++
  ){

   ctx.lineTo(
    seg[i].x-camX,
    seg[i].y
   );

  }

  ctx.stroke();

 }

}


/* =====================================================
   ブランコ
===================================================== */

function drawSwing(){

 const pivotX=90;

 const pivotY=110;


 const A=
  SWING_MAX_ANGLE;

 const w=
  2*Math.PI/SWING_PERIOD;


 const theta=
  A*Math.sin(
   w*swingT
  );


 const thetaSpeed=
  A*w*Math.cos(
   w*swingT
  );


 const seatX=
  pivotX+
  Math.sin(theta)*
  SWING_ROPE;


 const seatY=
  pivotY+
  Math.cos(theta)*
  SWING_ROPE;


 /*
  ブランコ本体
 */

 ctx.strokeStyle=
  "#806044";

 ctx.lineWidth=8;

 ctx.lineCap="round";


 ctx.beginPath();

 ctx.moveTo(
  pivotX-46,
  H-2
 );

 ctx.lineTo(
  pivotX,
  pivotY-8
 );

 ctx.lineTo(
  pivotX+46,
  H-2
 );

 ctx.stroke();


 ctx.beginPath();

 ctx.moveTo(
  pivotX-46,
  pivotY-4
 );

 ctx.lineTo(
  pivotX+46,
  pivotY-4
 );

 ctx.stroke();


 /*
  タイミングが良い方向に
  近づいたら光る
 */

 let sweet=
  thetaSpeed>1.2;


 ctx.strokeStyle=
  sweet
   ?"rgba(255,207,80,.9)"
   :"#c5b49f";

 ctx.lineWidth=3;


 ctx.beginPath();

 ctx.moveTo(
  pivotX,
  pivotY
 );

 ctx.lineTo(
  seatX,
  seatY
 );

 ctx.stroke();


 if(sweet){

  ctx.beginPath();

  ctx.fillStyle=
   "rgba(255,205,70,.25)";

  ctx.arc(
   seatX,
   seatY,
   27,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 ctx.font=
  "30px sans-serif";

 ctx.fillText(
  "🧒",
  seatX,
  seatY-6
 );


 ctx.font=
  "18px sans-serif";

 ctx.fillText(
  currentShoe().emoji,
  seatX+10,
  seatY+16
 );


 ctx.fillStyle=
  "#806044";

 ctx.fillRect(
  seatX-14,
  seatY+2,
  28,
  6
 );

}


/* =====================================================
   パーティクル
===================================================== */

function drawParticles(camX){

 for(const p of particles){

  ctx.beginPath();

  ctx.fillStyle=
   "rgba("+
   p.color+
   ","+
   clamp(
    p.life/p.maxLife,
    0,
    1
   )+
   ")";

  ctx.arc(
   p.x-camX,
   p.y,
   p.r,
   0,
   Math.PI*2
  );

  ctx.fill();

 }

}


/* =====================================================
   靴
===================================================== */

function drawShoe(camX){

 ctx.save();

 ctx.translate(
  shoe.x-camX,
  shoe.y
 );

 ctx.rotate(
  shoe.rotation
 );

 ctx.font=
  "30px sans-serif";


 ctx.fillText(
  currentShoe().emoji,
  0,
  0
 );

 ctx.restore();

}


/* =====================================================
   描画
===================================================== */

function draw(){

 if(!ctx)
  return;


 ctx.clearRect(
  0,0,W,H
 );


 drawSky();


 let camX=
  state==="aiming"
   ?0
   :cameraX;


 drawMountains(camX);

 drawClouds(camX);

 drawWind();

 drawGround(camX);


 if(state==="aiming")
  drawSwing();


 drawParticles(camX);


 if(
  state==="flight" ||
  state==="result"
 ){

  drawShoe(camX);

 }

}


/* =====================================================
   メインループ
===================================================== */

function update(dt){

 windAnimT+=dt;


 if(state==="aiming"){

  swingT+=dt;

 }


 else if(state==="flight"){

  flightTime+=dt;

  physicsStep(dt);


  if(state==="flight"){

   /*
    カメラを少し後ろに置いて
    飛んでいる靴を長く眺められる
   */

   cameraX=
    Math.max(
     0,
     shoe.x-W*.38
    );

  }

 }


 updateParticles(dt);

}


function frame(ts){

 if(!lastTime)
  lastTime=ts;


 let dt=
  Math.min(
   (ts-lastTime)/1000,
   .033
  );


 lastTime=ts;


 update(dt);

 draw();


 requestAnimationFrame(frame);

}


/* =====================================================
   初期化
===================================================== */

loadSave();

buildShoeGrid();

renderTitleStats();

requestAnimationFrame(frame);

</script>
